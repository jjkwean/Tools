                    dragState.type = 'multi_shapes';
                    dragState.origMultiShapes = selectedShapeIndices.map(sIdx => ({
                        index: sIdx, shape: shapes[sIdx].map(p => ({ ...p }))
                    }));
                } else if (target.type === 'vertex') {
                    dragState.origV = { ...shape[target.vertexIndex] };
                } else if (target.type === 'edge') {
                    dragState.origV1 = { ...shape[target.v1] }; dragState.origV2 = { ...shape[target.v2] };
                } else if (target.type === 'shape' || target.type === 'bb_handle') {
                    dragState.origShape = shape.map(p => ({...p}));
                }
            } else {
                if (mode === 'select' && !e.shiftKey) {
                    selectedShapeIndices = []; updatePanels(null); draw();
                }
                dragState = { type: 'selection', startX: pos.x, startY: pos.y, moved: false };
            }
        }

        function handlePointerMove(e) {
            const physicalPos = getPointerPos(e); 
            if (isPanning) {
                originX = physicalPos.x - panStartX; originY = physicalPos.y - panStartY; draw(); return;
            }
            
            const pos = getLogicalPos(physicalPos); 
            lastMouseLogicalPos = pos;
            const target = getHitTarget(pos.x, pos.y, dragState && dragState.shapeIndex !== undefined ? dragState.shapeIndex : -1);
            hoverState = target;

            if (selectedShapeIndices.length !== 1) {
                let activeShapeIndex = target ? target.shapeIndex : null;
                updatePanels(activeShapeIndex);
            } else {
                updatePanels(lockedShapeIndex, true);
            }

            if (dragState) {
                const dx = pos.x - dragState.startX, dy = pos.y - dragState.startY;
                if (Math.sqrt(dx*dx + dy*dy) > (5/globalScale)) {
                    dragState.moved = true;
                    if (mode === 'draw' && dragState.type === 'selection') setMode('select');
                }

                if (dragState.moved) {
                    if (dragState.type === 'selection') {
                        selectionBox = { startX: dragState.startX, startY: dragState.startY, endX: pos.x, endY: pos.y };
                        if (mode === 'select') {
                            const newSelected = [];
                            shapes.forEach((s, idx) => { if (isShapeInBox(s, selectionBox)) newSelected.push(idx); });
                            selectedShapeIndices = newSelected; updatePanels(lockedShapeIndex);
                        }
                    } else {
                        const shape = shapes[dragState.shapeIndex];
                        if (dragState.type === 'multi_shapes') {
                            dragState.origMultiShapes.forEach(item => {
                                const targetS = shapes[item.index];
                                for (let i = 0; i < targetS.length; i++) {
                                    targetS[i].x = item.shape[i].x + dx; targetS[i].y = item.shape[i].y + dy;
                                }
                            });
                            applyConstraints();
                        } else if (dragState.type === 'bb_handle') {
                            const origCx = dragState.cx, origCy = dragState.cy;
                            const startDist = Math.sqrt(Math.pow(dragState.startX - origCx, 2) + Math.pow(dragState.startY - origCy, 2));
                            const currentDist = Math.sqrt(Math.pow(pos.x - origCx, 2) + Math.pow(pos.y - origCy, 2));
                            
                            if (startDist > 0) {
                                let scale = currentDist / startDist;
                                if (dragState.handleIndex === 1 || dragState.handleIndex === 5) scale = Math.abs(pos.y - origCy) / Math.abs(dragState.startY - origCy);
                                else if (dragState.handleIndex === 3 || dragState.handleIndex === 7) scale = Math.abs(pos.x - origCx) / Math.abs(dragState.startX - origCx);
                                if (scale > 0.01) {
                                    for (let i = 0; i < shape.length; i++) { 
                                        shape[i].x = origCx + (dragState.origShape[i].x - origCx) * scale; 
                                        shape[i].y = origCy + (dragState.origShape[i].y - origCy) * scale; 
                                    }
                                }
                            }
                            applyConstraints();
                        } else if (dragState.type === 'vertex') {
                            let p = shape[dragState.vertexIndex];
                            p.x = dragState.origV.x + dx; p.y = dragState.origV.y + dy;
                            let snapHit = getHitTarget(p.x, p.y, dragState.shapeIndex);
                            if (snapHit) {
                                let targetShape = shapes[snapHit.shapeIndex];
                                if (snapHit.type === 'vertex') {
                                    p.x = targetShape[snapHit.vertexIndex].x; p.y = targetShape[snapHit.vertexIndex].y;
                                    p.attachedTo = { shapeId: targetShape.id, type: 'vertex', vertexIndex: snapHit.vertexIndex };
                                } else if (snapHit.type === 'edge') {
                                    let p1 = targetShape[snapHit.v1], p2 = targetShape[snapHit.v2], l2 = dist2(p1, p2);
                                    let t = l2 > 0 ? Math.max(0, Math.min(1, ((p.x - p1.x)*(p2.x - p1.x) + (p.y - p1.y)*(p2.y - p1.y))/l2)) : 0;
                                    p.x = p1.x + t * (p2.x - p1.x); p.y = p1.y + t * (p2.y - p1.y);
                                    p.attachedTo = { shapeId: targetShape.id, type: 'edge', v1: snapHit.v1, v2: snapHit.v2, t };
                                } else if (snapHit.type === 'circle_edge' || snapHit.type === 'sector_edge') {
                                    let C = targetShape[0], P1 = targetShape[1], R = Math.sqrt(dist2(C, P1));
                                    let angle = Math.atan2(p.y - C.y, p.x - C.x);
                                    p.x = C.x + R * Math.cos(angle); p.y = C.y + R * Math.sin(angle);
                                    p.attachedTo = { shapeId: targetShape.id, type: 'circle_edge', angle };
                                } else if (snapHit.type === 'midpoint') {
                                    p.x = snapHit.x; p.y = snapHit.y;
                                    p.attachedTo = { shapeId: targetShape.id, type: 'edge', v1: snapHit.v1, v2: snapHit.v2, t: 0.5 };
                                }
                            } else {
                                delete p.attachedTo;
                            }
                            applyConstraints();
                            
                            if (shape.type === 'sector') {
                                const c = shape[0];
                                const r = Math.sqrt(dist2(c, shape[1]));
                                if (dragState.vertexIndex === 1) {
                                    const a2 = Math.atan2(shape[2].y - c.y, shape[2].x - c.x);
                                    shape[2].x = c.x + r * Math.cos(a2); shape[2].y = c.y + r * Math.sin(a2);
                                } else if (dragState.vertexIndex === 2 || dragState.vertexIndex === 0) {
                                    const a2 = Math.atan2(shape[2].y - c.y, shape[2].x - c.x);
                                    shape[2].x = c.x + r * Math.cos(a2); shape[2].y = c.y + r * Math.sin(a2);
                                }
                            }
                        } else if (dragState.type === 'edge') {
                            shape[dragState.v1].x = dragState.origV1.x + dx; shape[dragState.v1].y = dragState.origV1.y + dy;
                            shape[dragState.v2].x = dragState.origV2.x + dx; shape[dragState.v2].y = dragState.origV2.y + dy;
                            applyConstraints();
                        } else if (dragState.type === 'shape') {
                            for (let i = 0; i < shape.length; i++) { 
                                shape[i].x = dragState.origShape[i].x + dx; shape[i].y = dragState.origShape[i].y + dy; 
                            }
                            applyConstraints();
                        }
                    }
                }
                draw();
            } else {
                if (isSpaceDown) canvas.style.cursor = 'grab';
                else if (!target) canvas.style.cursor = (mode === 'draw' ? 'crosshair' : 'default');
                else canvas.style.cursor = 'pointer';
                draw();
            }
        }

        function handlePointerUp(e) {
            if (isPanning && (e.button === 1 || e.button === 0)) {
                isPanning = false; canvas.style.cursor = isSpaceDown ? 'grab' : (mode === 'draw' ? 'crosshair' : 'default'); return;
            }
            if (e.button !== 0) return;
            
            if (dragState) {
                let wasMoved = dragState.moved;
                const pos = getLogicalPos(getPointerPos(e));

                if (!wasMoved && mode === 'draw' && drawType === 'tangent') {
                    if (!tangentStartPoint) {
                        tangentStartPoint = { x: pos.x, y: pos.y };
                        if(instructionBanner) instructionBanner.innerHTML = "💡 <strong>접선 모드:</strong> 이제 접선을 연결할 <strong>원 중심선 혹은 경계</strong>를 클릭하세요.";
                    } else {
                        let hit = getHitTarget(pos.x, pos.y);
                        if (hit && shapes[hit.shapeIndex] && shapes[hit.shapeIndex].type === 'circle') {
                            addTangentsFromPointToCircle(tangentStartPoint.x, tangentStartPoint.y, shapes[hit.shapeIndex]);
                            tangentStartPoint = null;
                            if(instructionBanner) instructionBanner.innerHTML = "💡 <strong>접선 작도 완료.</strong> 새로운 외부 점을 클릭하거나 다른 도구를 선택하세요.";
                        } else {
                            showToast("원이 선택되지 않았습니다. 원을 정확히 클릭해주세요.");
                        }
                    }
                    dragState = null; draw(); return;
                }

                if (wasMoved) {
                    if (dragState.type === 'selection' && selectionBox) {
                        const minX = Math.min(selectionBox.startX, selectionBox.endX);
                        const maxX = Math.max(selectionBox.startX, selectionBox.endX);
                        const minY = Math.min(selectionBox.startY, selectionBox.endY);
                        const maxY = Math.max(selectionBox.startY, selectionBox.endY);
                        if (maxX - minX >= 10 && maxY - minY >= 10) {
                            openPrintPreview(selectionBox, selectedShapeIndices.length > 0 ? selectedShapeIndices : null);
                        } else {
                            selectionBox = null;
                        }
                    } else if (dragState.type !== 'selection') {
                        saveHistory();
                        if (dragState.type === 'vertex' && shapes[dragState.shapeIndex][dragState.vertexIndex].attachedTo) {
                            showToast('🔗 교점으로 연결(스냅) 되었습니다');
                        }
                    }
                } else {
                    if (mode === 'draw' && drawType !== 'regular') {
                        let closed = false;
                        let pPos = { x: pos.x, y: pos.y };

                        let snapHit = getHitTarget(pPos.x, pPos.y);
                        let snapAttachInfo = null;
                        if (snapHit) {
                            let targetShape = shapes[snapHit.shapeIndex];
                            if (snapHit.type === 'vertex') {
                                pPos.x = targetShape[snapHit.vertexIndex].x; pPos.y = targetShape[snapHit.vertexIndex].y;
                                snapAttachInfo = { shapeId: targetShape.id, type: 'vertex', vertexIndex: snapHit.vertexIndex };
                            } else if (snapHit.type === 'edge') {
                                let p1 = targetShape[snapHit.v1], p2 = targetShape[snapHit.v2], l2 = dist2(p1, p2);
                                let t = l2 > 0 ? Math.max(0, Math.min(1, ((pPos.x - p1.x)*(p2.x - p1.x) + (pPos.y - p1.y)*(p2.y - p1.y))/l2)) : 0;
                                pPos.x = p1.x + t * (p2.x - p1.x); pPos.y = p1.y + t * (p2.y - p1.y);
                                snapAttachInfo = { shapeId: targetShape.id, type: 'edge', v1: snapHit.v1, v2: snapHit.v2, t };
                            } else if (snapHit.type === 'circle_edge' || snapHit.type === 'sector_edge') {
                                let C = targetShape[0], P1 = targetShape[1], R = Math.sqrt(dist2(C, P1));
                                let angle = Math.atan2(pPos.y - C.y, pPos.x - C.x);
                                pPos.x = C.x + R * Math.cos(angle); pPos.y = C.y + R * Math.sin(angle);
                                snapAttachInfo = { shapeId: targetShape.id, type: 'circle_edge', angle };
                            } else if (snapHit.type === 'midpoint') {
                                pPos.x = snapHit.x; pPos.y = snapHit.y;
                                snapAttachInfo = { shapeId: targetShape.id, type: 'edge', v1: snapHit.v1, v2: snapHit.v2, t: 0.5 };
                            }
                        }

                        if (drawType === 'polygon' && currentShape.length > 2) {
                            const startPoint = currentShape[0];
                            if (Math.sqrt(dist2(pos, startPoint)) <= closeThreshold / globalScale) {
                                const newShape = [...currentShape]; newShape.type = 'polygon'; newShape.id = generateId();
                                shapes.push(newShape); currentShape = []; applyConstraints(); saveHistory(); closed = true;
                            }
                        }
                        
                        if (!closed) {
                            let labelStr = getAlphabetLabel(globalVertexCount++);
                            if (drawType === 'circle' && currentShape.length === 0) labelStr = 'O';

                            let newPt = {
                                x: pPos.x, y: pPos.y, 
                                showAngle: defaultAngleCheck.checked, 
                                showLength: defaultLengthCheck.checked, 
                                label: labelStr 
                            };
                            if (snapAttachInfo) newPt.attachedTo = snapAttachInfo;

                            currentShape.push(newPt);
                            
                            if (drawType === 'line' && currentShape.length === 2) { 
                                const newShape = [...currentShape]; newShape.type = 'line'; newShape.id = generateId(); 
                                shapes.push(newShape); currentShape = []; 
                            } else if (drawType === 'circle' && currentShape.length === 2) { 
                                const newShape = [...currentShape]; newShape.type = 'circle'; newShape.id = generateId(); 
                                shapes.push(newShape); currentShape = []; 
                            }
                            applyConstraints(); saveHistory();
                        }
                    }
                }
                dragState = null; draw();
            }
        }

        function handleContextMenu(e) {
            e.preventDefault(); if (isPanning) return; 
            const physicalPos = getPointerPos(e);
            const pos = getLogicalPos(physicalPos);
            const target = getHitTarget(pos.x, pos.y);

            if (target) {
                const hitGroupIndices = getGroupIndices(target.shapeIndex);
                if (!hitGroupIndices.every(idx => selectedShapeIndices.includes(idx))) selectedShapeIndices = [...hitGroupIndices];
                setMode('select'); updatePanels(lockedShapeIndex); draw();

                contextMenu.innerHTML = '';

                const printItem = document.createElement('button');
                printItem.className = 'w-full text-left px-4 py-2 hover:bg-emerald-50 text-emerald-700 flex items-center gap-2 border-b border-gray-100 font-semibold';
                printItem.innerHTML = '<span>🖨️</span> 선택 도형 인쇄 / 저장';
                printItem.onclick = () => { printSelectedShapes(); contextMenu.classList.add('hidden'); };
                contextMenu.appendChild(printItem);

                if (target.type === 'edge') {
                    const parallelBtn = document.createElement('button');
                    parallelBtn.className = 'w-full text-left px-4 py-2 hover:bg-blue-50 text-blue-700 flex items-center gap-2 font-semibold border-b border-gray-100 text-xs';
                    parallelBtn.innerHTML = '<span>∥</span> 이 선분과 평행선 생성';
                    parallelBtn.onclick = () => { createParallelLine(target.shapeIndex, target.v1, target.v2); contextMenu.classList.add('hidden'); };
                    contextMenu.appendChild(parallelBtn);

                    const perpBtn = document.createElement('button');
                    perpBtn.className = 'w-full text-left px-4 py-2 hover:bg-purple-50 text-purple-700 flex items-center gap-2 font-semibold border-b border-gray-100 text-xs';
                    perpBtn.innerHTML = '<span>⟂</span> 이 선분에 수직선 생성';
                    perpBtn.onclick = () => { createPerpendicularLine(target.shapeIndex, target.v1, target.v2); contextMenu.classList.add('hidden'); };
                    contextMenu.appendChild(perpBtn);
                } else if (target.type === 'vertex' && shapes[target.shapeIndex].type === 'polygon' && shapes[target.shapeIndex].length >= 3) {
                    const bisectBtn = document.createElement('button');
                    bisectBtn.className = 'w-full text-left px-4 py-2 hover:bg-amber-50 text-amber-700 flex items-center gap-2 font-semibold border-b border-gray-100 text-xs';
                    bisectBtn.innerHTML = '<span>📐</span> 내각의 이등분선 생성';
                    bisectBtn.onclick = () => { createAngleBisector(target.shapeIndex, target.vertexIndex); contextMenu.classList.add('hidden'); };
                    contextMenu.appendChild(bisectBtn);
                }

                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'w-full text-left px-4 py-2 hover:bg-red-50 text-red-600 flex items-center gap-2 mt-1 font-semibold';
                deleteBtn.innerHTML = '<span>🗑️</span> 삭제';
                deleteBtn.onclick = () => { deleteSelectedShapes(); contextMenu.classList.add('hidden'); };
                contextMenu.appendChild(deleteBtn);

                contextMenu.style.left = e.clientX + 'px'; contextMenu.style.top = e.clientY + 'px';
                contextMenu.classList.remove('hidden');
            } else { contextMenu.classList.add('hidden'); }
        }

        function renderBoundsToPreview(bounds, targetIndices) {
            const padding = 24 / globalScale;
            const minX = bounds.minX - padding, minY = bounds.minY - padding, maxX = bounds.maxX + padding, maxY = bounds.maxY + padding;
            const w = maxX - minX, h = maxY - minY;
            if (w < 5 || h < 5) return;

            const resolvedIndices = (targetIndices && targetIndices.length > 0)
                ? [...targetIndices]
                : shapes.map((_, i) => i);

            lastExportContext = {
                indices: resolvedIndices,
                bounds: { minX, minY, maxX, maxY, w, h }
            };

            draw(true, targetIndices);
            const screenMinX = (minX * globalScale) + originX, screenMinY = (minY * globalScale) + originY;
            const screenW = w * globalScale, screenH = h * globalScale, dpr = window.devicePixelRatio || 1;

            const cropCanvas = document.createElement('canvas');
            cropCanvas.width = Math.max(1, Math.round(screenW * dpr));
            cropCanvas.height = Math.max(1, Math.round(screenH * dpr));
            const cropCtx = cropCanvas.getContext('2d');
            cropCtx.fillStyle = '#ffffff';
            cropCtx.fillRect(0, 0, cropCanvas.width, cropCanvas.height);

            const srcX = Math.max(0, screenMinX * dpr);
            const srcY = Math.max(0, screenMinY * dpr);
            const srcRight = Math.min(canvas.width, (screenMinX + screenW) * dpr);
            const srcBottom = Math.min(canvas.height, (screenMinY + screenH) * dpr);
            const copyW = srcRight - srcX;
            const copyH = srcBottom - srcY;

            if (copyW > 0 && copyH > 0) {
                const dstX = srcX - screenMinX * dpr;
                const dstY = srcY - screenMinY * dpr;
                cropCtx.drawImage(canvas, srcX, srcY, copyW, copyH, dstX, dstY, copyW, copyH);
            }

            printPreviewImg.src = cropCanvas.toDataURL('image/png');
            printModal.classList.remove('hidden');
            draw(false);
        }

        function openPrintPreview(boxOrBounds = null, targetIndices = null) {
            if (boxOrBounds && boxOrBounds.startX !== undefined) {
                const minX = Math.min(boxOrBounds.startX, boxOrBounds.endX);
                const maxX = Math.max(boxOrBounds.startX, boxOrBounds.endX);
                const minY = Math.min(boxOrBounds.startY, boxOrBounds.endY);
                const maxY = Math.max(boxOrBounds.startY, boxOrBounds.endY);
                if (maxX - minX < 10 || maxY - minY < 10) return;
                renderBoundsToPreview({ minX, minY, maxX, maxY }, targetIndices);
                return;
            }
            if (boxOrBounds && boxOrBounds.minX !== undefined) {
                renderBoundsToPreview(boxOrBounds, targetIndices);
                return;
            }
            if (selectedShapeIndices.length > 0) {
                const bounds = getMultipleShapesBounds(selectedShapeIndices);
                if (bounds) renderBoundsToPreview(bounds, selectedShapeIndices);
                return;
            }
            if (shapes.length > 0) {
                const allIndices = shapes.map((_, i) => i);
                const bounds = getMultipleShapesBounds(allIndices);
                if (bounds) renderBoundsToPreview(bounds, allIndices);
                return;
            }
            showToast('⚠️ 캡처할 도형이 없습니다.');
        }

        function openPrintPreviewFromBox(box) {
            openPrintPreview(box, null);
        }

        function printSelectedShapes() {
            if (selectedShapeIndices.length === 0) {
                if (shapes.length === 0) return showToast('⚠️ 인쇄할 도형을 먼저 그리거나 선택해주세요.');
                openPrintPreview();
                return;
            }
            const bounds = getMultipleShapesBounds(selectedShapeIndices);
            if (!bounds) return;
            openPrintPreview(bounds, selectedShapeIndices);
        }

        function closePrintPreviewModal() {
            printModal.classList.add('hidden');

        // --- SVG / PNG / PDF 내보내기 구현 ---
        function generateSVGString() {
            const { indices, bounds } = lastExportContext;
            if (!bounds) return '';
            const { minX, minY, w, h } = bounds;
            const escapeXml = (str) => String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

            let svgParts = [
                '<?xml version="1.0" encoding="UTF-8"?>',
                `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${minX.toFixed(2)} ${minY.toFixed(2)} ${w.toFixed(2)} ${h.toFixed(2)}" width="${Math.round(w * 2)}" height="${Math.round(h * 2)}">`,
                `<rect x="${minX.toFixed(2)}" y="${minY.toFixed(2)}" width="${w.toFixed(2)}" height="${h.toFixed(2)}" fill="#ffffff"/>`
            ];

            indices.forEach(sIdx => {
                const shape = shapes[sIdx];
                if (!shape || shape.length === 0) return;
                const shapeType = shape.type || 'polygon';

                if (shapeType === 'polygon') {
                    const pts = shape.map(p => `${p.x.toFixed(2)},${p.y.toFixed(2)}`).join(' ');
                    svgParts.push(`<polygon points="${pts}" fill="rgba(79,70,229,0.05)" stroke="#4f46e5" stroke-width="2.5" stroke-linejoin="round"/>`);
                } else if (shapeType === 'circle') {
                    const c = shape[0], p = shape[1], r = Math.sqrt(dist2(c, p));
                    svgParts.push(`<circle cx="${c.x.toFixed(2)}" cy="${c.y.toFixed(2)}" r="${r.toFixed(2)}" fill="rgba(79,70,229,0.05)" stroke="#4f46e5" stroke-width="2.5"/>`);
                    if (c.showLength !== false) {
                        svgParts.push(`<line x1="${c.x.toFixed(2)}" y1="${c.y.toFixed(2)}" x2="${p.x.toFixed(2)}" y2="${p.y.toFixed(2)}" stroke="#4f46e5" stroke-width="1.8" stroke-dasharray="4,4"/>`);
                        const rCm = (r / 50).toFixed(1) + ' cm';
                        const txt = c.customLength ? c.customLength : `r = ${rCm}`;
                        const angle = Math.atan2(p.y - c.y, p.x - c.x);
                        const mx = (c.x + p.x) / 2 + Math.cos(angle + Math.PI / 2) * 14;
                        const my = (c.y + p.y) / 2 + Math.sin(angle + Math.PI / 2) * 14;
                        svgParts.push(`<text x="${mx.toFixed(2)}" y="${my.toFixed(2)}" fill="#4f46e5" font-family="sans-serif" font-size="13" font-weight="bold" font-style="italic" text-anchor="middle" dominant-baseline="middle">${escapeXml(txt)}</text>`);
                    }
                } else if (shapeType === 'sector') {
                    const c = shape[0], p1 = shape[1], p2 = shape[2];
                    const r = Math.sqrt(dist2(c, p1));
                    const a1 = Math.atan2(p1.y - c.y, p1.x - c.x);
                    const a2 = Math.atan2(p2.y - c.y, p2.x - c.x);
                    let diff = a2 - a1; while (diff < 0) diff += Math.PI * 2;
                    const largeArc = diff > Math.PI ? 1 : 0;

                    svgParts.push(`<path d="M ${c.x.toFixed(2)} ${c.y.toFixed(2)} L ${p1.x.toFixed(2)} ${p1.y.toFixed(2)} A ${r.toFixed(2)} ${r.toFixed(2)} 0 ${largeArc} 1 ${p2.x.toFixed(2)} ${p2.y.toFixed(2)} Z" fill="rgba(79,70,229,0.05)" stroke="#4f46e5" stroke-width="2.5" stroke-linejoin="round"/>`);
                    
                    if (c.showLength !== false) {
                        svgParts.push(`<line x1="${c.x.toFixed(2)}" y1="${c.y.toFixed(2)}" x2="${p1.x.toFixed(2)}" y2="${p1.y.toFixed(2)}" stroke="#4f46e5" stroke-width="1.8" stroke-dasharray="4,4"/>`);
                        const rCm = (r / 50).toFixed(1) + ' cm';
                        const txt = c.customLength ? c.customLength : `r = ${rCm}`;
                        const mx = (c.x + p1.x) / 2 + Math.cos(a1 + Math.PI / 2) * 14;
                        const my = (c.y + p1.y) / 2 + Math.sin(a1 + Math.PI / 2) * 14;
                        svgParts.push(`<text x="${mx.toFixed(2)}" y="${my.toFixed(2)}" fill="#4f46e5" font-family="sans-serif" font-size="13" font-weight="bold" font-style="italic" text-anchor="middle" dominant-baseline="middle">${escapeXml(txt)}</text>`);
                    }
                    if (c.showAngle !== false) {
                        const rArc = 22;
                        const sx = c.x + rArc * Math.cos(a1), sy = c.y + rArc * Math.sin(a1);
                        const ex = c.x + rArc * Math.cos(a2), ey = c.y + rArc * Math.sin(a2);
                        svgParts.push(`<path d="M ${c.x.toFixed(2)} ${c.y.toFixed(2)} L ${sx.toFixed(2)} ${sy.toFixed(2)} A ${rArc} ${rArc} 0 ${largeArc} 1 ${ex.toFixed(2)} ${ey.toFixed(2)} Z" fill="rgba(245,158,11,0.2)" stroke="rgba(245,158,11,0.8)" stroke-width="2"/>`);
                        const degStr = c.customAngle ? c.customAngle : ((diff * 180 / Math.PI).toFixed(0) + '°');
                        const midAngle = a1 + diff / 2;
                        const tx = c.x + Math.cos(midAngle) * 36, ty = c.y + Math.sin(midAngle) * 36;
                        svgParts.push(`<text x="${tx.toFixed(2)}" y="${ty.toFixed(2)}" fill="#1f2937" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle" dominant-baseline="middle">${escapeXml(degStr)}</text>`);
                    }
                } else if (shapeType === 'line') {
                    svgParts.push(`<line x1="${shape[0].x.toFixed(2)}" y1="${shape[0].y.toFixed(2)}" x2="${shape[1].x.toFixed(2)}" y2="${shape[1].y.toFixed(2)}" stroke="#4f46e5" stroke-width="2.5" stroke-linecap="round"/>`);
                }

                if (shapeType === 'polygon' || shapeType === 'line') {
                    let edges = [];
                    if (shapeType === 'polygon') { for (let i = 0; i < shape.length; i++) edges.push([i, (i + 1) % shape.length]); }
                    else edges.push([0, 1]);

                    edges.forEach(([v1, v2]) => {
                        const p1 = shape[v1], p2 = shape[v2];
                        if (p1.showLength !== false) {
                            const dx = p2.x - p1.x, dy = p2.y - p1.y;
                            const lenStr = p1.customLength ? p1.customLength : ((Math.sqrt(dx * dx + dy * dy) / 50).toFixed(1) + ' cm');
                            let isCW = (shape.length >= 3 && shapeType === 'polygon') ? (getPolygonArea(shape) > 0) : true;
                            let nx = isCW ? dy : -dy, ny = isCW ? -dx : dx;
                            let nLen = Math.sqrt(nx * nx + ny * ny);
                            if (nLen > 0) { nx /= nLen; ny /= nLen; } else { nx = 0; ny = -1; }
                            const midX = (p1.x + p2.x) / 2, midY = (p1.y + p2.y) / 2;
                            const cx = midX + nx * 25, cy = midY + ny * 25;
                            const tx = midX + nx * 37, ty = midY + ny * 37;
                            svgParts.push(`<path d="M ${p1.x.toFixed(2)} ${p1.y.toFixed(2)} Q ${cx.toFixed(2)} ${cy.toFixed(2)} ${p2.x.toFixed(2)} ${p2.y.toFixed(2)}" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,4"/>`);
                            svgParts.push(`<text x="${tx.toFixed(2)}" y="${ty.toFixed(2)}" fill="#1f2937" font-family="sans-serif" font-size="13" font-style="italic" text-anchor="middle" dominant-baseline="middle">${escapeXml(lenStr)}</text>`);
                        }
                    });
                }

                if (shapeType === 'polygon' && shape.length >= 3) {
                    const isCW = getPolygonArea(shape) > 0;
                    shape.forEach((p2, i) => {
                        if (!p2.showAngle) return;
                        const p1 = shape[(i - 1 + shape.length) % shape.length], p3 = shape[(i + 1) % shape.length];
                        let a1 = Math.atan2(p1.y - p2.y, p1.x - p2.x), a2 = Math.atan2(p3.y - p2.y, p3.x - p2.x);
                        let angleCCW = a2 - a1; while (angleCCW < 0) angleCCW += 2 * Math.PI;
                        let interiorAngle = isCW ? (2 * Math.PI - angleCCW) : angleCCW;
                        if (interiorAngle >= 2 * Math.PI) interiorAngle -= 2 * Math.PI;

                        const rArc = 22;
                        const sx = p2.x + rArc * Math.cos(a1), sy = p2.y + rArc * Math.sin(a1);
                        const ex = p2.x + rArc * Math.cos(a2), ey = p2.y + rArc * Math.sin(a2);
                        const largeArc = interiorAngle > Math.PI ? 1 : 0;
                        const sweep = isCW ? 0 : 1;
                        svgParts.push(`<path d="M ${p2.x.toFixed(2)} ${p2.y.toFixed(2)} L ${sx.toFixed(2)} ${sy.toFixed(2)} A ${rArc} ${rArc} 0 ${largeArc} ${sweep} ${ex.toFixed(2)} ${ey.toFixed(2)} Z" fill="rgba(245,158,11,0.2)" stroke="rgba(245,158,11,0.8)" stroke-width="2"/>`);

                        const degStr = p2.customAngle ? p2.customAngle : ((interiorAngle * 180 / Math.PI).toFixed(0) + '°');
                        const midAngle = isCW ? (a1 - interiorAngle / 2) : (a1 + interiorAngle / 2);
                        const tx = p2.x + Math.cos(midAngle) * 36, ty = p2.y + Math.sin(midAngle) * 36;
                        svgParts.push(`<text x="${tx.toFixed(2)}" y="${ty.toFixed(2)}" fill="#1f2937" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle" dominant-baseline="middle">${escapeXml(degStr)}</text>`);
                    });
                }

                const centroid = (shapeType === 'polygon' && shape.length >= 3) ? getPolygonCentroid(shape) : null;
                shape.forEach((p, vIdx) => {
                    const isCircleCenter = ((shapeType === 'circle' || shapeType === 'sector') && vIdx === 0);
                    if (isCircleCenter) {
                        svgParts.push(`<circle cx="${p.x.toFixed(2)}" cy="${p.y.toFixed(2)}" r="${pointRadius}" fill="#000000" stroke="#ffffff" stroke-width="1.5"/>`);
                    }
                    if (p.label) {
                        let lx = p.x + 12, ly = p.y - 10;
                        if (isCircleCenter) { lx = p.x - 14; ly = p.y - 14; }
                        else if (centroid) {
                            const dx = p.x - centroid.x, dy = p.y - centroid.y, d = Math.sqrt(dx * dx + dy * dy);
                            if (d > 0) { lx = p.x + (dx / d) * 18; ly = p.y + (dy / d) * 18; }
                        }
                        svgParts.push(`<text x="${lx.toFixed(2)}" y="${ly.toFixed(2)}" fill="#111827" font-family="Times New Roman, serif" font-size="16" font-weight="bold" font-style="italic" text-anchor="middle" dominant-baseline="middle">${escapeXml(p.label)}</text>`);
                    }
                });
            });

            svgParts.push('</svg>');
            return svgParts.join('\n');
        }

        function downloadSVG() {
            const svgStr = generateSVGString();
            if (!svgStr) return;
            const blob = new Blob([svgStr], { type: 'image/svg+xml;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `shape_export_${Date.now()}.svg`;
            document.body.appendChild(a);
            a.click();
            a.remove();
            URL.revokeObjectURL(url);
            showToast('📐 SVG 벡터 파일이 다운로드되었습니다');
        }

        function downloadPNG() {
            if (!printPreviewImg.src) return;
            const a = document.createElement('a');
            a.href = printPreviewImg.src;
            a.download = `shape_export_${Date.now()}.png`;
            document.body.appendChild(a);
            a.click();
            a.remove();
            showToast('🖼️ PNG 이미지가 다운로드되었습니다');
        }

        function downloadPDF() {
            if (!printPreviewImg.src || !window.jspdf) return;
            const { jsPDF } = window.jspdf;
            const img = new Image();
            img.onload = () => {
                const isLandscape = img.width > img.height;
                const pdf = new jsPDF({
                    orientation: isLandscape ? 'landscape' : 'portrait',
                    unit: 'mm',
                    format: 'a4'
                });
                const pageW = pdf.internal.pageSize.getWidth();
                const pageH = pdf.internal.pageSize.getHeight();
                const margin = 15;
                const availW = pageW - margin * 2;
                const availH = pageH - margin * 2;
                const ratio = Math.min(availW / img.width, availH / img.height);
                const renderW = img.width * ratio;
                const renderH = img.height * ratio;
                const offsetX = (pageW - renderW) / 2;
                const offsetY = (pageH - renderH) / 2;

                pdf.addImage(printPreviewImg.src, 'PNG', offsetX, offsetY, renderW, renderH);
                pdf.save(`shape_export_${Date.now()}.pdf`);
                showToast('📄 PDF 문서가 다운로드되었습니다');
            };
            img.src = printPreviewImg.src;
        }

        function groupSelectedShapes() {
            if (selectedShapeIndices.length < 2) return showToast('⚠️ 2개 이상의 도형을 선택하세요.');
            const gId = 'group_' + Date.now();
            selectedShapeIndices.forEach(idx => { if (shapes[idx]) shapes[idx].groupId = gId; });
            saveHistory(); draw(); showToast(`📦 그룹 생성됨`);
        }

        function ungroupSelectedShapes() {
            let count = 0;
            selectedShapeIndices.forEach(idx => {
                if (shapes[idx] && shapes[idx].groupId) { delete shapes[idx].groupId; count++; }
            });
            if (count > 0) { saveHistory(); draw(); showToast('🔓 그룹 해제됨'); }
        }

        function setMode(newMode) {
            if (mode === newMode) return;
            mode = newMode;
            if (mode === 'draw') {
                modeDrawBtn.classList.add('active'); modeSelectBtn.classList.remove('active');
                updateDrawToolUI();
            } else {
                modeSelectBtn.classList.add('active'); modeDrawBtn.classList.remove('active');
                drawBtns.forEach(btn => btn.classList.remove('active'));
                if (currentShape.length > 0) currentShape = [];
            }

        }

        function setDrawType(type) { drawType = type; setMode('draw'); updateDrawToolUI(); }
        function updateDrawToolUI() {
            drawBtns.forEach(btn => btn.classList.remove('active'));
            if(mode === 'draw') {
                if(drawType === 'polygon') drawPolygonBtn.classList.add('active');
                if(drawType === 'line') drawLineBtn.classList.add('active');
                if(drawType === 'circle') drawCircleBtn.classList.add('active');
                if(drawType === 'regular') drawRegularPolygonBtn.classList.add('active');
                if(drawType === 'tangent') drawTangentBtn.classList.add('active');
            }
        }

        function applyEdgeLengthChange(sIdx, v1, v2, newLenCm) {
            const shape = shapes[sIdx];
            if (!shape || !shape[v1] || !shape[v2]) return;
            const valCm = parseFloat(newLenCm);
            if (isNaN(valCm) || valCm <= 0) return;
            const targetLen = valCm * 50;
            const p1 = shape[v1], p2 = shape[v2];
            const dx = p2.x - p1.x, dy = p2.y - p1.y, currentLen = Math.sqrt(dx*dx + dy*dy);
            if (currentLen > 0) {
                p2.x = p1.x + (dx / currentLen) * targetLen;
                p2.y = p1.y + (dy / currentLen) * targetLen;
                if(shape.type === 'sector' && v1 === 0 && v2 === 1) {
                    const a2 = Math.atan2(shape[2].y - p1.y, shape[2].x - p1.x);
                    shape[2].x = p1.x + targetLen * Math.cos(a2);
                    shape[2].y = p1.y + targetLen * Math.sin(a2);
                }
                applyConstraints(); draw();
            }
        }

        function applyAngleChange(sIdx, vIdx, newAngleDeg) {
            const shape = shapes[sIdx];
            if (!shape || shape.length < 3) return;
            if (shape.type === 'sector') {
                if (vIdx === 0) {
                    const valDeg = parseFloat(newAngleDeg);
                    if (isNaN(valDeg)) return;
                    const c = shape[0], p1 = shape[1], p2 = shape[2];
                    const r = Math.sqrt(dist2(c, p1));
                    const a1 = Math.atan2(p1.y - c.y, p1.x - c.x);
                    const targetAngleRad = a1 + (valDeg * Math.PI / 180);
                    p2.x = c.x + r * Math.cos(targetAngleRad);
                    p2.y = c.y + r * Math.sin(targetAngleRad);
                    applyConstraints(); draw();
                }
                return;
            }

            const valDeg = parseFloat(newAngleDeg);
            if (isNaN(valDeg)) return;
            const p2 = shape[vIdx];
            const p1 = shape[(vIdx - 1 + shape.length) % shape.length], p3 = shape[(vIdx + 1) % shape.length];
            const a1 = Math.atan2(p1.y - p2.y, p1.x - p2.x);
            let isCW = true; if (shape.length >= 3 && shape.type === 'polygon') isCW = getPolygonArea(shape) > 0;
            const targetAngleRad = valDeg * Math.PI / 180;
            const a2_new = isCW ? (a1 - targetAngleRad) : (a1 + targetAngleRad);
            const dist = Math.sqrt(dist2(p2, p3));
            p3.x = p2.x + dist * Math.cos(a2_new); p3.y = p2.y + dist * Math.sin(a2_new);
            applyConstraints(); draw();
        }

        function updatePanels(shapeIndex, fromMouseMove = false) {

            if (selectedShapeIndices.length === 1 && selectedShapeIndices[0] === shapeIndex) {

            if (shapeType === 'polygon' || shapeType === 'line') {
                let edges = [];
                if (shapeType === 'polygon') { for (let i = 0; i < shape.length; i++) edges.push([i, (i + 1) % shape.length]); }
                else if (shapeType === 'line') { edges.push([0, 1]); }

                edges.forEach(([v1, v2]) => {
                    const p1 = shape[v1], p2 = shape[v2];
                    const lPx = Math.sqrt(dist2(p1, p2)), lCm = (lPx / 50).toFixed(1);
                    const lineName = `${p1.label||''}${p2.label||''}`;

                    const row = document.createElement('div'); row.className = 'flex items-center justify-between gap-2 p-1.5 bg-white border border-gray-100 rounded shadow-sm hover:shadow-md transition-shadow';

                    const check = document.createElement('input'); check.type = 'checkbox'; check.className = 'form-checkbox h-3.5 w-3.5 text-indigo-600 rounded'; check.checked = p1.showLength !== false;
                    check.onchange = () => { p1.showLength = check.checked; saveHistory(); draw(); };
                    const label = document.createElement('span'); label.className = 'text-xs font-bold text-gray-700 w-10'; label.innerText = lineName ? `선 ${lineName}` : '선분';

                    numInput.value = lCm;
                    numInput.onkeydown = (e) => { if(e.key==='Enter'){ applyEdgeLengthChange(shapeIndex, v1, v2, numInput.value); saveHistory(); } else if(e.key==='ArrowUp' || e.key==='ArrowDown') { setTimeout(() => { applyEdgeLengthChange(shapeIndex, v1, v2, numInput.value); }, 10); } };
                    numInput.onwheel = (e) => { e.preventDefault(); numInput.value = (parseFloat(numInput.value) + (e.deltaY > 0 ? -0.5 : 0.5)).toFixed(1); applyEdgeLengthChange(shapeIndex, v1, v2, numInput.value); };
                    
                    const textInput = document.createElement('input'); textInput.type = 'text'; textInput.placeholder = '변수(ex: x)'; textInput.className = 'flex-1 px-1.5 py-1 text-xs border border-gray-300 rounded focus:ring-1 focus:ring-indigo-500';
                    textInput.value = p1.customLength || '';
                    textInput.onchange = () => { p1.customLength = textInput.value; saveHistory(); draw(); };

                    rightDiv.appendChild(numInput); rightDiv.appendChild(document.createElement('span')).className = 'text-[10px] text-gray-500'; rightDiv.lastChild.innerText = 'cm';
                    rightDiv.appendChild(textInput);
                    
                    row.appendChild(leftDiv); row.appendChild(rightDiv); multiEditForm.appendChild(row);
                });

                if (shapeType === 'polygon' && shape.length >= 3) {
                    const isCW = getPolygonArea(shape) > 0;
                    shape.forEach((p2, i) => {
                        const p1 = shape[(i - 1 + shape.length) % shape.length], p3 = shape[(i + 1) % shape.length];
                        let a1 = Math.atan2(p1.y - p2.y, p1.x - p2.x), a2 = Math.atan2(p3.y - p2.y, p3.x - p2.x);
                        let angleCCW = a2 - a1; while (angleCCW < 0) angleCCW += 2 * Math.PI;
                        let interiorAngle = isCW ? (2 * Math.PI - angleCCW) : angleCCW; if (interiorAngle >= 2 * Math.PI) interiorAngle -= 2 * Math.PI;
                        const deg = (interiorAngle * 180 / Math.PI).toFixed(0);

                        const row = document.createElement('div'); row.className = 'flex items-center justify-between gap-2 p-1.5 bg-white border border-gray-100 rounded shadow-sm hover:shadow-md transition-shadow';
                        
                        const leftDiv = document.createElement('div'); leftDiv.className = 'flex items-center gap-1.5';
                        const check = document.createElement('input'); check.type = 'checkbox'; check.className = 'form-checkbox h-3.5 w-3.5 text-amber-500 rounded'; check.checked = p2.showAngle !== false;
                        check.onchange = () => { p2.showAngle = check.checked; saveHistory(); draw(); };
                        const label = document.createElement('span'); label.className = 'text-xs font-bold text-gray-700 w-10'; label.innerText = `각 ${p2.label||''}`;
                        leftDiv.appendChild(check); leftDiv.appendChild(label);
                        
                        const rightDiv = document.createElement('div'); rightDiv.className = 'flex items-center gap-1 flex-1';
                        
                        const numInput = document.createElement('input'); numInput.type = 'number'; numInput.step = '1'; numInput.min = '1'; numInput.max = '359'; numInput.className = 'w-12 px-1.5 py-1 text-xs border border-gray-300 rounded focus:ring-1 focus:ring-amber-500';
                        numInput.value = deg;
                        numInput.onkeydown = (e) => { if(e.key==='Enter'){ applyAngleChange(shapeIndex, i, numInput.value); saveHistory(); } else if(e.key==='ArrowUp' || e.key==='ArrowDown') { setTimeout(() => { applyAngleChange(shapeIndex, i, numInput.value); }, 10); } };
                        numInput.onwheel = (e) => { e.preventDefault(); numInput.value = (parseFloat(numInput.value) + (e.deltaY > 0 ? -1 : 1)).toFixed(0); applyAngleChange(shapeIndex, i, numInput.value); };
                        
                        const textInput = document.createElement('input'); textInput.type = 'text'; textInput.placeholder = '변수(ex: a)'; textInput.className = 'flex-1 px-1.5 py-1 text-xs border border-gray-300 rounded focus:ring-1 focus:ring-amber-500';
                        textInput.value = p2.customAngle || '';
                        textInput.onchange = () => { p2.customAngle = textInput.value; saveHistory(); draw(); };

                        rightDiv.appendChild(numInput); rightDiv.appendChild(document.createElement('span')).className = 'text-[10px] text-gray-500'; rightDiv.lastChild.innerText = '°';
                        rightDiv.appendChild(textInput);
                        
                        row.appendChild(leftDiv); row.appendChild(rightDiv); multiEditForm.appendChild(row);
                    });
                }

                const pointTitle = document.createElement('div'); pointTitle.className = 'text-[10px] font-bold text-gray-400 mt-2 mb-1 pl-1'; pointTitle.innerText = '꼭짓점 라벨 변경'; multiEditForm.appendChild(pointTitle);
                const pointGrid = document.createElement('div'); pointGrid.className = 'grid grid-cols-2 gap-2';
                shape.forEach((p, i) => {
                    const row = document.createElement('div'); row.className = 'flex items-center gap-2 p-1.5 bg-white border border-gray-100 rounded shadow-sm';
                    const lbl = document.createElement('span'); lbl.className = 'text-[10px] text-gray-600 font-bold'; lbl.innerText = `점 ${i+1}`;
                    const inp = document.createElement('input'); inp.type = 'text'; inp.className = 'w-full px-1.5 py-0.5 text-xs border border-gray-300 rounded focus:ring-1 focus:ring-indigo-500 font-bold';
                    inp.value = p.label || '';
                    inp.onchange = () => { p.label = inp.value; saveHistory(); draw(); updatePanels(shapeIndex, true); };
                    row.appendChild(lbl); row.appendChild(inp); pointGrid.appendChild(row);
                });
                multiEditForm.appendChild(pointGrid);

            } else if (shapeType === 'circle' || shapeType === 'sector') {
                const c = shape[0], p1 = shape[1];
                const rPx = Math.sqrt(dist2(c, p1)), rCm = (rPx / 50).toFixed(1);

                const row = document.createElement('div'); row.className = 'flex items-center justify-between gap-2 p-1.5 bg-white border border-gray-100 rounded shadow-sm hover:shadow-md transition-shadow';
                const leftDiv = document.createElement('div'); leftDiv.className = 'flex items-center gap-1.5';
                const check = document.createElement('input'); check.type = 'checkbox'; check.className = 'form-checkbox h-3.5 w-3.5 text-indigo-600 rounded'; check.checked = c.showLength !== false;
                check.onchange = () => { c.showLength = check.checked; saveHistory(); draw(); };
                const label = document.createElement('span'); label.className = 'text-xs font-bold text-gray-700 w-10'; label.innerText = '반지름';
                leftDiv.appendChild(check); leftDiv.appendChild(label);
                
                const rightDiv = document.createElement('div'); rightDiv.className = 'flex items-center gap-1 flex-1';
                const numInput = document.createElement('input'); numInput.type = 'number'; numInput.step = '0.5'; numInput.min = '0.1'; numInput.className = 'w-14 px-1.5 py-1 text-xs border border-gray-300 rounded focus:ring-1 focus:ring-indigo-500';
                numInput.value = rCm;
                numInput.onkeydown = (e) => { if(e.key==='Enter'){ applyEdgeLengthChange(shapeIndex, 0, 1, numInput.value); saveHistory(); } else if(e.key==='ArrowUp' || e.key==='ArrowDown') { setTimeout(() => { applyEdgeLengthChange(shapeIndex, 0, 1, numInput.value); }, 10); } };
                numInput.onwheel = (e) => { e.preventDefault(); numInput.value = (parseFloat(numInput.value) + (e.deltaY > 0 ? -0.5 : 0.5)).toFixed(1); applyEdgeLengthChange(shapeIndex, 0, 1, numInput.value); };
                
                const textInput = document.createElement('input'); textInput.type = 'text'; textInput.placeholder = '변수(ex: r)'; textInput.className = 'flex-1 px-1.5 py-1 text-xs border border-gray-300 rounded focus:ring-1 focus:ring-indigo-500';
                textInput.value = c.customLength || '';
                textInput.onchange = () => { c.customLength = textInput.value; saveHistory(); draw(); };

                rightDiv.appendChild(numInput); rightDiv.appendChild(document.createElement('span')).className = 'text-[10px] text-gray-500'; rightDiv.lastChild.innerText = 'cm'; rightDiv.appendChild(textInput);
                row.appendChild(leftDiv); row.appendChild(rightDiv); multiEditForm.appendChild(row);

                if (shapeType === 'sector') {
                    const p2 = shape[2];
                    const a1 = Math.atan2(p1.y - c.y, p1.x - c.x);
                    const a2 = Math.atan2(p2.y - c.y, p2.x - c.x);
                    let diff = a2 - a1; while (diff < 0) diff += Math.PI * 2;
                    const deg = (diff * 180 / Math.PI).toFixed(0);

                    const angleRow = document.createElement('div'); angleRow.className = 'flex items-center justify-between gap-2 p-1.5 bg-white border border-gray-100 rounded shadow-sm hover:shadow-md transition-shadow';
                    const angleLeftDiv = document.createElement('div'); angleLeftDiv.className = 'flex items-center gap-1.5';
                    const angleCheck = document.createElement('input'); angleCheck.type = 'checkbox'; angleCheck.className = 'form-checkbox h-3.5 w-3.5 text-amber-500 rounded'; angleCheck.checked = c.showAngle !== false;
                    angleCheck.onchange = () => { c.showAngle = angleCheck.checked; saveHistory(); draw(); };
                    const angleLabel = document.createElement('span'); angleLabel.className = 'text-xs font-bold text-gray-700 w-10'; angleLabel.innerText = '중심각';
                    angleLeftDiv.appendChild(angleCheck); angleLeftDiv.appendChild(angleLabel);
                    
                    const angleRightDiv = document.createElement('div'); angleRightDiv.className = 'flex items-center gap-1 flex-1';
                    const angleNumInput = document.createElement('input'); angleNumInput.type = 'number'; angleNumInput.step = '1'; angleNumInput.min = '1'; angleNumInput.max = '359'; angleNumInput.className = 'w-12 px-1.5 py-1 text-xs border border-gray-300 rounded focus:ring-1 focus:ring-amber-500';
                    angleNumInput.value = deg;
                    angleNumInput.onkeydown = (e) => { if(e.key==='Enter'){ applyAngleChange(shapeIndex, 0, angleNumInput.value); saveHistory(); } else if(e.key==='ArrowUp' || e.key==='ArrowDown') { setTimeout(() => { applyAngleChange(shapeIndex, 0, angleNumInput.value); }, 10); } };
                    angleNumInput.onwheel = (e) => { e.preventDefault(); angleNumInput.value = (parseFloat(angleNumInput.value) + (e.deltaY > 0 ? -1 : 1)).toFixed(0); applyAngleChange(shapeIndex, 0, angleNumInput.value); };
                    
                    const angleTextInput = document.createElement('input'); angleTextInput.type = 'text'; angleTextInput.placeholder = '변수(ex: x)'; angleTextInput.className = 'flex-1 px-1.5 py-1 text-xs border border-gray-300 rounded focus:ring-1 focus:ring-amber-500';
                    angleTextInput.value = c.customAngle || '';
                    angleTextInput.onchange = () => { c.customAngle = angleTextInput.value; saveHistory(); draw(); };

                    angleRightDiv.appendChild(angleNumInput); angleRightDiv.appendChild(document.createElement('span')).className = 'text-[10px] text-gray-500'; angleRightDiv.lastChild.innerText = '°'; angleRightDiv.appendChild(angleTextInput);
                    angleRow.appendChild(angleLeftDiv); angleRow.appendChild(angleRightDiv); multiEditForm.appendChild(angleRow);
                }

                const pointTitle = document.createElement('div'); pointTitle.className = 'text-[10px] font-bold text-gray-400 mt-2 mb-1 pl-1'; pointTitle.innerText = '중심점 라벨 변경'; multiEditForm.appendChild(pointTitle);
                const rowLabel = document.createElement('div'); rowLabel.className = 'flex items-center gap-2 p-1.5 bg-white border border-gray-100 rounded shadow-sm';
                const lbl = document.createElement('span'); lbl.className = 'text-[10px] text-gray-600 font-bold'; lbl.innerText = `중심(원점)`;
                const inp = document.createElement('input'); inp.type = 'text'; inp.className = 'flex-1 px-1.5 py-0.5 text-xs border border-gray-300 rounded focus:ring-1 focus:ring-indigo-500 font-bold';
                inp.value = c.label || '';
                inp.onchange = () => { c.label = inp.value; saveHistory(); draw(); updatePanels(shapeIndex, true); };
                rowLabel.appendChild(lbl); rowLabel.appendChild(inp); multiEditForm.appendChild(rowLabel);
            }
        }

        function deleteSelectedShapes() {
            if (selectedShapeIndices.length === 0) return;
            selectedShapeIndices.sort((a,b) => b-a).forEach(idx => {
                const shapeId = shapes[idx].id;
                shapes.forEach(s => s.forEach(p => { if (p.attachedTo && p.attachedTo.shapeId === shapeId) delete p.attachedTo; }));
                shapes.splice(idx, 1);
            });
            selectedShapeIndices = []; updatePanels(null); applyConstraints(); saveHistory(); draw();
            showToast('🗑️ 도형이 삭제되었습니다');
        }

        function setupEvents() {
            canvas.addEventListener('pointerdown', handlePointerDown);
            window.addEventListener('pointermove', handlePointerMove);
            window.addEventListener('pointerup', handlePointerUp);
            canvas.addEventListener('contextmenu', handleContextMenu);

            window.addEventListener('keydown', (e) => {
                if (e.target.tagName === 'INPUT') return;
                if (e.code === 'Space') { isSpaceDown = true; if (!isPanning) canvas.style.cursor = 'grab'; }
                if (e.key === 'Delete' || e.key === 'Backspace') deleteSelectedShapes();
                if ((e.ctrlKey || e.metaKey) && e.key === 'z') { e.preventDefault(); undo(); }
                if (e.key === 'p' || e.key === 'P') { setDrawType('polygon'); showToast('✏️ 그리기 모드'); }
                if (e.key === 'v' || e.key === 'V') { setMode('select'); showToast('🖐 선택 모드'); }
                if ((e.ctrlKey || e.metaKey) && e.key === 'g' && !e.shiftKey) { e.preventDefault(); groupSelectedShapes(); }
                if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key === 'G') { e.preventDefault(); ungroupSelectedShapes(); }
            });
            
            window.addEventListener('keyup', (e) => {
                if (e.code === 'Space') {
                    isSpaceDown = false;
                    if (!isPanning) canvas.style.cursor = (mode === 'draw') ? 'crosshair' : 'default';
                }
            });

            canvasContainer.addEventListener('wheel', (e) => {
                if (e.ctrlKey || e.metaKey) {
                    e.preventDefault();
                    const rect = canvas.getBoundingClientRect();
                    const physicalX = e.clientX - rect.left, physicalY = e.clientY - rect.top;
                    setZoomAtPoint(globalScale * (e.deltaY > 0 ? 0.9 : 1.1), physicalX, physicalY);
                }
            }, { passive: false });

            zoomInBtn.addEventListener('click', () => { setZoomAtPoint(globalScale * 1.2, originX + (canvasContainer.clientWidth / 2), originY + (canvasContainer.clientHeight / 2)); });
            zoomOutBtn.addEventListener('click', () => { setZoomAtPoint(globalScale * 0.8, originX + (canvasContainer.clientWidth / 2), originY + (canvasContainer.clientHeight / 2)); });
            zoomLevelText.addEventListener('click', () => {
                const cx = (canvasContainer.clientWidth / 2 - originX) / globalScale;
                const cy = (canvasContainer.clientHeight / 2 - originY) / globalScale;
                globalScale = 1.0;
                originX = canvasContainer.clientWidth / 2 - cx * globalScale;
                originY = canvasContainer.clientHeight / 2 - cy * globalScale;
                updateZoomUI(); draw();
            });

            modeDrawBtn.addEventListener('click', () => { if(drawType==='regular') drawType='polygon'; setMode('draw'); });
            modeSelectBtn.addEventListener('click', () => setMode('select'));
            drawPolygonBtn.addEventListener('click', () => setDrawType('polygon'));
            drawLineBtn.addEventListener('click', () => setDrawType('line'));
            drawCircleBtn.addEventListener('click', () => { setDrawType('circle'); tangentStartPoint = null; });
            drawTangentBtn.addEventListener('click', () => { 
                setDrawType('tangent'); 
                tangentStartPoint = null; 
                if(instructionBanner) instructionBanner.innerHTML = "💡 <strong>접선 모드:</strong> 원 외부의 <strong>한 점</strong>을 클릭하세요.";
            });
            drawRegularPolygonBtn.addEventListener('click', () => {
                regPolyModal.classList.remove('hidden');
            });
            
            presetSelectBtns.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    presetSelectBtns.forEach(b => { 
                        b.classList.remove('active', 'bg-indigo-600', 'text-white', 'border-indigo-600'); 
                        b.classList.add('bg-white', 'text-gray-700', 'border-gray-300'); 
                    });
                    btn.classList.remove('bg-white', 'text-gray-700', 'border-gray-300');
                    btn.classList.add('active', 'bg-indigo-600', 'text-white', 'border-indigo-600');
                    
                    const preset = btn.dataset.preset;
                    regularPolyParams.preset = preset;
                    
                    sidesContainer.classList.add('hidden');
                    heightContainer.classList.add('hidden');
                    sectorAnglesContainer.classList.add('hidden');
                    
                    if (preset === 'regular') {
                        sidesContainer.classList.remove('hidden');
                        regPolyLengthLabel.innerText = '한 변의 길이 (cm)';
                    } else if (preset === 'rectangle') {
                        heightContainer.classList.remove('hidden');
                        regPolyLengthLabel.innerText = '가로 길이 (cm)';
                        regPolyHeightLabel.innerText = '세로 길이 (cm)';
                    } else if (preset === 'right_triangle') {
                        heightContainer.classList.remove('hidden');
                        regPolyLengthLabel.innerText = '밑변 길이 (cm)';
                        regPolyHeightLabel.innerText = '높이 길이 (cm)';
                    } else if (preset === 'sector') {
                        sectorAnglesContainer.classList.remove('hidden');
                        regPolyLengthLabel.innerText = '반지름 길이 (cm)';
                    }
                });
            });

            closeRegPolyModal.addEventListener('click', () => regPolyModal.classList.add('hidden'));
            cancelRegPolyBtn.addEventListener('click', () => regPolyModal.classList.add('hidden'));
            confirmRegPolyBtn.addEventListener('click', () => {
                regularPolyParams.sides = regPolySidesInput.value;
                regularPolyParams.lengthCm = regPolyLengthInput.value;
                regularPolyParams.heightCm = regPolyHeightInput.value;
                setDrawType('regular');
                regPolyModal.classList.add('hidden');
                showToast('🖱️ 캔버스에 중심점을 클릭하여 배치하세요');
            });

            undoBtn.addEventListener('click', undo);
            clearBtn.addEventListener('click', () => {
                if (confirm('모든 도형을 지우시겠습니까?')) { shapes = []; currentShape = []; selectedShapeIndices = []; globalVertexCount = 0; updatePanels(null); saveHistory(); draw(); }
            });
            groupBtn.addEventListener('click', groupSelectedShapes);
            ungroupBtn.addEventListener('click', ungroupSelectedShapes);

            defaultAngleCheck.addEventListener('change', () => { shapes.forEach(s => s.forEach(p => { if (s.type === 'polygon' || s.type === 'sector') p.showAngle = defaultAngleCheck.checked; })); saveHistory(); draw(); updatePanels(lockedShapeIndex); });
            defaultLengthCheck.addEventListener('change', () => { shapes.forEach(s => s.forEach(p => { if (s.type === 'polygon' || s.type === 'line' || s.type === 'circle' || s.type === 'sector') p.showLength = defaultLengthCheck.checked; })); saveHistory(); draw(); updatePanels(lockedShapeIndex); });
            showGridCheck.addEventListener('change', () => draw());
            showRulerCheck.addEventListener('change', () => draw());

            printSelectedBtn.addEventListener('click', printSelectedShapes);
            closePrintModal.addEventListener('click', closePrintPreviewModal);
            cancelPrintBtn.addEventListener('click', closePrintPreviewModal);
            execPrintBtn.addEventListener('click', () => {
                const printWindow = window.open('', '_blank');
                printWindow.document.write('<html><head><title>인쇄</title></head><body style="margin:0;display:flex;justify-content:center;align-items:center;height:100vh;">');
                printWindow.document.write('<img src="' + printPreviewImg.src + '" style="max-width:100%;max-height:100%;"/>');
                printWindow.document.write('</body></html>');
                printWindow.document.close();
                printWindow.onload = () => { printWindow.focus(); printWindow.print(); printWindow.close(); };
            });
            downloadSvgBtn.addEventListener('click', downloadSVG);
            downloadPngBtn.addEventListener('click', downloadPNG);
            downloadPdfBtn.addEventListener('click', downloadPDF);
        }

        init();
    </script>
</body>
</html>
