<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excel Roulette</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SheetJS for reading Excel files -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
            overflow-x: hidden;
        }
        canvas {
            display: block;
            max-width: 100%;
            height: auto;
        }
        /* Custom modal transition */
        .modal-enter {
            opacity: 0;
            transform: scale(0.9);
        }
        .modal-enter-active {
            opacity: 1;
            transform: scale(1);
            transition: opacity 300ms, transform 300ms;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col text-gray-800">

    <!-- Header -->
    <header class="bg-indigo-600 text-white shadow-md p-4 text-center">
        <h1 class="text-2xl font-bold tracking-wide">Excel Data Roulette</h1>
        <p class="text-indigo-200 text-sm mt-1">Upload an Excel file to spin the wheel from Column A</p>
    </header>

    <!-- Main Content -->
    <main class="flex-grow flex flex-col lg:flex-row p-4 gap-6 max-w-7xl mx-auto w-full">
        
        <!-- Controls Sidebar -->
        <div class="w-full lg:w-1/3 flex flex-col gap-4 bg-white p-6 rounded-xl shadow-lg border border-gray-100 h-fit">
            
            <!-- File Upload -->
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">1. Upload Excel File</label>
                <div class="flex items-center justify-center w-full">
                    <label for="dropzone-file" class="flex flex-col items-center justify-center w-full h-32 border-2 border-indigo-300 border-dashed rounded-lg cursor-pointer bg-indigo-50 hover:bg-indigo-100 transition">
                        <div class="flex flex-col items-center justify-center pt-5 pb-6">
                            <svg class="w-8 h-8 mb-2 text-indigo-500" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 20 16">
                                <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 13h3a3 3 0 0 0 0-6h-.025A5.56 5.56 0 0 0 16 6.5 5.5 5.5 0 0 0 5.207 5.021C5.137 5.017 5.071 5 5 5a4 4 0 0 0 0 8h2.167M10 15V6m0 0L8 8m2-2 2 2"/>
                            </svg>
                            <p class="mb-2 text-sm text-gray-500"><span class="font-semibold">Click to upload</span></p>
                            <p class="text-xs text-gray-500">.xlsx, .xls</p>
                        </div>
                        <input id="dropzone-file" type="file" class="hidden" accept=".xlsx, .xls" />
                    </label>
                </div>
                <div id="file-name" class="mt-2 text-sm text-green-600 font-medium hidden">File loaded successfully!</div>
            </div>

            <!-- Sheet Selection -->
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">2. Select Sheet</label>
                <select id="sheet-select" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-indigo-500 focus:border-indigo-500 block w-full p-2.5 outline-none transition disabled:opacity-50" disabled>
                    <option value="">Upload a file first...</option>
                </select>
                <p class="text-xs text-gray-500 mt-1">Reads data from Column A</p>
            </div>

            <hr class="my-2 border-gray-200">

            <!-- Information -->
            <div class="bg-blue-50 p-4 rounded-lg">
                <p class="text-sm text-blue-800"><span class="font-bold">Loaded Items:</span> <span id="item-count">3</span></p>
            </div>

            <!-- Spin Button -->
            <button id="spin-btn" class="mt-auto w-full bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-600 hover:to-purple-700 text-white font-bold py-4 px-6 rounded-lg shadow-lg transform transition active:scale-95 text-xl tracking-wider disabled:opacity-50 disabled:cursor-not-allowed">
                SPIN WHEEL
            </button>

        </div>

        <!-- Wheel Canvas Area -->
        <div class="w-full lg:w-2/3 flex items-center justify-center bg-white p-4 rounded-xl shadow-lg border border-gray-100 relative min-h-[400px]">
            <div class="relative w-full max-w-[600px] aspect-square flex items-center justify-center">
                <canvas id="wheelCanvas"></canvas>
                <!-- Pointer Triangle (Right side) -->
                <div class="absolute right-0 top-1/2 transform -translate-y-1/2 translate-x-2 w-0 h-0 
                            border-t-[15px] border-t-transparent 
                            border-r-[25px] border-r-gray-800 
                            border-b-[15px] border-b-transparent z-10 drop-shadow-md">
                </div>
            </div>
        </div>

    </main>

    <!-- Result Modal -->
    <div id="result-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-50 hidden transition-opacity">
        <div class="bg-white rounded-2xl shadow-2xl p-8 max-w-sm w-full mx-4 text-center transform scale-90 transition-transform duration-300" id="result-modal-content">
            <h2 class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-indigo-600 to-purple-600 mb-4">Winner!</h2>
            <p id="winner-text" class="text-2xl font-semibold text-gray-800 break-words mb-6">Result here</p>
            <button id="close-modal-btn" class="bg-gray-800 hover:bg-gray-900 text-white font-medium py-2 px-6 rounded-lg transition w-full">
                Awesome!
            </button>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        // --- Elements ---
        const fileInput = document.getElementById('dropzone-file');
        const fileNameDisplay = document.getElementById('file-name');
        const sheetSelect = document.getElementById('sheet-select');
        const spinBtn = document.getElementById('spin-btn');
        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d', { alpha: false }); // Optimize for no transparency on base
        const itemCountDisplay = document.getElementById('item-count');
        
        const resultModal = document.getElementById('result-modal');
        const resultModalContent = document.getElementById('result-modal-content');
        const winnerText = document.getElementById('winner-text');
        const closeModalBtn = document.getElementById('close-modal-btn');

        // --- State ---
        let currentWorkbook = null;
        let wheelItems = ["Item 1", "Item 2", "Item 3", "Item 4"]; // Default dummy data
        let colors = [];
        
        let currentAngle = 0;
        let spinVelocity = 0;
        let isSpinning = false;
        let animationFrameId;

        // --- Initialization ---
        function init() {
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
            generateColors();
            drawWheel();
        }

        function resizeCanvas() {
            const container = canvas.parentElement;
            // Set canvas resolution to match display size for crispness
            const size = Math.min(container.clientWidth, container.clientHeight);
            canvas.width = size * window.devicePixelRatio;
            canvas.height = size * window.devicePixelRatio;
            canvas.style.width = `${size}px`;
            canvas.style.height = `${size}px`;
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
            if(!isSpinning) drawWheel();
        }

        function generateColors() {
            colors = [];
            const total = wheelItems.length;
            for (let i = 0; i < total; i++) {
                // Generate a vibrant palette using HSL
                const hue = (i * 360 / total) % 360;
                colors.push(`hsl(${hue}, 75%, 60%)`);
            }
        }

        // --- Excel File Handling ---
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            fileNameDisplay.textContent = `Loaded: ${file.name}`;
            fileNameDisplay.classList.remove('hidden');
            
            const reader = new FileReader();
            reader.onload = function(evt) {
                const data = new Uint8Array(evt.target.result);
                try {
                    currentWorkbook = XLSX.read(data, { type: 'array' });
                    populateSheetDropdown();
                } catch (error) {
                    showModal("Error", "Could not read Excel file. Please ensure it's a valid .xlsx or .xls file.");
                }
            };
            reader.readAsArrayBuffer(file);
        });

        function populateSheetDropdown() {
            sheetSelect.innerHTML = ''; // clear existing
            currentWorkbook.SheetNames.forEach(name => {
                const option = document.createElement('option');
                option.value = name;
                option.textContent = name;
                sheetSelect.appendChild(option);
            });
            sheetSelect.disabled = false;
            
            // Automatically load first sheet
            loadSheetData(currentWorkbook.SheetNames[0]);
        }

        sheetSelect.addEventListener('change', (e) => {
            loadSheetData(e.target.value);
        });

        function loadSheetData(sheetName) {
            const sheet = currentWorkbook.Sheets[sheetName];
            // header: 1 returns 2D array of rows
            const rows = XLSX.utils.sheet_to_json(sheet, { header: 1 });
            
            // Extract Column A (index 0) and filter empty values
            const colAData = rows
                .map(row => row[0])
                .filter(val => val !== undefined && val !== null && String(val).trim() !== '')
                .map(val => String(val).trim());

            if (colAData.length === 0) {
                showModal("Empty Sheet", `No data found in Column A of sheet "${sheetName}".`);
                return;
            }

            wheelItems = colAData;
            itemCountDisplay.textContent = wheelItems.length;
            currentAngle = 0; // Reset angle
            generateColors();
            drawWheel();
        }

        // --- Wheel Drawing Logic ---
        function drawWheel() {
            const width = canvas.style.width ? parseFloat(canvas.style.width) : canvas.width;
            const height = canvas.style.height ? parseFloat(canvas.style.height) : canvas.height;
            const centerX = width / 2;
            const centerY = height / 2;
            const radius = Math.min(centerX, centerY) - 10; // 10px padding

            ctx.clearRect(0, 0, width, height);
            
            // Background
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, width, height);

            const numSegments = wheelItems.length;
            const arcSize = (2 * Math.PI) / numSegments;

            ctx.save();
            ctx.translate(centerX, centerY);
            ctx.rotate(currentAngle);

            for (let i = 0; i < numSegments; i++) {
                const angleStart = i * arcSize - (arcSize / 2); // Offset so index 0 is centered on 0 radians (right side)
                const angleEnd = angleStart + arcSize;

                // Draw Slice
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.arc(0, 0, radius, angleStart, angleEnd);
                ctx.closePath();
                ctx.fillStyle = colors[i];
                ctx.fill();
                
                // Segment Border
                ctx.lineWidth = 1;
                ctx.strokeStyle = '#ffffff';
                ctx.stroke();

                // Draw Text
                ctx.save();
                // Rotate to center of this slice
                ctx.rotate(angleStart + arcSize / 2);
                ctx.textAlign = 'right';
                ctx.textBaseline = 'middle';
                ctx.fillStyle = '#ffffff';
                ctx.shadowColor = 'rgba(0,0,0,0.5)';
                ctx.shadowBlur = 4;
                
                // Responsive font size based on segment count and radius
                const fontSize = Math.max(12, Math.min(24, (radius * 2 * Math.PI / numSegments) / 2));
                ctx.font = `bold ${fontSize}px Inter, sans-serif`;
                
                const text = wheelItems[i];
                // Truncate text if it's too long to fit in radius
                const maxTextWidth = radius * 0.75;
                let displayText = text;
                if(ctx.measureText(text).width > maxTextWidth) {
                    // simple truncation (could be improved, but keeps it safe)
                    displayText = text.substring(0, 15) + '...'; 
                }
                
                ctx.fillText(displayText, radius - 20, 0);
                ctx.restore();
            }

            // Draw center dot
            ctx.beginPath();
            ctx.arc(0, 0, radius * 0.15, 0, 2 * Math.PI);
            ctx.fillStyle = '#ffffff';
            ctx.fill();
            ctx.lineWidth = 3;
            ctx.strokeStyle = '#4f46e5'; // Indigo-600
            ctx.stroke();

            ctx.restore();
        }

        // --- Spinning Logic ---
        spinBtn.addEventListener('click', () => {
            if (isSpinning || wheelItems.length === 0) return;
            
            isSpinning = true;
            spinBtn.disabled = true;
            
            // Random initial velocity (between 0.3 and 0.6 radians per frame)
            spinVelocity = 0.3 + Math.random() * 0.3;
            
            spin();
        });

        function spin() {
            currentAngle += spinVelocity;
            
            // Deceleration (friction)
            if (spinVelocity > 0.05) {
                spinVelocity *= 0.985; // Slow down gradually
            } else {
                spinVelocity *= 0.96; // Slow down faster at the end
            }

            drawWheel();

            if (spinVelocity < 0.002) {
                // Stop spinning
                isSpinning = false;
                spinBtn.disabled = false;
                determineWinner();
            } else {
                animationFrameId = requestAnimationFrame(spin);
            }
        }

        function determineWinner() {
            // Normalize angle to 0 - 2PI
            const normalizedAngle = currentAngle % (2 * Math.PI);
            const numSegments = wheelItems.length;
            const arcSize = (2 * Math.PI) / numSegments;
            
            // Our pointer is at 0 radians (right side).
            // We drew the wheel such that segment 0 is centered on 0 when currentAngle is 0.
            // As angle increases (clockwise rotation), segment 0 moves DOWN (towards positive radians).
            // The segment that passes the 0-radian pointer goes backwards in index.
            
            // Formula to find the winning index based on current rotation:
            let winnerIndex = Math.round((2 * Math.PI - normalizedAngle) / arcSize) % numSegments;
            if (winnerIndex < 0) winnerIndex += numSegments; // Safety for negative modulo in JS

            showModal("Winner!", wheelItems[winnerIndex]);
        }

        // --- Modal Logic ---
        function showModal(title, text) {
            winnerText.textContent = text;
            const titleEl = resultModalContent.querySelector('h2');
            titleEl.textContent = title;
            
            // If it's an error, change styling slightly
            if(title === "Error" || title === "Empty Sheet") {
                titleEl.className = "text-3xl font-extrabold text-red-600 mb-4";
            } else {
                titleEl.className = "text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-indigo-600 to-purple-600 mb-4";
            }

            resultModal.classList.remove('hidden');
            // Small delay to allow display:block to apply before animating opacity/transform
            requestAnimationFrame(() => {
                resultModalContent.classList.remove('scale-90');
                resultModalContent.classList.add('scale-100');
                resultModal.classList.add('opacity-100');
            });
        }

        function closeModal() {
            resultModalContent.classList.remove('scale-100');
            resultModalContent.classList.add('scale-90');
            resultModal.classList.remove('opacity-100');
            
            // Wait for transition before hiding
            setTimeout(() => {
                resultModal.classList.add('hidden');
            }, 300);
        }

        closeModalBtn.addEventListener('click', closeModal);
        
        // Allow clicking outside to close
        resultModal.addEventListener('click', (e) => {
            if(e.target === resultModal) closeModal();
        });

        // Initialize on load
        window.onload = init;

    </script>
</body>
</html>
