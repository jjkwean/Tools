                            if (nLen > 0) { nx /= nLen; ny /= nLen; } else { nx = 0; ny = -1; }
                            const midX = (p1.x + p2.x) / 2, midY = (p1.y + p2.y) / 2;
                            const cx = midX + nx * 25, cy = midY + ny * 25;
                            const tx = midX + nx * 37, ty = midY + ny * 37;
                            svgParts.push(`<path d="M ${p1.x.toFixed(2)} ${p1.y.toFixed(2)} Q ${cx.toFixed(2)} ${cy.toFixed(2)} ${p2.x.toFixed(2)} ${p2.y.toFixed(2)}" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,4"/>`);
                            svgParts.push(`<text x="${tx.toFixed(2)}" y="${ty.toFixed(2)}" fill="#1f2937" font-family="sans-serif" font-size="13" font-style="italic" text-anchor="middle" dominant-baseline="middle">${escapeXml(lenStr)}</text>`);
                        }
                    });
                }

                if (shapeType === 'polygon' && shape.length >= 3) {
                    const isCW = getPolygonArea(shape) > 0;
                    shape.forEach((p2, i) => {
                        if (!p2.showAngle) return;
                        const p1 = shape[(i - 1 + shape.length) % shape.length], p3 = shape[(i + 1) % shape.length];
                        let a1 = Math.atan2(p1.y - p2.y, p1.x - p2.x), a2 = Math.atan2(p3.y - p2.y, p3.x - p2.x);
                        let angleCCW = a2 - a1; while (angleCCW < 0) angleCCW += 2 * Math.PI;
                        let interiorAngle = isCW ? (2 * Math.PI - angleCCW) : angleCCW;
                        if (interiorAngle >= 2 * Math.PI) interiorAngle -= 2 * Math.PI;

                        const rArc = 22;
                        const sx = p2.x + rArc * Math.cos(a1), sy = p2.y + rArc * Math.sin(a1);
                        const ex = p2.x + rArc * Math.cos(a2), ey = p2.y + rArc * Math.sin(a2);
                        const largeArc = interiorAngle > Math.PI ? 1 : 0;
                        const sweep = isCW ? 0 : 1;
                        svgParts.push(`<path d="M ${p2.x.toFixed(2)} ${p2.y.toFixed(2)} L ${sx.toFixed(2)} ${sy.toFixed(2)} A ${rArc} ${rArc} 0 ${largeArc} ${sweep} ${ex.toFixed(2)} ${ey.toFixed(2)} Z" fill="rgba(245,158,11,0.2)" stroke="rgba(245,158,11,0.8)" stroke-width="2"/>`);

                        const degStr = p2.customAngle ? p2.customAngle : ((interiorAngle * 180 / Math.PI).toFixed(0) + '°');
                        const midAngle = isCW ? (a1 - interiorAngle / 2) : (a1 + interiorAngle / 2);
                        const tx = p2.x + Math.cos(midAngle) * 36, ty = p2.y + Math.sin(midAngle) * 36;
                        svgParts.push(`<text x="${tx.toFixed(2)}" y="${ty.toFixed(2)}" fill="#1f2937" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle" dominant-baseline="middle">${escapeXml(degStr)}</text>`);
                    });
                }

                const centroid = (shapeType === 'polygon' && shape.length >= 3) ? getPolygonCentroid(shape) : null;
                shape.forEach((p, vIdx) => {
                    const isCircleCenter = (shapeType === 'circle' && vIdx === 0);
                    if (isCircleCenter) {
                        svgParts.push(`<circle cx="${p.x.toFixed(2)}" cy="${p.y.toFixed(2)}" r="${pointRadius}" fill="#000000" stroke="#ffffff" stroke-width="1.5"/>`);
                    }
                    if (p.label) {
                        let lx = p.x + 12, ly = p.y - 10;
                        if (isCircleCenter) { lx = p.x - 14; ly = p.y - 14; }
                        else if (centroid) {
                            const dx = p.x - centroid.x, dy = p.y - centroid.y, d = Math.sqrt(dx * dx + dy * dy);
                            if (d > 0) { lx = p.x + (dx / d) * 18; ly = p.y + (dy / d) * 18; }
                        }
                        svgParts.push(`<text x="${lx.toFixed(2)}" y="${ly.toFixed(2)}" fill="#111827" font-family="Times New Roman, serif" font-size="16" font-weight="bold" font-style="italic" text-anchor="middle" dominant-baseline="middle">${escapeXml(p.label)}</text>`);
                    }
                });
            });

            svgParts.push('</svg>');
            return svgParts.join('\n');
        }

        function downloadSVG() {
            const svgStr = generateSVGString();
            if (!svgStr) return;
            const blob = new Blob([svgStr], { type: 'image/svg+xml;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `shape_export_${Date.now()}.svg`;
            document.body.appendChild(a);
            a.click();
            a.remove();
            URL.revokeObjectURL(url);
            showToast('📐 SVG 벡터 파일이 다운로드되었습니다');
        }

        function downloadPNG() {
            if (!printPreviewImg.src) return;
            const a = document.createElement('a');
            a.href = printPreviewImg.src;
            a.download = `shape_export_${Date.now()}.png`;
            document.body.appendChild(a);
            a.click();
            a.remove();
            showToast('🖼️ PNG 이미지가 다운로드되었습니다');
        }

        function downloadPDF() {
            if (!printPreviewImg.src || !window.jspdf) return;
            const { jsPDF } = window.jspdf;
            const img = new Image();
            img.onload = () => {
                const isLandscape = img.width > img.height;
                const pdf = new jsPDF({
                    orientation: isLandscape ? 'landscape' : 'portrait',
                    unit: 'mm',
                    format: 'a4'
                });
                const pageW = pdf.internal.pageSize.getWidth();
                const pageH = pdf.internal.pageSize.getHeight();
                const margin = 15;
                const availW = pageW - margin * 2;
                const availH = pageH - margin * 2;
                const ratio = Math.min(availW / img.width, availH / img.height);
                const renderW = img.width * ratio;
                const renderH = img.height * ratio;
                const offsetX = (pageW - renderW) / 2;
                const offsetY = (pageH - renderH) / 2;

                pdf.addImage(printPreviewImg.src, 'PNG', offsetX, offsetY, renderW, renderH);
                pdf.save(`shape_export_${Date.now()}.pdf`);
                showToast('📄 PDF 문서가 다운로드되었습니다');
            };
            img.src = printPreviewImg.src;
        }

        function groupSelectedShapes() {
            if (selectedShapeIndices.length < 2) return showToast('⚠️ 2개 이상의 도형을 선택하세요.');
            const gId = 'group_' + Date.now();
            selectedShapeIndices.forEach(idx => { if (shapes[idx]) shapes[idx].groupId = gId; });
            saveHistory(); draw(); showToast(`📦 그룹 생성됨`);
        }

        function ungroupSelectedShapes() {
            let count = 0;
            selectedShapeIndices.forEach(idx => {
                if (shapes[idx] && shapes[idx].groupId) { delete shapes[idx].groupId; count++; }
            });
            if (count > 0) { saveHistory(); draw(); showToast('🔓 그룹 해제됨'); }
        }

        function setMode(newMode) {
            if (mode === newMode) return;
            mode = newMode;
            if (mode === 'draw') {
                modeDrawBtn.classList.add('active'); modeSelectBtn.classList.remove('active');
                updateDrawToolUI();
            } else {
                modeSelectBtn.classList.add('active'); modeDrawBtn.classList.remove('active');
                drawBtns.forEach(btn => btn.classList.remove('active'));
                if (currentShape.length > 0) currentShape = [];
            }
            draw();
        }

        function setDrawType(type) { drawType = type; setMode('draw'); updateDrawToolUI(); }
        function updateDrawToolUI() {
            drawBtns.forEach(btn => btn.classList.remove('active'));
            if(mode === 'draw') {
                if(drawType === 'polygon') drawPolygonBtn.classList.add('active');
                if(drawType === 'line') drawLineBtn.classList.add('active');
                if(drawType === 'circle') drawCircleBtn.classList.add('active');
                if(drawType === 'regular') drawRegularPolygonBtn.classList.add('active');
            }
        }

        // --- 우측 패널 실시간 수치 변형 로직 ---
        function applyEdgeLengthChange(sIdx, v1, v2, newLenCm) {
            const shape = shapes[sIdx];
            if (!shape || !shape[v1] || !shape[v2]) return;
            const valCm = parseFloat(newLenCm);
            if (isNaN(valCm) || valCm <= 0.05) return;

            const p1 = shape[v1], p2 = shape[v2];
            const dx = p2.x - p1.x, dy = p2.y - p1.y;
            const currLen = Math.sqrt(dx * dx + dy * dy);
            const targetLenPx = valCm * 50;

            if (currLen > 1e-4) {
                const ratio = targetLenPx / currLen;
                p2.x = p1.x + dx * ratio;
                p2.y = p1.y + dy * ratio;
            } else {
                p2.x = p1.x + targetLenPx;
            }
            applyConstraints();
            draw();
        }

        function applyInteriorAngleChange(sIdx, vIdx, newAngleDeg) {
            const shape = shapes[sIdx];
            if (!shape || shape.length < 3 || !shape[vIdx]) return;
            const targetDeg = parseFloat(newAngleDeg);
            if (isNaN(targetDeg) || targetDeg <= 1 || targetDeg >= 179) return;

            const n = shape.length;
            const pPrev = shape[(vIdx - 1 + n) % n];
            const pCurr = shape[vIdx];
            const pNext = shape[(vIdx + 1) % n];

            const isCW = getPolygonArea(shape) > 0;
            const a1 = Math.atan2(pPrev.y - pCurr.y, pPrev.x - pCurr.x);
            const targetRad = targetDeg * Math.PI / 180;
            const newA2 = isCW ? (a1 - targetRad) : (a1 + targetRad);
            const lenNext = Math.sqrt(dist2(pCurr, pNext));

            pNext.x = pCurr.x + lenNext * Math.cos(newA2);
            pNext.y = pCurr.y + lenNext * Math.sin(newA2);

            applyConstraints();
            draw();
        }

        function updatePanels(sIdx, isSyncOnly = false) {
            if (selectedShapeIndices.length > 1) {
                canvasPropsContent.classList.add('hidden'); objectPropsContent.classList.remove('hidden');
                sidebarTitle.innerText = "다중 객체 선택됨"; sidebarLockIndicator.innerText = `${selectedShapeIndices.length}개 선택됨`;
                sidebarLockIndicator.classList.remove('hidden');
                multiEditForm.innerHTML = `<div class="p-4 text-center text-xs text-gray-500 font-medium">다중 선택 모드입니다.<br><br>상단 <strong>🖨️ 선택 도형 인쇄</strong> 또는 우클릭 메뉴로 출력/벡터 저장할 수 있습니다.</div>`;
                activePanelShapeIndex = null; return;
            }

            if (sIdx === null || sIdx < 0 || sIdx >= shapes.length) {
                canvasPropsContent.classList.remove('hidden'); objectPropsContent.classList.add('hidden');
                sidebarTitle.innerText = "캔버스 속성"; sidebarLockIndicator.classList.add('hidden');
                activePanelShapeIndex = null; return;
            }

            const shape = shapes[sIdx];
            canvasPropsContent.classList.add('hidden'); objectPropsContent.classList.remove('hidden');
            
            if (lockedShapeIndex === sIdx) {
                sidebarTitle.innerText = "객체 속성 편집"; sidebarLockIndicator.innerText = "도형 선택됨"; sidebarLockIndicator.classList.remove('hidden');
            } else {
                sidebarTitle.innerText = "도형 속성 실시간 호버"; sidebarLockIndicator.classList.add('hidden');
            }

            const isPolygon = (shape.type === 'polygon' || !shape.type);
            const isCircle = (shape.type === 'circle');
            const isLine = (shape.type === 'line');

            if (isSyncOnly && activePanelShapeIndex === sIdx) {
                const isCW = isPolygon && shape.length >= 3 ? getPolygonArea(shape) > 0 : true;
                multiEditForm.querySelectorAll('.angle-input').forEach(inp => {
                    if (document.activeElement === inp) return;
                    const idx = parseInt(inp.dataset.vidx);
                    const v = shape[idx];
                    const pPrev = shape[(idx - 1 + shape.length) % shape.length];
                    const pNext = shape[(idx + 1) % shape.length];
                    let a1 = Math.atan2(pPrev.y - v.y, pPrev.x - v.x), a2 = Math.atan2(pNext.y - v.y, pNext.x - v.x);
                    let angleCCW = a2 - a1; while (angleCCW < 0) angleCCW += 2 * Math.PI;
                    let interiorAngle = isCW ? (2 * Math.PI - angleCCW) : angleCCW;
                    if (interiorAngle >= 2 * Math.PI) interiorAngle -= 2 * Math.PI;
                    inp.value = (interiorAngle * 180 / Math.PI).toFixed(1);
                });
                multiEditForm.querySelectorAll('.length-input').forEach(inp => {
                    if (document.activeElement === inp) return;
                    const v1 = parseInt(inp.dataset.vidx);
                    const v2 = parseInt(inp.dataset.v2idx);
                    const p1 = shape[v1], p2 = shape[v2];
                    if (p1 && p2) inp.value = (Math.sqrt(dist2(p1, p2)) / 50).toFixed(1);
                });
                return;
            }

            activePanelShapeIndex = sIdx; multiEditForm.innerHTML = '';

            if (isPolygon && shape.length >= 3) {
                const angleHeader = document.createElement('div');
                angleHeader.className = "text-xs font-bold text-amber-600 border-b pb-1 mt-1 flex justify-between items-center";
                angleHeader.innerHTML = "<span>📐 내각 (Visible / 수치)</span>";
                multiEditForm.appendChild(angleHeader);

                const isCW = getPolygonArea(shape) > 0;
                shape.forEach((v, idx) => {
                    const pPrev = shape[(idx - 1 + shape.length) % shape.length];
                    const pNext = shape[(idx + 1) % shape.length];
                    let a1 = Math.atan2(pPrev.y - v.y, pPrev.x - v.x), a2 = Math.atan2(pNext.y - v.y, pNext.x - v.x);
                    let angleCCW = a2 - a1; while (angleCCW < 0) angleCCW += 2 * Math.PI;
                    let interiorAngle = isCW ? (2 * Math.PI - angleCCW) : angleCCW;
                    if (interiorAngle >= 2 * Math.PI) interiorAngle -= 2 * Math.PI;
                    let currentDeg = (interiorAngle * 180 / Math.PI).toFixed(1);

                    const row = document.createElement('div');
                    row.className = "flex items-center justify-between text-xs gap-1";
                    row.innerHTML = `
                        <div class="flex items-center space-x-1.5 min-w-[55px]">
                            <input type="checkbox" onchange="toggleAngleVisible(${sIdx}, ${idx}, this.checked)" ${v.showAngle !== false ? 'checked' : ''} class="form-checkbox h-3.5 w-3.5 text-amber-600 rounded cursor-pointer">
                            <label class="font-medium text-gray-700">각 ${v.label}</label>
                        </div>
                        <div class="flex items-center space-x-1 flex-1 justify-end">
                            <input type="number" step="1" min="1" max="179" data-vidx="${idx}" value="${currentDeg}" class="angle-input w-full px-2 py-1 border rounded bg-white text-right font-mono text-xs focus:ring-2 focus:ring-amber-400 focus:outline-none">
                            <span class="text-gray-500 font-semibold w-4 text-center select-none">°</span>
                        </div>
                    `;
                    const inp = row.querySelector('.angle-input');
                    inp.addEventListener('input', (e) => applyInteriorAngleChange(sIdx, idx, e.target.value));
                    inp.addEventListener('change', () => saveHistory());
                    inp.addEventListener('wheel', (e) => {
                        e.preventDefault();
                        const delta = e.deltaY < 0 ? 1 : -1;
                        const nextVal = Math.max(1, Math.min(179, (parseFloat(inp.value) || 0) + delta));
                        inp.value = nextVal.toFixed(1);
                        applyInteriorAngleChange(sIdx, idx, nextVal);
                        saveHistory();
                    });
                    multiEditForm.appendChild(row);
                });
            }

            const edgeHeader = document.createElement('div');
            edgeHeader.className = "text-xs font-bold text-indigo-600 border-b pb-1 mt-2 flex justify-between items-center";
            edgeHeader.innerHTML = isCircle ? "<span>📏 반지름 (Visible / 수치)</span>" : "<span>📏 변의 길이 (Visible / 수치)</span>";
            multiEditForm.appendChild(edgeHeader);

            let edges = [];
            if (isPolygon) { for (let i = 0; i < shape.length; i++) edges.push([i, (i+1)%shape.length]); }
            else if (isLine || isCircle) edges.push([0, 1]);

            edges.forEach(([v1, v2]) => {
                const p1 = shape[v1], p2 = shape[v2];
                const currLenPx = Math.sqrt(dist2(p1, p2));
                const currLenCm = (currLenPx / 50).toFixed(1);
                const labelText = isCircle ? `반지름 ${p1.label}${p2.label}` : `변 ${p1.label}${p2.label}`;

                const row = document.createElement('div');
                row.className = "flex items-center justify-between text-xs gap-1";
                row.innerHTML = `
                    <div class="flex items-center space-x-1.5 min-w-[70px]">
                        <input type="checkbox" onchange="toggleLengthVisible(${sIdx}, ${v1}, this.checked)" ${p1.showLength !== false ? 'checked' : ''} class="form-checkbox h-3.5 w-3.5 text-indigo-600 rounded cursor-pointer">
                        <label class="font-medium text-gray-700 truncate">${labelText}</label>
                    </div>
                    <div class="flex items-center space-x-1 flex-1 justify-end">
                        <input type="number" step="0.1" min="0.1" data-vidx="${v1}" data-v2idx="${v2}" value="${currLenCm}" class="length-input w-full px-2 py-1 border rounded bg-white text-right font-mono text-xs focus:ring-2 focus:ring-indigo-400 focus:outline-none">
                        <span class="text-gray-500 font-semibold text-[11px] select-none pl-0.5">cm</span>
                    </div>
                `;
                const inp = row.querySelector('.length-input');
                inp.addEventListener('input', (e) => applyEdgeLengthChange(sIdx, v1, v2, e.target.value));
                inp.addEventListener('change', () => saveHistory());
                inp.addEventListener('wheel', (e) => {
                    e.preventDefault();
                    const step = e.shiftKey ? 0.5 : 0.1;
                    const delta = e.deltaY < 0 ? step : -step;
                    const nextVal = Math.max(0.1, (parseFloat(inp.value) || 0) + delta);
                    inp.value = nextVal.toFixed(1);
                    applyEdgeLengthChange(sIdx, v1, v2, nextVal);
                    saveHistory();
                });
                multiEditForm.appendChild(row);
            });
        }

        function toggleAngleVisible(sIdx, vIdx, isChecked) {
            if (shapes[sIdx] && shapes[sIdx][vIdx]) { shapes[sIdx][vIdx].showAngle = isChecked; saveHistory(); draw(); }
        }

        function toggleLengthVisible(sIdx, vIdx, isChecked) {
            if (shapes[sIdx] && shapes[sIdx][vIdx]) { shapes[sIdx][vIdx].showLength = isChecked; saveHistory(); draw(); }
        }

        function deleteSelectedShapes() {
            if (selectedShapeIndices.length === 0) return;
            const sortedIndices = [...selectedShapeIndices].sort((a, b) => b - a);
            sortedIndices.forEach(idx => { shapes.splice(idx, 1); });
            selectedShapeIndices = []; applyConstraints(); saveHistory(); draw(); updatePanels(null);
        }

        function setupEvents() {
            modeDrawBtn.addEventListener('click', () => setMode('draw'));
            modeSelectBtn.addEventListener('click', () => setMode('select'));
            drawPolygonBtn.addEventListener('click', () => setDrawType('polygon'));
            drawLineBtn.addEventListener('click', () => setDrawType('line'));
            drawCircleBtn.addEventListener('click', () => setDrawType('circle'));

            // 정다각형 모달 제어
            drawRegularPolygonBtn.addEventListener('click', () => {
                regPolyModal.classList.remove('hidden');
                regPolySidesInput.focus();
            });
            closeRegPolyModal.addEventListener('click', () => regPolyModal.classList.add('hidden'));
            cancelRegPolyBtn.addEventListener('click', () => regPolyModal.classList.add('hidden'));
            confirmRegPolyBtn.addEventListener('click', () => {
                regularPolyParams = {
                    sides: Math.max(3, Math.min(20, parseInt(regPolySidesInput.value) || 5)),
                    lengthCm: Math.max(0.5, parseFloat(regPolyLengthInput.value) || 3)
                };
                regPolyModal.classList.add('hidden');
                setDrawType('regular');
                showToast(`🌟 캔버스를 클릭하여 정${regularPolyParams.sides}각형을 배치하세요`);
            });

            // 줌 버튼 제어
            zoomInBtn.addEventListener('click', () => {
                const rect = canvasContainer.getBoundingClientRect();
                setZoomAtPoint(globalScale * 1.15, rect.width / 2, rect.height / 2);
            });
            zoomOutBtn.addEventListener('click', () => {
                const rect = canvasContainer.getBoundingClientRect();
                setZoomAtPoint(globalScale / 1.15, rect.width / 2, rect.height / 2);
            });
            zoomLevelText.addEventListener('click', () => {
                const rect = canvasContainer.getBoundingClientRect();
                setZoomAtPoint(1.0, rect.width / 2, rect.height / 2);
            });

            // 캔버스 휠 줌
            canvas.addEventListener('wheel', (e) => {
                e.preventDefault();
                const physicalPos = getPointerPos(e);
                const zoomFactor = e.deltaY < 0 ? 1.1 : 0.9;
                setZoomAtPoint(globalScale * zoomFactor, physicalPos.x, physicalPos.y);
            }, { passive: false });

            groupBtn.addEventListener('click', groupSelectedShapes);
            ungroupBtn.addEventListener('click', ungroupSelectedShapes);
            printSelectedBtn.addEventListener('click', printSelectedShapes);

            undoBtn.addEventListener('click', () => { undo(); showToast('↩️ 실행 취소'); });
            clearBtn.addEventListener('click', () => { shapes = []; currentShape = []; globalVertexCount = 0; selectedShapeIndices = []; selectionBox = null; saveHistory(); draw(); updatePanels(null); });
            showGridCheck.addEventListener('change', draw);
            showRulerCheck.addEventListener('change', draw);

            canvas.addEventListener('mousedown', handlePointerDown);
            canvas.addEventListener('mousemove', handlePointerMove);
            canvas.addEventListener('contextmenu', handleContextMenu);
            window.addEventListener('mouseup', handlePointerUp);

            window.addEventListener('mousedown', (e) => {
                if (e.target !== canvas && !contextMenu.contains(e.target)) contextMenu.classList.add('hidden');
            });

            // 키보드 단축키 및 Space 패닝
            window.addEventListener('keydown', (e) => {
                const tag = document.activeElement ? document.activeElement.tagName : '';
                const isInputFocused = (tag === 'INPUT' || tag === 'TEXTAREA');

                if (e.code === 'Space' && !isInputFocused) {
                    if (!isSpaceDown) {
                        isSpaceDown = true;
                        canvas.style.cursor = 'grab';
                    }
                    e.preventDefault();
                    return;
                }

                if (isInputFocused) return;

                if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
                    e.preventDefault();
                    undo();
                    showToast('↩️ 실행 취소');
                } else if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key.toLowerCase() === 'g') {
                    e.preventDefault();
                    ungroupSelectedShapes();
                } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'g') {
                    e.preventDefault();
                    groupSelectedShapes();
                } else if ((e.ctrlKey || e.metaKey) && (e.key === '=' || e.key === '+')) {
                    e.preventDefault();
                    const rect = canvasContainer.getBoundingClientRect();
                    setZoomAtPoint(globalScale * 1.15, rect.width / 2, rect.height / 2);
                } else if ((e.ctrlKey || e.metaKey) && e.key === '-') {
                    e.preventDefault();
                    const rect = canvasContainer.getBoundingClientRect();
                    setZoomAtPoint(globalScale / 1.15, rect.width / 2, rect.height / 2);
                } else if ((e.ctrlKey || e.metaKey) && e.key === '0') {
                    e.preventDefault();
                    const rect = canvasContainer.getBoundingClientRect();
                    setZoomAtPoint(1.0, rect.width / 2, rect.height / 2);
                } else if (e.key.toLowerCase() === 'p') {
                    setMode('draw');
                } else if (e.key.toLowerCase() === 'v') {
                    setMode('select');
                } else if (e.key === 'Delete' || e.key === 'Backspace') {
                    if (selectedShapeIndices.length > 0) {
                        e.preventDefault();
                        deleteSelectedShapes();
                        showToast('🗑️ 선택 도형 삭제됨');
                    }
                } else if (e.key === 'Escape') {
                    if (currentShape.length > 0) {
                        currentShape = [];
                        draw();
                    } else if (selectedShapeIndices.length > 0) {
                        selectedShapeIndices = [];
                        updatePanels(null);
                        draw();
                    }
                    regPolyModal.classList.add('hidden');
                    printModal.classList.add('hidden');
                    contextMenu.classList.add('hidden');
                }
            });

            window.addEventListener('keyup', (e) => {
                if (e.code === 'Space') {
                    isSpaceDown = false;
                    isPanning = false;
                    canvas.style.cursor = (mode === 'draw' ? 'crosshair' : 'default');
                }
            });

            // 모달 및 내보내기 버튼 이벤트
            closePrintModal.addEventListener('click', () => printModal.classList.add('hidden'));
            cancelPrintBtn.addEventListener('click', () => printModal.classList.add('hidden'));
            execPrintBtn.addEventListener('click', () => window.print());
            downloadSvgBtn.addEventListener('click', downloadSVG);
            downloadPngBtn.addEventListener('click', downloadPNG);
            downloadPdfBtn.addEventListener('click', downloadPDF);
        }

        window.onload = init;
    </script>
</body>
</html>
