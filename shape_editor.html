        function handlePointerUp(e) {
            if (e.button !== 0) return;
            
            if (isPanning) {
                isPanning = false;
                canvas.style.cursor = isSpaceDown ? 'grab' : (mode === 'draw' ? 'crosshair' : 'default');
                return;
            }
            
            if (dragState) {
                let wasMoved = dragState.moved;
                const pos = getLogicalPos(getPointerPos(e));

                if (wasMoved) {
                    if (dragState.type === 'selection' && selectionBox) {
                        if (mode === 'draw') {
                            openPrintPreview();
                        } else {
                            selectionBox = null;
                        }
                    } else if (dragState.type !== 'selection') {
                        saveHistory();
                        if (dragState.type === 'bb_handle') {
                            updatePanels(lockedShapeIndex, true); 
                        }
                    }
                } else {
                    if (mode === 'draw') {
                        // 정다각형 생성 대기 상태일 경우: 클릭 위치를 중심점으로 정다각형 생성
                        if (drawType === 'regular' && regularPolyParams) {
                            const { numSides, sideLenCm } = regularPolyParams;
                            const sideLenPx = sideLenCm * 50;
                            const R = sideLenPx / (2 * Math.sin(Math.PI / numSides));
                            const cx = pos.x, cy = pos.y;
                            
                            const newShape = []; 
                            newShape.type = 'polygon'; 
                            newShape.id = generateId();
                            
                            for (let i = 0; i < numSides; i++) {
                                const angle = (2 * Math.PI * i / numSides) - Math.PI / 2;
                                newShape.push({ 
                                    x: cx + R * Math.cos(angle), 
                                    y: cy + R * Math.sin(angle), 
                                    showAngle: defaultAngleCheck.checked, 
                                    showLength: defaultLengthCheck.checked, 
                                    label: getAlphabetLabel(globalVertexCount++) 
                                });
                            }
                            shapes.push(newShape); 
                            saveHistory(); 
                            draw();
                            showToast(`🌟 중심점 (X:${Math.round(cx)}, Y:${Math.round(cy)})에 ${numSides}각형 생성됨`);
                            
                            // 대기 상태 초기화 후 다각형 기본 그리기 모드로 전환
                            regularPolyParams = null;
                            setDrawType('polygon');
                            dragState = null;
                            return;
                        }

                        let closed = false;
                        if (drawType === 'polygon' && currentShape.length > 2) {
                            const startPoint = currentShape[0];
                            if (Math.sqrt(dist2(pos, startPoint)) <= closeThreshold / globalScale) {
                                const newShape = [...currentShape]; newShape.type = 'polygon'; newShape.id = generateId();
                                shapes.push(newShape); currentShape = []; applyConstraints(); saveHistory(); closed = true;
                            }
                        }
                        
                        if (!closed) {
                            let labelStr = getAlphabetLabel(globalVertexCount++);
                            if (drawType === 'circle' && currentShape.length === 0) {
                                labelStr = 'O';
                            }

                            currentShape.push({ 
                                x: pos.x, y: pos.y, 
                                showAngle: defaultAngleCheck.checked, 
                                showLength: defaultLengthCheck.checked, 
                                label: labelStr 
                            });
                            
                            if (drawType === 'line' && currentShape.length === 2) { 
                                const newShape = [...currentShape]; newShape.type = 'line'; newShape.id = generateId(); 
                                shapes.push(newShape); currentShape = []; 
                            } else if (drawType === 'circle' && currentShape.length === 2) { 
                                const newShape = [...currentShape]; newShape.type = 'circle'; newShape.id = generateId(); 
                                shapes.push(newShape); currentShape = []; 
                            }
                            applyConstraints(); saveHistory();
                        }
                    }
                }
                dragState = null; draw();
            }
        }

        function handleContextMenu(e) {
            e.preventDefault();
            if (isPanning) return; 
            
            const physicalPos = getPointerPos(e);
            const pos = getLogicalPos(physicalPos);
            const target = getHitTarget(pos.x, pos.y);

            if (target) {
                const hitGroupIndices = getGroupIndices(target.shapeIndex);
                if (!hitGroupIndices.every(idx => selectedShapeIndices.includes(idx))) {
                    selectedShapeIndices = [...hitGroupIndices];
                }

                setMode('select');
                updatePanels(lockedShapeIndex);
                draw();

                contextMenu.innerHTML = '';

                svgExportItem.innerHTML = '<span>📐</span> SVG 벡터 파일로 내보내기';

                    groupItem.innerHTML = '<span>📦</span> 그룹 묶기';

                        groupSelectedShapes();

                if (hasGrouped) {

                    ungroupItem.innerHTML = '<span>🔓</span> 그룹 해제';

                        ungroupSelectedShapes();

                bringFrontBtn.className = 'w-full text-left px-4 py-2 hover:bg-gray-100 text-gray-700 flex items-center gap-2';
                bringFrontBtn.innerHTML = '<span>🔼</span> 맨 앞으로 가져오기';
                bringFrontBtn.onclick = () => {
                    const newIdx = bringShapeToFront(target.shapeIndex);
                    updatePanels(lockedShapeIndex);
                    draw();
                    contextMenu.classList.add('hidden');
                };
                contextMenu.appendChild(bringFrontBtn);

                const shape = shapes[target.shapeIndex];
                if ((shape.type === 'polygon' || !shape.type) && shape.length >= 3 && selectedShapeIndices.length === 1) {
                    const makeRegBtn = document.createElement('button');
                    makeRegBtn.className = 'w-full text-left px-4 py-2 hover:bg-gray-100 text-gray-700 flex items-center gap-2 border-b border-gray-100';
                    makeRegBtn.innerHTML = '<span>🌟</span> 정다각형으로 변환';
                    makeRegBtn.onclick = () => {
                        convertToRegularPolygon(target.shapeIndex);
                        contextMenu.classList.add('hidden');
                    };
                    contextMenu.appendChild(makeRegBtn);
                }

                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'w-full text-left px-4 py-2 hover:bg-red-50 text-red-600 flex items-center gap-2 mt-1';
                deleteBtn.innerHTML = '<span>🗑️</span> 삭제';
                deleteBtn.onclick = () => {
                    deleteSelectedShapes();
                    contextMenu.classList.add('hidden');
                };
                contextMenu.appendChild(deleteBtn);

                contextMenu.style.left = e.clientX + 'px';
                contextMenu.style.top = e.clientY + 'px';
                contextMenu.classList.remove('hidden');
            } else {
                contextMenu.classList.add('hidden');
            }
        }

        // 선택된 도형만 영역을 정밀 캡처하여 인쇄 모달을 여는 함수
        function printSelectedShapes() {
            if (selectedShapeIndices.length === 0) {
                return alert("인쇄할 도형을 선택해주세요 (Shift+클릭 또는 드래그 박스로 선택).");
            }

            const bounds = getMultipleShapesBounds(selectedShapeIndices);
            if (!bounds) return;

            // 여백(Padding) 추가 (논리 단위)
            const padding = 20 / globalScale;
            const minX = bounds.minX - padding;
            const minY = bounds.minY - padding;
            const maxX = bounds.maxX + padding;
            const maxY = bounds.maxY + padding;
            const w = maxX - minX;
            const h = maxY - minY;

            if (w < 5 || h < 5) return;

            // 지정된 도형들만 인쇄 미리보기용으로 캔버스 재그리기
            draw(true, selectedShapeIndices);

            const screenMinX = (minX * globalScale) + originX;
            const screenMinY = (minY * globalScale) + originY;
            const screenW = w * globalScale;
            const screenH = h * globalScale;
            const dpr = window.devicePixelRatio || 1;

            const cropCanvas = document.createElement('canvas');
            cropCanvas.width = screenW * dpr;
            cropCanvas.height = screenH * dpr;
            const cropCtx = cropCanvas.getContext('2d');

            cropCtx.drawImage(
                canvas,
                screenMinX * dpr, screenMinY * dpr, screenW * dpr, screenH * dpr,
                0, 0, screenW * dpr, screenH * dpr
            );

            printPreviewImg.src = cropCanvas.toDataURL('image/png');
            printModal.classList.remove('hidden');
            
            // 원래 상태로 캔버스 복원
            draw(false);
        }

        function groupSelectedShapes() {
            if (selectedShapeIndices.length < 2) {
                showToast('⚠️ 2개 이상의 도형을 선택해야 그룹으로 묶을 수 있습니다.');
                return;
            }
            const gId = 'group_' + Date.now();
            selectedShapeIndices.forEach(idx => {
                if (shapes[idx]) shapes[idx].groupId = gId;
            });
            saveHistory();
            draw();
            showToast(`📦 ${selectedShapeIndices.length}개 도형 그룹 생성됨`);
        }

        function ungroupSelectedShapes() {
            let count = 0;
            selectedShapeIndices.forEach(idx => {
                if (shapes[idx] && shapes[idx].groupId) {
                    delete shapes[idx].groupId;
                    count++;
                }
            });
            if (count > 0) {
                saveHistory();
                draw();
                showToast('🔓 그룹 해제됨');
            } else {
                showToast('⚠️ 선택한 도형에 그룹이 지정되어 있지 않습니다.');
            }
        }

        function convertToRegularPolygon(sIdx) {
            const shape = shapes[sIdx];
            if (!shape || shape.length < 3) return;
            
            const centroid = getPolygonCentroid(shape);
            let r = 0;
            shape.forEach(p => { r += Math.sqrt(dist2(p, centroid)); });
            r /= shape.length; 
            
            const n = shape.length;
            let startAngle = Math.atan2(shape[0].y - centroid.y, shape[0].x - centroid.x);
            
            for(let i=0; i<n; i++) {
                let angle = startAngle + (2 * Math.PI * i / n);
                shape[i].x = centroid.x + r * Math.cos(angle);
                shape[i].y = centroid.y + r * Math.sin(angle);
                shape[i].customAngle = undefined;
                shape[i].customLength = undefined;
            }
            applyConstraints(); saveHistory(); draw(); updatePanels(sIdx);
        }

        function openPrintPreview() {
            if (!selectionBox) return;
            draw(true);
            const minX = Math.min(selectionBox.startX, selectionBox.endX);
            const minY = Math.min(selectionBox.startY, selectionBox.endY);
            const w = Math.abs(selectionBox.endX - selectionBox.startX);
            const h = Math.abs(selectionBox.endY - selectionBox.startY);

            if (w < 10 || h < 10) { draw(false); return; }

            const screenMinX = (minX * globalScale) + originX;
            const screenMinY = (minY * globalScale) + originY;
            const screenW = w * globalScale;
            const screenH = h * globalScale;
            const dpr = window.devicePixelRatio || 1;

            const cropCanvas = document.createElement('canvas');
            cropCanvas.width = screenW * dpr;
            cropCanvas.height = screenH * dpr;
            const cropCtx = cropCanvas.getContext('2d');

            cropCtx.drawImage(
                canvas,
                screenMinX * dpr, screenMinY * dpr, screenW * dpr, screenH * dpr,
                0, 0, screenW * dpr, screenH * dpr
            );

            printPreviewImg.src = cropCanvas.toDataURL('image/png');
            printModal.classList.remove('hidden');
            draw(false);
        }

        function closePrintPreviewModal() {
            printModal.classList.add('hidden');
            selectionBox = null;
            setMode('draw');
            draw(false);
        }

        function downloadPNG() {
            const imageDataUrl = printPreviewImg.src;
            if (!imageDataUrl) return alert("다운로드할 이미지가 없습니다.");
            const link = document.createElement('a');
            link.href = imageDataUrl;
            link.download = `geometry_selection_${Date.now()}.png`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function downloadPDF() {
            const imageDataUrl = printPreviewImg.src;
            if (!imageDataUrl) return alert("다운로드할 이미지가 없습니다.");
            const { jsPDF } = window.jspdf;
            const img = new Image();
            img.src = imageDataUrl;
            img.onload = () => {
                const imgWidth = img.width;
                const imgHeight = img.height;
                const orientation = imgWidth > imgHeight ? 'landscape' : 'portrait';
                const pdf = new jsPDF({ orientation: orientation, unit: 'px', format: [imgWidth, imgHeight] });
                pdf.addImage(imageDataUrl, 'PNG', 0, 0, imgWidth, imgHeight);
                pdf.save(`geometry_selection_${Date.now()}.pdf`);
            };
        }

        function updateDrawToolUI() {
            drawBtns.forEach(btn => btn.classList.remove('active'));
            if(mode === 'draw') {
                if(drawType === 'polygon') drawPolygonBtn.classList.add('active');
                if(drawType === 'line') drawLineBtn.classList.add('active');
                if(drawType === 'circle') drawCircleBtn.classList.add('active');
                if(drawType === 'regular') drawRegularPolygonBtn.classList.add('active');
            }
        }

        function setMode(newMode) {
            if (mode === newMode) return;
            mode = newMode;
            if (mode === 'draw') {
                modeDrawBtn.classList.add('active'); modeSelectBtn.classList.remove('active');
                instructionBanner.innerHTML = '💡 <strong>그리기 모드:</strong> 좌측 툴바에서 도형을 선택하고 캔버스에 그려주세요. (Ctrl+휠: 확대/축소, Space+드래그: 화면이동)';
                instructionBanner.className = 'bg-indigo-50 border-b border-indigo-100 px-4 py-2 text-sm text-indigo-700 font-medium flex items-center justify-center transition-colors z-10 shrink-0';
                updateDrawToolUI();
            } else {
                modeSelectBtn.classList.add('active'); modeDrawBtn.classList.remove('active');
                drawBtns.forEach(btn => btn.classList.remove('active'));
                instructionBanner.innerHTML = '💡 <strong>선택/이동 모드:</strong> Shift+클릭 또는 드래그 박스로 다중 선택하고, 상단 버튼이나 우클릭 메뉴로 선택 도형을 인쇄할 수 있습니다.';
                instructionBanner.className = 'bg-green-50 border-b border-green-100 px-4 py-2 text-sm text-green-700 font-medium flex items-center justify-center transition-colors z-10 shrink-0';
                if (currentShape.length > 0) currentShape = [];
                regularPolyParams = null;
            }
            draw();
        }

        function setDrawType(type) {
            drawType = type;
            setMode('draw');
            updateDrawToolUI();
        }

        function handleStepper(event, sIdx, vIdx, type) {
            if (event.type === 'keydown' && event.key !== 'ArrowUp' && event.key !== 'ArrowDown') return;
            if (event.type === 'wheel') event.preventDefault(); 
            
            const valStr = event.target.value.replace(/[^0-9.-]/g, '');
            let val = parseFloat(valStr);
            if (isNaN(val)) return;

            let delta = 0;
            if (event.key === 'ArrowUp' || (event.type === 'wheel' && event.deltaY < 0)) delta = 1;
            else if (event.key === 'ArrowDown' || (event.type === 'wheel' && event.deltaY > 0)) delta = -1;

            if (delta !== 0) {
                event.preventDefault(); 
                let newVal = val + delta;
                
                if (newVal < 1) newVal = 1;

                event.target.value = newVal.toFixed(1);
                
                if (type === 'angle') applySingleAngle(sIdx, vIdx, true);
                else applySingleLength(sIdx, vIdx, true);
            }
        }

        function updatePanels(sIdx, isSyncOnly = false) {
            if (selectedShapeIndices.length > 1) {
                canvasPropsContent.classList.add('hidden');
                objectPropsContent.classList.remove('hidden');
                sidebarTitle.innerText = "다중 객체 선택됨";
                sidebarLockIndicator.innerText = `${selectedShapeIndices.length}개 선택됨`;
                sidebarLockIndicator.classList.remove('hidden');
                multiEditForm.innerHTML = `<div class="p-4 text-center text-xs text-gray-500 font-medium">다중 선택 모드입니다.<br><br>도형들을 함께 이동하거나 상단 <strong>🖨️ 선택 도형 인쇄</strong> 또는 우클릭 메뉴로 출력/벡터 저장할 수 있습니다.</div>`;
                activePanelShapeIndex = null;
                return;
            }

            if (sIdx === null || sIdx < 0 || sIdx >= shapes.length) {
                canvasPropsContent.classList.remove('hidden');
                objectPropsContent.classList.add('hidden');
                sidebarTitle.innerText = "캔버스 속성";
                sidebarLockIndicator.classList.add('hidden');
                activePanelShapeIndex = null;
                return;
            }

            const shape = shapes[sIdx];
            canvasPropsContent.classList.add('hidden');
            objectPropsContent.classList.remove('hidden');
            
            if (lockedShapeIndex === sIdx) {
                sidebarTitle.innerText = "객체 속성 편집";
                sidebarLockIndicator.innerText = "도형 선택됨";
                sidebarLockIndicator.classList.remove('hidden');
            } else {
                sidebarTitle.innerText = "도형 속성 실시간 호버";
                sidebarLockIndicator.classList.add('hidden');
            }

            const isPolygon = (shape.type === 'polygon' || !shape.type);
            const isCircle = (shape.type === 'circle');
            const isLine = (shape.type === 'line');

            if (isSyncOnly && activePanelShapeIndex === sIdx) {
                if (isPolygon && shape.length >= 3) {
                    const isCW = getPolygonArea(shape) > 0;
                    shape.forEach((v, idx) => {
                        const input = multiEditForm.querySelector(`.angle-input[data-vidx="${idx}"]`);
                        if (input && document.activeElement !== input && !v.customAngle) {
                            const pPrev = shape[(idx - 1 + shape.length) % shape.length];
                            const pNext = shape[(idx + 1) % shape.length];
                            let a1 = Math.atan2(pPrev.y - v.y, pPrev.x - v.x);
                            let a2 = Math.atan2(pNext.y - v.y, pNext.x - v.x);
                            let angleCCW = a2 - a1; while (angleCCW < 0) angleCCW += 2 * Math.PI;
                            let interiorAngle = isCW ? (2 * Math.PI - angleCCW) : angleCCW;
                            if (interiorAngle >= 2 * Math.PI) interiorAngle -= 2 * Math.PI;
                            input.value = (interiorAngle * 180 / Math.PI).toFixed(1);
                        }
                    });
                }
                let edges = [];
                if (isPolygon) { for (let i = 0; i < shape.length; i++) edges.push([i, (i+1)%shape.length]); }
                else if (isLine || isCircle) edges.push([0, 1]);

                edges.forEach(([v1, v2]) => {
                    const input = multiEditForm.querySelector(`.length-input[data-vidx="${v1}"]`);
                    if (input && document.activeElement !== input && !shape[v1].customLength) {
                        const p1 = shape[v1], p2 = shape[v2];
                        const currLenPx = Math.sqrt(dist2(p1, p2));
                        input.value = (currLenPx / 50).toFixed(1);
                    }
                });
                return;
            }

            activePanelShapeIndex = sIdx;
            multiEditForm.innerHTML = '';

            if (isPolygon && shape.length >= 3) {
                const angleHeader = document.createElement('div');
                angleHeader.className = "text-xs font-bold text-amber-600 border-b pb-1 mt-1 flex justify-between items-center";
                angleHeader.innerHTML = "<span>📐 내각 (Visible / 수치·변수)</span>";
                multiEditForm.appendChild(angleHeader);

                const isCW = getPolygonArea(shape) > 0;
                shape.forEach((v, idx) => {
                    const pPrev = shape[(idx - 1 + shape.length) % shape.length];
                    const pNext = shape[(idx + 1) % shape.length];
                    
                    let a1 = Math.atan2(pPrev.y - v.y, pPrev.x - v.x);
                    let a2 = Math.atan2(pNext.y - v.y, pNext.x - v.x);
                    let angleCCW = a2 - a1; while (angleCCW < 0) angleCCW += 2 * Math.PI;
                    let interiorAngle = isCW ? (2 * Math.PI - angleCCW) : angleCCW;
                    if (interiorAngle >= 2 * Math.PI) interiorAngle -= 2 * Math.PI;
                    let currentDeg = (interiorAngle * 180 / Math.PI).toFixed(1);
                    const displayVal = v.customAngle !== undefined ? v.customAngle : currentDeg;

                    const row = document.createElement('div');
                    row.className = "flex items-center justify-between text-xs gap-1";
                    row.innerHTML = `
                        <div class="flex items-center space-x-1.5 min-w-[55px]">
                            <input type="checkbox" onchange="toggleAngleVisible(${sIdx}, ${idx}, this.checked)" ${v.showAngle !== false ? 'checked' : ''} 
                                class="form-checkbox h-3.5 w-3.5 text-amber-600 rounded cursor-pointer" title="표시 여부">
                            <label class="font-medium text-gray-700">각 ${v.label}</label>
                        </div>
                        <div class="flex items-center space-x-1 flex-1 justify-end">
                            <input type="text" data-vidx="${idx}" value="${displayVal}" placeholder="60 또는 x" 
                                class="angle-input w-full px-2 py-1 border rounded bg-white text-right focus:ring-1 focus:ring-amber-500 font-mono text-xs"
                                oninput="applySingleAngle(${sIdx}, ${idx}, true)"
                                onchange="applySingleAngle(${sIdx}, ${idx})"
                                onkeydown="handleStepper(event, ${sIdx}, ${idx}, 'angle'); if(event.key === 'Enter') this.blur();"
                                onwheel="handleStepper(event, ${sIdx}, ${idx}, 'angle')">
                            <span class="text-gray-500 font-semibold w-4 text-center select-none">°</span>
                        </div>
                    `;
                    multiEditForm.appendChild(row);
                });
            }

            const edgeHeader = document.createElement('div');
            edgeHeader.className = "text-xs font-bold text-indigo-600 border-b pb-1 mt-2 flex justify-between items-center";
            edgeHeader.innerHTML = isCircle ? "<span>📏 반지름 (Visible / 수치·변수)</span>" : "<span>📏 변의 길이 (Visible / 수치·변수)</span>";
            multiEditForm.appendChild(edgeHeader);

            let edges = [];
            if (isPolygon) { for (let i = 0; i < shape.length; i++) edges.push([i, (i+1)%shape.length]); }
            else if (isLine || isCircle) edges.push([0, 1]);

            edges.forEach(([v1, v2]) => {
                const p1 = shape[v1], p2 = shape[v2];
                const currLenPx = Math.sqrt(dist2(p1, p2));
                const currLenCm = (currLenPx / 50).toFixed(1);
                const labelText = isCircle ? `반지름 ${p1.label}${p2.label}` : `변 ${p1.label}${p2.label}`;
                const displayVal = p1.customLength !== undefined ? p1.customLength : currLenCm;

                const row = document.createElement('div');
                row.className = "flex items-center justify-between text-xs gap-1";
                row.innerHTML = `
                    <div class="flex items-center space-x-1.5 min-w-[70px]">
                        <input type="checkbox" onchange="toggleLengthVisible(${sIdx}, ${v1}, this.checked)" ${p1.showLength !== false ? 'checked' : ''} 
                            class="form-checkbox h-3.5 w-3.5 text-indigo-600 rounded cursor-pointer" title="표시 여부">
                        <label class="font-medium text-gray-700 truncate">${labelText}</label>
                    </div>
                    <div class="flex items-center space-x-1 flex-1 justify-end">
                        <input type="text" data-vidx="${v1}" value="${displayVal}" placeholder="3 또는 r" 
                            class="length-input w-full px-2 py-1 border rounded bg-white text-right focus:ring-1 focus:ring-indigo-500 font-mono text-xs"
                            oninput="applySingleLength(${sIdx}, ${v1}, true)"
                            onchange="applySingleLength(${sIdx}, ${v1})"
                            onkeydown="handleStepper(event, ${sIdx}, ${v1}, 'length'); if(event.key === 'Enter') this.blur();"
                            onwheel="handleStepper(event, ${sIdx}, ${v1}, 'length')">
                        <span class="text-gray-500 font-semibold text-[11px] select-none pl-0.5">cm</span>
                    </div>
                `;
                multiEditForm.appendChild(row);
            });
        }

        function toggleAngleVisible(sIdx, vIdx, isChecked) {
            if (shapes[sIdx] && shapes[sIdx][vIdx]) { shapes[sIdx][vIdx].showAngle = isChecked; draw(); }
        }

        function toggleLengthVisible(sIdx, vIdx, isChecked) {
            if (shapes[sIdx] && shapes[sIdx][vIdx]) { shapes[sIdx][vIdx].showLength = isChecked; draw(); }
        }

        function applySingleAngle(sIdx, vIdx, isSyncOnly = false) {
            const shape = shapes[sIdx];
            if (!shape || shape.length < 3) return;
            const input = multiEditForm.querySelector(`.angle-input[data-vidx="${vIdx}"]`);
            if (!input) return;

            const valStr = input.value.trim();
            let numVal = parseFloat(valStr);

            if (!isNaN(numVal) && !/[a-zA-Z가-힣]/.test(valStr)) {
                if (numVal < 1) {
                    numVal = 1;
                    if (!isSyncOnly) input.value = '1.0';
                }

                shape[vIdx].customAngle = undefined;
                const p = shape[vIdx];
                const pPrev = shape[(vIdx - 1 + shape.length) % shape.length];
                const nextIdx = (vIdx + 1) % shape.length;
                const pNext = shape[nextIdx]; 

                let a1 = Math.atan2(pPrev.y - p.y, pPrev.x - p.x);
                let a2 = Math.atan2(pNext.y - p.y, pNext.x - p.x);
                let isCW = getPolygonArea(shape) > 0;
                let angleCCW = a2 - a1; while (angleCCW < 0) angleCCW += 2 * Math.PI;
                let interiorAngle = isCW ? (2 * Math.PI - angleCCW) : angleCCW;
                if (interiorAngle >= 2 * Math.PI) interiorAngle -= 2 * Math.PI;

                let currentDeg = interiorAngle * 180 / Math.PI;
                let diffRad = (numVal - currentDeg) * Math.PI / 180;
                let rotRad = isCW ? -diffRad : diffRad;

                let distNext = Math.sqrt(dist2(p, pNext));
                if (distNext === 0) distNext = 50;

                let nx = p.x + (pNext.x - p.x) * Math.cos(rotRad) - (pNext.y - p.y) * Math.sin(rotRad);
                let ny = p.y + (pNext.x - p.x) * Math.sin(rotRad) + (pNext.y - p.y) * Math.cos(rotRad);

                pNext.x = nx; pNext.y = ny;
            } else { shape[vIdx].customAngle = valStr; }

            applyConstraints(); saveHistory(); draw(); updatePanels(sIdx, isSyncOnly);
        }

        function applySingleLength(sIdx, vIdx, isSyncOnly = false) {
            const shape = shapes[sIdx];
            if (!shape) return;
            const input = multiEditForm.querySelector(`.length-input[data-vidx="${vIdx}"]`);
            if (!input) return;

            const valStr = input.value.trim();
            let numVal = parseFloat(valStr);

            if (!isNaN(numVal) && !/[a-zA-Z가-힣]/.test(valStr)) {
                if (numVal < 1) {
                    numVal = 1;
                    if (!isSyncOnly) input.value = '1.0';
                }

                shape[vIdx].customLength = undefined;
                const p1 = shape[vIdx];
                let nextIdx = (vIdx + 1) % shape.length;
                if (shape.type === 'line' || shape.type === 'circle') nextIdx = 1;
                const p2 = shape[nextIdx];

                const targetPx = numVal * 50;
                const currPx = Math.sqrt(dist2(p1, p2));
                if (currPx > 0) {
                    const ratio = targetPx / currPx;
                    p2.x = p1.x + (p2.x - p1.x) * ratio;
                    p2.y = p1.y + (p2.y - p1.y) * ratio;
                }
            } else { shape[vIdx].customLength = valStr; }

            applyConstraints(); saveHistory(); draw(); updatePanels(sIdx, isSyncOnly);
        }

        function deleteShape(index) {
            shapes.splice(index, 1);
            selectedShapeIndices = [];
            applyConstraints(); saveHistory(); draw(); updatePanels(null);
        }

        function deleteSelectedShapes() {
            if (selectedShapeIndices.length === 0) return;
            const sortedIndices = [...selectedShapeIndices].sort((a, b) => b - a);
            sortedIndices.forEach(idx => {
                shapes.splice(idx, 1);
            });
            selectedShapeIndices = [];
            applyConstraints(); saveHistory(); draw(); updatePanels(null);
        }

        function setupEvents() {
            modeDrawBtn.addEventListener('click', () => setMode('draw'));
            modeSelectBtn.addEventListener('click', () => setMode('select'));
            drawPolygonBtn.addEventListener('click', () => setDrawType('polygon'));
            drawLineBtn.addEventListener('click', () => setDrawType('line'));
            drawCircleBtn.addEventListener('click', () => setDrawType('circle'));

            groupBtn.addEventListener('click', groupSelectedShapes);
            ungroupBtn.addEventListener('click', ungroupSelectedShapes);
            printSelectedBtn.addEventListener('click', printSelectedShapes);

            // 정다각형 클릭 시 조건 수집 후 캔버스 클릭 대기 상태로 설정
            drawRegularPolygonBtn.addEventListener('click', () => {
                const sidesInput = prompt("몇 각형을 그리시겠습니까? (3 이상의 숫자):", "5");
                if (!sidesInput) return;
                const numSides = parseInt(sidesInput.trim());
                if (isNaN(numSides) || numSides < 3) return alert("3 이상의 올바른 숫자를 입력해주세요.");
                
                const lenInput = prompt("변의 길이를 입력하세요 (cm):", "3");
                if (!lenInput) return;
                const sideLenCm = Number(lenInput.trim());
                if (isNaN(sideLenCm) || sideLenCm <= 0) return alert("올바른 변의 길이를 입력해주세요.");
                
                regularPolyParams = { numSides, sideLenCm };
                setDrawType('regular');
                instructionBanner.innerHTML = `💡 <strong>정다각형 모드:</strong> 캔버스에서 정다각형의 <strong>중심이 될 위치</strong>를 클릭하세요.`;
                instructionBanner.className = 'bg-indigo-100 border-b border-indigo-200 px-4 py-2 text-sm text-indigo-800 font-bold flex items-center justify-center transition-colors z-10 shrink-0';
            });

            undoBtn.addEventListener('click', () => { undo(); showToast('↩️ 실행 취소'); });
            clearBtn.addEventListener('click', () => { shapes = []; currentShape = []; globalVertexCount = 0; selectedShapeIndices = []; selectionBox = null; regularPolyParams = null; saveHistory(); draw(); updatePanels(null); });
            showGridCheck.addEventListener('change', draw);
            showRulerCheck.addEventListener('change', draw);
            
            canvas.addEventListener('wheel', (e) => {
                if (e.ctrlKey) {
                    e.preventDefault(); 
                    const zoomFactor = e.deltaY < 0 ? 1.1 : 0.9;
                    
                    const physicalPos = getPointerPos(e);
                    const mouseX = physicalPos.x;
                    const mouseY = physicalPos.y;

                    originX = mouseX - (mouseX - originX) * zoomFactor;
                    originY = mouseY - (mouseY - originY) * zoomFactor;
                    
                    globalScale *= zoomFactor;
                    globalScale = Math.max(0.1, Math.min(globalScale, 10)); 
                    
                    draw();
                }
            }, { passive: false });
            
            window.addEventListener('keydown', (e) => {
                if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

                const key = e.key.toLowerCase();

                if (e.code === 'Space') {
                    e.preventDefault(); 
                    if (!isSpaceDown) {
                        isSpaceDown = true;
                        if (!dragState) canvas.style.cursor = 'grab';
                    }
                }
                else if ((e.ctrlKey || e.metaKey) && e.shiftKey && key === 'g') {
                    e.preventDefault();
                    ungroupSelectedShapes();
                }
                else if ((e.ctrlKey || e.metaKey) && key === 'g') {
                    e.preventDefault();
                    groupSelectedShapes();
                }
                else if ((e.ctrlKey || e.metaKey) && key === 'z') {
                    e.preventDefault();
                    undo();
                    showToast('↩️ 실행 취소');
                }
                else if (key === 'v') {
                    setMode('select');
                    showToast('🖐 선택 모드 (V)');
                }
                else if (key === 'p') {
                    setMode('draw');
                    showToast('✏️ 그리기 모드 (P)');
                }
                else if (e.key === 'Delete' || e.key === 'Backspace') {
                    if (selectedShapeIndices.length > 0) {
                        deleteSelectedShapes();
                        showToast('🗑️ 선택 도형 삭제됨');
                    }
                }
            });

            window.addEventListener('keyup', (e) => {
                if (e.code === 'Space') {
                    isSpaceDown = false;
                    if (!isPanning && !dragState) {
                        canvas.style.cursor = (mode === 'draw' ? 'crosshair' : 'default');
                    }
                }
            });
            
            canvas.addEventListener('mousedown', handlePointerDown);
            canvas.addEventListener('mousemove', handlePointerMove);
            canvas.addEventListener('contextmenu', handleContextMenu);
            window.addEventListener('mouseup', handlePointerUp);

            window.addEventListener('mousedown', (e) => {
                if (e.target !== canvas && !contextMenu.contains(e.target)) {
                    contextMenu.classList.add('hidden');
                }
            });

            canvas.addEventListener('mouseleave', () => { 
                if (selectedShapeIndices.length === 0) {
                    hoverState = null; 
                    updatePanels(null); 
                }
                if (isPanning) {
                    isPanning = false;
                    canvas.style.cursor = isSpaceDown ? 'grab' : (mode === 'draw' ? 'crosshair' : 'default');
                }
                draw(); 
            });

            closePrintModal.addEventListener('click', closePrintPreviewModal);
            cancelPrintBtn.addEventListener('click', closePrintPreviewModal);
            downloadSvgBtn.addEventListener('click', downloadSVG);
            downloadPngBtn.addEventListener('click', downloadPNG);
            downloadPdfBtn.addEventListener('click', downloadPDF);
            execPrintBtn.addEventListener('click', () => {
                window.print();
            });
        }

        window.onload = init;
    </script>
</body>
</html>
