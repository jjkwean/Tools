<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>고급 도형 에디터 Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- jsPDF 라이브러리 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        body, html { height: 100%; margin: 0; overflow: hidden; }
        #canvas-container { touch-action: none; cursor: crosshair; }
        .mode-btn.active { background-color: #4f46e5; color: white; border-color: #4f46e5; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #a8a8a8; }

        @media print {
            body * { visibility: hidden; }
            #print-modal-content, #print-modal-content * { visibility: visible; }
            #print-modal-content { position: absolute; left: 0; top: 0; width: 100%; }
            .no-print { display: none !important; }
        }
    </style>
</head>
<body class="flex h-screen bg-gray-50 text-gray-800 font-sans select-none overflow-hidden">

    <!-- 좌측: 작업 영역 (Canvas) -->
    <div class="flex-1 flex flex-col relative overflow-hidden">
        <!-- 상단 헤더 툴바 -->
        <header class="bg-white shadow-sm p-4 flex flex-wrap justify-between items-center z-10 shrink-0 gap-4">
            <div class="flex items-center space-x-4">
                <h1 class="text-xl font-bold text-indigo-600 mr-4">Shape Editor Pro</h1>
                
                <div class="flex rounded-md shadow-sm" role="group">
                    <button id="mode-draw" class="mode-btn active px-4 py-2 text-sm font-medium border border-gray-200 rounded-l-lg hover:bg-indigo-50 transition-colors">
                        ✏️ 도형 그리기
                    </button>
                    <button id="mode-select" class="mode-btn px-4 py-2 text-sm font-medium border border-gray-200 border-l-0 rounded-r-lg hover:bg-indigo-50 transition-colors bg-white text-gray-700">
                        🖐 선택/이동
                    </button>
                </div>
                
                <div class="flex items-center space-x-3 ml-2 pl-4 border-l border-gray-300">
                    <label class="flex items-center space-x-1 text-sm text-gray-700 font-medium cursor-pointer">
                        <input type="checkbox" id="default-angle-check" checked class="form-checkbox h-4 w-4 text-indigo-600 rounded">
                        <span>각도 기본표시</span>
                    </label>
                    <label class="flex items-center space-x-1 text-sm text-gray-700 font-medium cursor-pointer">
                        <input type="checkbox" id="default-length-check" checked class="form-checkbox h-4 w-4 text-indigo-600 rounded">
                        <span>길이/반지름 기본표시</span>
                    </label>
                    <label class="flex items-center space-x-1 text-sm text-gray-700 font-medium cursor-pointer">
                        <input type="checkbox" id="show-grid-check" class="form-checkbox h-4 w-4 text-indigo-600 rounded">
                        <span>좌표평면</span>
                    </label>
                    <label class="flex items-center space-x-1 text-sm text-gray-700 font-medium cursor-pointer">
                        <input type="checkbox" id="show-ruler-check" checked class="form-checkbox h-4 w-4 text-indigo-600 rounded">
                        <span>자 표시</span>
                    </label>
                </div>
            
                <div class="flex space-x-3 ml-auto">
                    <button id="undo-btn" class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-semibold py-2 px-4 rounded-lg shadow transition duration-200">
                        ↩️ 되돌리기
                    </button>
                    <button id="clear-btn" class="bg-red-500 hover:bg-red-600 text-white font-semibold py-2 px-4 rounded-lg shadow transition duration-200">
                        🗑️ 전체 지우기
                    </button>
                </div>
            </div>
        </header>

        <!-- 동적 안내 배너 -->
        <div id="instruction-banner" class="bg-indigo-50 border-b border-indigo-100 px-4 py-2 text-sm text-indigo-700 font-medium flex items-center justify-center transition-colors z-10 shrink-0">
            💡 변의 보조 점선이 부드러운 곡선으로 표시되며 수치 바탕색이 투명하게 처리됩니다.
        </div>

        <!-- 캔버스 영역 -->
        <main class="flex-1 relative bg-gray-100 overflow-hidden" id="canvas-container">
            <canvas id="drawing-canvas" class="absolute top-0 left-0"></canvas>
        </main>
    </div>

    <!-- 우측: 고정형 동적 메뉴 패널 -->
    <aside class="w-80 bg-white border-l border-gray-200 flex flex-col shadow-xl z-20 flex-shrink-0">
        <div class="px-5 py-4 border-b border-gray-200 bg-gray-50 flex justify-between items-center">
            <h2 id="sidebar-title" class="text-lg font-bold text-gray-800 tracking-wide">그리기 & 이동 메뉴</h2>
            <span id="sidebar-lock-indicator" class="hidden text-xs bg-indigo-600 text-white font-semibold px-2 py-0.5 rounded-full">선택 고정 중</span>
        </div>

        <div id="sidebar-content" class="flex-1 overflow-y-auto p-4 flex flex-col gap-2">
            <div id="bg-menu-content" class="flex flex-col gap-2">
                <div class="text-xs text-gray-500 font-bold uppercase tracking-wider mb-2">작업 모드 및 기본 도형</div>
                
                <div class="grid grid-cols-2 gap-2 mb-2">
                    <button id="quick-mode-draw" class="py-2.5 px-3 rounded-lg border text-xs font-bold flex items-center justify-center gap-1 bg-indigo-50 border-indigo-200 text-indigo-700">
                        ✏️ 그리기 모드
                    </button>
                    <button id="quick-mode-select" class="py-2.5 px-3 rounded-lg border text-xs font-bold flex items-center justify-center gap-1 bg-gray-50 border-gray-200 text-gray-600">
                        🖐 선택/이동 모드
                    </button>
                </div>

                <div class="border-t border-gray-200 my-1"></div>

                <button id="draw-polygon-btn" class="w-full text-left px-4 py-3 rounded-lg bg-gray-50 hover:bg-indigo-50 border border-gray-100 text-sm text-gray-700 font-medium flex items-center shadow-sm">
                    <span class="mr-3 text-lg">🔷</span> 다각형 (Polygon)
                </button>
                <button id="draw-line-btn" class="w-full text-left px-4 py-3 rounded-lg bg-gray-50 hover:bg-indigo-50 border border-gray-100 text-sm text-gray-700 font-medium flex items-center shadow-sm">
                    <span class="mr-3 text-lg">➖</span> 선분 (Line)
                </button>
                <button id="draw-circle-btn" class="w-full text-left px-4 py-3 rounded-lg bg-gray-50 hover:bg-indigo-50 border border-gray-100 text-sm text-gray-700 font-medium flex items-center shadow-sm">
                    <span class="mr-3 text-lg">⭕</span> 원 (Circle)
                </button>
                <button id="draw-regular-polygon-btn" class="w-full text-left px-4 py-3 rounded-lg bg-indigo-50 hover:bg-indigo-100 border border-indigo-100 text-sm text-indigo-700 font-bold flex items-center shadow-sm mt-2">
                    <span class="mr-3 text-lg">🌟</span> 정다각형 생성
                </button>
            </div>

            <div id="object-menu-content" class="hidden flex flex-col gap-3">
                <div class="text-xs text-indigo-600 font-bold uppercase tracking-wider flex justify-between items-center">
                    <span>도형 수치 & 변수 편집</span>
                    <span class="text-[10px] text-gray-400 font-normal">표시여부 / 변수입력</span>
                </div>

                <div id="multi-edit-form" class="space-y-3 bg-gray-50 p-3 rounded-lg border border-gray-200 max-h-[460px] overflow-y-auto"></div>

                <div class="border-t border-gray-200 my-1"></div>

                <div id="dynamic-extra-actions" class="space-y-1.5"></div>
            </div>
        </div>
    </aside>

    <!-- 인쇄/다운로드 미리보기 모달 -->
    <div id="print-modal" class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-2xl max-w-4xl w-full flex flex-col max-h-[90vh] overflow-hidden">
            <div class="px-6 py-4 border-b border-gray-200 flex justify-between items-center bg-gray-50 no-print">
                <h3 class="text-lg font-bold text-gray-800">🖼️ 영역 캡처 미리보기 (원의 중심점 유지됨)</h3>
                <button id="close-print-modal" class="text-gray-400 hover:text-red-500 text-xl font-bold p-1">✕</button>
            </div>
            
            <div id="print-modal-content" class="p-6 flex-1 overflow-auto flex flex-col items-center justify-center bg-gray-100">
                <div class="bg-white p-4 shadow-lg rounded border border-gray-300">
                    <img id="print-preview-img" class="max-w-full max-h-[60vh] object-contain" alt="인쇄 미리보기">
                </div>
            </div>

            <div class="px-6 py-4 border-t border-gray-200 flex justify-end gap-2 bg-gray-50 no-print flex-wrap">
                <button id="cancel-print-btn" class="px-3 py-2 bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold rounded-lg transition text-sm">
                    닫기
                </button>
                <button id="download-png-btn" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-lg shadow transition text-sm flex items-center gap-1.5">
                    <span>🖼️</span> PNG 다운로드
                </button>
                <button id="download-pdf-btn" class="px-4 py-2 bg-red-600 hover:bg-red-700 text-white font-bold rounded-lg shadow transition text-sm flex items-center gap-1.5">
                    <span>📄</span> PDF 다운로드
                </button>
                <button id="exec-print-btn" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-lg shadow transition text-sm flex items-center gap-1.5">
                    <span>🖨️</span> 인쇄하기
                </button>
            </div>
        </div>
    </div>

    <script>
        const canvasContainer = document.getElementById('canvas-container');
        const canvas = document.getElementById('drawing-canvas');
        const ctx = canvas.getContext('2d');
        const undoBtn = document.getElementById('undo-btn');
        const clearBtn = document.getElementById('clear-btn');
        const modeDrawBtn = document.getElementById('mode-draw');
        const modeSelectBtn = document.getElementById('mode-select');
        const quickModeDraw = document.getElementById('quick-mode-draw');
        const quickModeSelect = document.getElementById('quick-mode-select');
        const instructionBanner = document.getElementById('instruction-banner');

        const sidebarTitle = document.getElementById('sidebar-title');
        const sidebarLockIndicator = document.getElementById('sidebar-lock-indicator');
        const bgMenuContent = document.getElementById('bg-menu-content');
        const objectMenuContent = document.getElementById('object-menu-content');
        const multiEditForm = document.getElementById('multi-edit-form');
        const dynamicExtraActions = document.getElementById('dynamic-extra-actions');
        
        const drawPolygonBtn = document.getElementById('draw-polygon-btn');
        const drawLineBtn = document.getElementById('draw-line-btn');
        const drawCircleBtn = document.getElementById('draw-circle-btn');
        const drawRegularPolygonBtn = document.getElementById('draw-regular-polygon-btn');

        const defaultAngleCheck = document.getElementById('default-angle-check');
        const defaultLengthCheck = document.getElementById('default-length-check');
        const showGridCheck = document.getElementById('show-grid-check');
        const showRulerCheck = document.getElementById('show-ruler-check');

        const printModal = document.getElementById('print-modal');
        const printPreviewImg = document.getElementById('print-preview-img');
        const closePrintModal = document.getElementById('close-print-modal');
        const cancelPrintBtn = document.getElementById('cancel-print-btn');
        const execPrintBtn = document.getElementById('exec-print-btn');
        const downloadPngBtn = document.getElementById('download-png-btn');
        const downloadPdfBtn = document.getElementById('download-pdf-btn');

        let mode = 'draw'; 
        let drawType = 'polygon'; 
        let shapes = []; 
        let currentShape = []; 
        let history = []; 
        let globalVertexCount = 0; 
        let globalScale = 1.0; 
        let originX = 0, originY = 0;
        
        const pointRadius = 6;
        const closeThreshold = 15; 
        let hoverState = null; 
        let dragState = null;  
        let lockedShapeIndex = null;
        let activePanelShapeIndex = null;
        let selectionBox = null;

        function init() {
            saveHistory(); 
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();
            setupEvents();
            updateInstructions();
            updatePanels(null); 
        }

        function generateId() { return 'shape_' + Date.now() + '_' + Math.random().toString(36).substring(2, 9); }
        function getAlphabetLabel(index) {
            let label = ''; let temp = index;
            do { label = String.fromCharCode(65 + (temp % 26)) + label; temp = Math.floor(temp / 26) - 1; } while (temp >= 0);
            return label;
        }

        function saveHistory() {
            const state = {
                shapes: shapes.map(s => { const arr = JSON.parse(JSON.stringify(s)); arr.type = s.type; arr.id = s.id; return arr; }),
                currentShape: JSON.parse(JSON.stringify(currentShape)),
                globalVertexCount: globalVertexCount
            };
            history.push(state);
            if (history.length > 50) history.shift();
        }

        function undo() {
            if (history.length > 1) {
                history.pop();
                const prevState = history[history.length - 1];
                shapes = prevState.shapes.map(s => { const arr = JSON.parse(JSON.stringify(s)); arr.type = s.type; arr.id = s.id; return arr; });
                currentShape = JSON.parse(JSON.stringify(prevState.currentShape));
                globalVertexCount = prevState.globalVertexCount;
                dragState = null; hoverState = null; lockedShapeIndex = null; selectionBox = null;
                updatePanels(null); applyConstraints(); draw();
            }
        }

        function applyConstraints() {
            let changed = false;
            for (let iter = 0; iter < 3; iter++) {
                shapes.forEach(shape => {
                    let pointDeltas = {};
                    if (shape.type === 'sector' || shape.type === 'segment') {
                        let C = shape[0], P1 = shape[1], P2 = shape[2];
                        let R = Math.sqrt(dist2(C, P1)), d2 = Math.sqrt(dist2(C, P2));
                        if (Math.abs(R - d2) > 0.01) {
                            let a2 = Math.atan2(P2.y - C.y, P2.x - C.x);
                            P2.x = C.x + R * Math.cos(a2); P2.y = C.y + R * Math.sin(a2); changed = true;
                        }
                    }
                    shape.forEach((p, i) => {
                        if (p.attachedTo) {
                            let att = p.attachedTo, targetShape = shapes.find(s => s.id === att.shapeId);
                            if (!targetShape) return;
                            let nx = p.x, ny = p.y;
                            if (att.type === 'vertex') {
                                let targetV = targetShape[att.vertexIndex];
                                if (targetV) { nx = targetV.x; ny = targetV.y; }
                            } else if (att.type === 'edge') {
                                let p1 = targetShape[att.v1], p2 = targetShape[att.v2];
                                if (p1 && p2) { nx = p1.x + att.t * (p2.x - p1.x); ny = p1.y + att.t * (p2.y - p1.y); }
                            } else if (att.type === 'circle_edge') {
                                let C = targetShape[0], P1 = targetShape[1];
                                if (C && P1) {
                                    let R = Math.sqrt(dist2(C, P1));
                                    nx = C.x + R * Math.cos(att.angle); ny = C.y + R * Math.sin(att.angle);
                                }
                            }
                            if (Math.abs(p.x - nx) > 0.01 || Math.abs(p.y - ny) > 0.01) {
                                pointDeltas[i] = { dx: nx - p.x, dy: ny - p.y };
                                p.x = nx; p.y = ny; changed = true;
                            }
                        }
                    });
                    const attachedIndices = Object.keys(pointDeltas);
                    if (attachedIndices.length > 0) {
                        let primaryDelta = pointDeltas[attachedIndices[0]];
                        shape.forEach((p, i) => { if (!p.attachedTo) { p.x += primaryDelta.dx; p.y += primaryDelta.dy; } });
                    }
                });
                if (!changed) break;
            }
        }

        function resizeCanvas() {
            const rect = canvasContainer.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            canvas.width = rect.width * dpr; canvas.height = rect.height * dpr;
            originX = rect.width / 2; originY = rect.height / 2;
            ctx.scale(dpr, dpr); draw();
        }

        function getPolygonArea(points) {
            let area = 0;
            for (let i = 0; i < points.length; i++) {
                let j = (i + 1) % points.length;
                area += (points[i].x * points[j].y) - (points[j].x * points[i].y);
            }
            return area / 2;
        }

        function getPolygonCentroid(points) {
            let cx = 0, cy = 0;
            points.forEach(p => { cx += p.x; cy += p.y; });
            return { x: cx / points.length, y: cy / points.length };
        }

        function drawGrid(rect) {
            let startX = -originX / globalScale, endX = (rect.width - originX) / globalScale;
            let startY = -originY / globalScale, endY = (rect.height - originY) / globalScale;
            let step = 10;
            ctx.save(); ctx.strokeStyle = '#e5e7eb'; ctx.lineWidth = 1 / globalScale; ctx.beginPath();
            for (let x = Math.floor(startX / step) * step; x <= endX; x += step) { ctx.moveTo(x, startY); ctx.lineTo(x, endY); }
            for (let y = Math.floor(startY / step) * step; y <= endY; y += step) { ctx.moveTo(startX, y); ctx.lineTo(endX, y); }
            ctx.stroke();
            ctx.strokeStyle = '#d1d5db'; ctx.lineWidth = 1.5 / globalScale; ctx.beginPath();
            for (let x = Math.floor(startX / 50) * 50; x <= endX; x += 50) { ctx.moveTo(x, startY); ctx.lineTo(x, endY); }
            for (let y = Math.floor(startY / 50) * 50; y <= endY; y += 50) { ctx.moveTo(startX, y); ctx.lineTo(endX, y); }
            ctx.stroke();
            ctx.strokeStyle = '#9ca3af'; ctx.lineWidth = 2 / globalScale; ctx.beginPath();
            ctx.moveTo(0, startY); ctx.lineTo(0, endY); ctx.moveTo(startX, 0); ctx.lineTo(endX, 0); ctx.stroke();
            ctx.fillStyle = '#6b7280'; ctx.font = `${12 / globalScale}px sans-serif`; ctx.textAlign = 'right'; ctx.textBaseline = 'top';
            ctx.fillText('0cm', -5 / globalScale, 5 / globalScale); ctx.restore();
        }

        function drawRulers(rect) {
            const rulerSize = 24;
            const pxPerCm = 50 * globalScale;
            
            ctx.save();
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            
            ctx.fillStyle = '#f8fafc';
            ctx.fillRect(0, 0, rect.width, rulerSize);
            ctx.fillRect(0, 0, rulerSize, rect.height);
            
            ctx.strokeStyle = '#cbd5e1'; ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(0, rulerSize); ctx.lineTo(rect.width, rulerSize);
            ctx.moveTo(rulerSize, 0); ctx.lineTo(rulerSize, rect.height);
            ctx.stroke();

            ctx.fillStyle = '#475569';
            ctx.font = '10px sans-serif';

            const minCmX = Math.floor((-originX * globalScale) / pxPerCm);
            const maxCmX = Math.ceil(((rect.width - originX) * globalScale) / pxPerCm);

            for (let cm = minCmX; cm <= maxCmX; cm++) {
                const screenX = originX + (cm * pxPerCm);
                if (screenX >= rulerSize && screenX <= rect.width) {
                    ctx.beginPath();
                    ctx.strokeStyle = (cm === 0) ? '#4f46e5' : '#94a3b8';
                    ctx.lineWidth = (cm === 0) ? 2 : 1;
                    ctx.moveTo(screenX, rulerSize);
                    ctx.lineTo(screenX, rulerSize - (cm % 5 === 0 ? 12 : 6));
                    ctx.stroke();

                    if (cm % 1 === 0) {
                        ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
                        ctx.fillText(`${cm}`, screenX, rulerSize - 13);
                    }
                }
            }

            const minCmY = Math.floor((-originY * globalScale) / pxPerCm);
            const maxCmY = Math.ceil(((rect.height - originY) * globalScale) / pxPerCm);

            for (let cm = minCmY; cm <= maxCmY; cm++) {
                const screenY = originY + (cm * pxPerCm);
                if (screenY >= rulerSize && screenY <= rect.height) {
                    ctx.beginPath();
                    ctx.strokeStyle = (cm === 0) ? '#4f46e5' : '#94a3b8';
                    ctx.lineWidth = (cm === 0) ? 2 : 1;
                    ctx.moveTo(rulerSize, screenY);
                    ctx.lineTo(rulerSize - (cm % 5 === 0 ? 12 : 6), screenY);
                    ctx.stroke();

                    if (cm % 1 === 0) {
                        ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
                        ctx.fillText(`${cm}`, rulerSize - 13, screenY);
                    }
                }
            }

            ctx.fillStyle = '#e2e8f0'; ctx.fillRect(0, 0, rulerSize, rulerSize);
            ctx.strokeStyle = '#cbd5e1'; ctx.strokeRect(0, 0, rulerSize, rulerSize);
            ctx.fillStyle = '#64748b'; ctx.font = 'bold 9px sans-serif';
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText('cm', rulerSize / 2, rulerSize / 2);

            ctx.restore();
        }

        function draw(isPrintPreview = false) {
            const rect = canvasContainer.getBoundingClientRect();
            ctx.clearRect(0, 0, rect.width, rect.height);
            ctx.save(); ctx.translate(originX, originY); ctx.scale(globalScale, globalScale);

            if (showGridCheck.checked && !isPrintPreview) drawGrid(rect);

            shapes.forEach((shape, sIdx) => {
                if (shape.length === 0) return;
                const shapeType = shape.type || 'polygon';
                
                const isHovered = (hoverState && hoverState.shapeIndex === sIdx);
                const isLocked = (lockedShapeIndex === sIdx);

                if (isLocked && !isPrintPreview) {
                    ctx.fillStyle = 'rgba(79, 70, 229, 0.25)'; ctx.strokeStyle = '#4338ca'; ctx.lineWidth = 4;
                } else if (isHovered && !isPrintPreview) {
                    ctx.fillStyle = 'rgba(99, 102, 241, 0.15)'; ctx.strokeStyle = '#6366f1'; ctx.lineWidth = 3.5;
                } else {
                    ctx.fillStyle = 'rgba(79, 70, 229, 0.05)'; ctx.strokeStyle = '#4f46e5'; ctx.lineWidth = 2.5;
                }
                ctx.lineJoin = 'round';

                if (shapeType === 'polygon') {
                    ctx.beginPath(); ctx.moveTo(shape[0].x, shape[0].y);
                    for (let i = 1; i < shape.length; i++) ctx.lineTo(shape[i].x, shape[i].y);
                    ctx.closePath(); ctx.fill(); ctx.stroke();
                } else if (shapeType === 'circle') {
                    const center = shape[0], edgePoint = shape[1], r = Math.sqrt(dist2(center, edgePoint));
                    ctx.beginPath(); ctx.arc(center.x, center.y, r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

                    // 원 반지름 표시 (배경 박스 투명 처리)
                    if (shape[0].showLength !== false && shape.length >= 2) {
                        ctx.save();
                        ctx.beginPath();
                        ctx.setLineDash([4, 4]);
                        ctx.strokeStyle = '#4f46e5';
                        ctx.lineWidth = 1.8;
                        ctx.moveTo(center.x, center.y);
                        ctx.lineTo(edgePoint.x, edgePoint.y);
                        ctx.stroke();
                        ctx.restore();

                        const rCm = (r / 50).toFixed(1) + ' cm';
                        const displayRadiusStr = shape[0].customLength ? shape[0].customLength : `r = ${rCm}`;

                        const angle = Math.atan2(edgePoint.y - center.y, edgePoint.x - center.x);
                        const midX = (center.x + edgePoint.x) / 2 + Math.cos(angle + Math.PI/2) * 14;
                        const midY = (center.y + edgePoint.y) / 2 + Math.sin(angle + Math.PI/2) * 14;
                        
                        ctx.font = 'bold italic 13px sans-serif';
                        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                        // 바탕색 투명 처리 (fillRect 제거)
                        ctx.fillStyle = '#4f46e5';
                        ctx.fillText(displayRadiusStr, midX, midY);
                    }
                } else if (shapeType === 'line') {
                    ctx.beginPath(); ctx.moveTo(shape[0].x, shape[0].y); ctx.lineTo(shape[1].x, shape[1].y); ctx.stroke();
                }

                // 부드러운 곡선 점선(Quadratic Curve) 및 투명 바탕 수치 표시
                if (shapeType === 'polygon' || shapeType === 'line') {
                    let edges = [];
                    if (shapeType === 'polygon') { 
                        for (let i = 0; i < shape.length; i++) edges.push([i, (i + 1) % shape.length]); 
                    } else if (shapeType === 'line') {
                        edges.push([0, 1]);
                    }

                    edges.forEach(([v1, v2]) => {
                        const p1 = shape[v1], p2 = shape[v2];
                        if (p1.showLength !== false) {
                            const dx = p2.x - p1.x, dy = p2.y - p1.y;
                            const lengthPx = Math.sqrt(dx * dx + dy * dy);
                            let lengthStr = (lengthPx / 50).toFixed(1) + ' cm';
                            const displayLengthStr = p1.customLength ? p1.customLength : lengthStr;

                            // 법선 벡터 계산
                            let isCW = true; 
                            if (shape.length >= 3 && shapeType === 'polygon') isCW = getPolygonArea(shape) > 0;
                            let nx = isCW ? dy : -dy, ny = isCW ? -dx : dx;
                            let nLen = Math.sqrt(nx * nx + ny * ny);
                            if (nLen > 0) { nx /= nLen; ny /= nLen; } else { nx = 0; ny = -1; }

                            // 부드러운 베지에 곡선 조종점(Control Point)과 수치 표시 위치 계산
                            const midX = (p1.x + p2.x) / 2;
                            const midY = (p1.y + p2.y) / 2;
                            const curveOffset = 25; // 곡선이 부풀어 오르는 정도
                            const controlX = midX + nx * curveOffset;
                            const controlY = midY + ny * curveOffset;

                            // 수치 위치 (곡선 중앙 피크점보다 약간 더 바깥쪽에 배치)
                            const textOffsetX = midX + nx * (curveOffset + 12);
                            const textOffsetY = midY + ny * (curveOffset + 12);

                            // 1. 부드러운 호(Arc) 형태의 점선 그리기
                            ctx.save();
                            ctx.beginPath();
                            ctx.setLineDash([4, 4]); // 점선 패턴
                            ctx.strokeStyle = '#6b7280';
                            ctx.lineWidth = 1.5;
                            ctx.moveTo(p1.x, p1.y);
                            ctx.quadraticCurveTo(controlX, controlY, p2.x, p2.y);
                            ctx.stroke();
                            ctx.restore();

                            // 2. 수치 텍스트 표시 (바탕색 투명)
                            ctx.font = 'italic 13px sans-serif'; 
                            ctx.textAlign = 'center'; 
                            ctx.textBaseline = 'middle';
                            ctx.fillStyle = '#1f2937'; 
                            ctx.fillText(displayLengthStr, textOffsetX, textOffsetY);
                        }
                    });
                }

                // 내각 크기 및 수치 표시 (바탕색 투명)
                if (shapeType === 'polygon') {
                    const isCW = getPolygonArea(shape) > 0;
                    shape.forEach((p2, i) => {
                        if (!p2.showAngle || shape.length < 3) return;
                        const p1 = shape[(i - 1 + shape.length) % shape.length], p3 = shape[(i + 1) % shape.length];
                        let a1 = Math.atan2(p1.y - p2.y, p1.x - p2.x), a2 = Math.atan2(p3.y - p2.y, p3.x - p2.x);
                        let angleCCW = a2 - a1; while (angleCCW < 0) angleCCW += 2 * Math.PI;
                        let interiorAngle = isCW ? (2 * Math.PI - angleCCW) : angleCCW;
                        if (interiorAngle >= 2 * Math.PI) interiorAngle -= 2 * Math.PI; 
                        
                        ctx.beginPath(); ctx.strokeStyle = 'rgba(245, 158, 11, 0.8)'; ctx.lineWidth = 2; ctx.fillStyle = 'rgba(245, 158, 11, 0.2)';
                        ctx.arc(p2.x, p2.y, 22, a1, a2, isCW); ctx.lineTo(p2.x, p2.y); ctx.fill(); ctx.stroke();

                        let angleDeg = (interiorAngle * 180 / Math.PI).toFixed(0) + '°';
                        const displayAngleStr = p2.customAngle ? p2.customAngle : angleDeg;

                        let midAngle = isCW ? (a1 - interiorAngle / 2) : (a1 + interiorAngle / 2);
                        const tx = p2.x + Math.cos(midAngle) * 36, ty = p2.y + Math.sin(midAngle) * 36;
                        ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                        // 바탕색 투명 처리 (fillRect 제거)
                        ctx.fillStyle = '#1f2937'; ctx.fillText(displayAngleStr, tx, ty);
                    });
                }

                const centroid = (shapeType === 'polygon' && shape.length >= 3) ? getPolygonCentroid(shape) : null;

                // 꼭짓점 및 영문 라벨 표시
                shape.forEach((p, vIdx) => {
                    const isCircleCenter = (shapeType === 'circle' && vIdx === 0);

                    if (!isPrintPreview || isCircleCenter) {
                        ctx.beginPath();
                        const isPtHovered = (hoverState && hoverState.shapeIndex === sIdx && hoverState.vertexIndex === vIdx);
                        
                        if (isCircleCenter) {
                            ctx.fillStyle = '#000000';
                        } else {
                            ctx.fillStyle = p.attachedTo ? '#9333ea' : (isPtHovered ? '#f59e0b' : '#ef4444');
                        }
                        
                        ctx.arc(p.x, p.y, isPtHovered ? pointRadius + 2 : pointRadius, 0, Math.PI * 2);
                        ctx.fill(); ctx.lineWidth = 1.5; ctx.strokeStyle = '#ffffff'; ctx.stroke();
                    }

                    if (p.label) {
                        ctx.font = 'italic bold 16px "Times New Roman", serif'; 
                        ctx.fillStyle = isCircleCenter ? '#000000' : '#111827'; 
                        
                        let labelX = p.x + 12, labelY = p.y - 10;
                        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

                        if (isCircleCenter) {
                            labelX = p.x - 14; labelY = p.y - 14;
                        } else if (centroid) {
                            let dirX = p.x - centroid.x, dirY = p.y - centroid.y;
                            let dist = Math.sqrt(dirX*dirX + dirY*dirY);
                            if (dist > 0) {
                                dirX /= dist; dirY /= dist;
                                labelX = p.x + dirX * 18;
                                labelY = p.y + dirY * 18;
                            }
                        }

                        ctx.fillText(p.label, labelX, labelY);
                    }
                });
            });

            if (currentShape.length > 0 && !isPrintPreview) {
                if (drawType === 'polygon' || drawType === 'line') {
                    ctx.beginPath(); ctx.strokeStyle = '#4f46e5'; ctx.lineWidth = 2.5; ctx.lineJoin = 'round';
                    ctx.moveTo(currentShape[0].x, currentShape[0].y);
                    for (let i = 1; i < currentShape.length; i++) ctx.lineTo(currentShape[i].x, currentShape[i].y);
                    ctx.stroke();
                } else if (drawType === 'circle' && currentShape.length === 1) {
                    const center = currentShape[0];
                    ctx.beginPath(); ctx.fillStyle = '#000000';
                    ctx.arc(center.x, center.y, pointRadius, 0, Math.PI * 2); ctx.fill();
                    ctx.font = 'italic bold 16px "Times New Roman", serif'; ctx.fillText('O', center.x - 14, center.y - 14);
                }

                currentShape.forEach((p, i) => {
                    ctx.beginPath();
                    let radius = pointRadius;
                    if (i === 0 && currentShape.length > 2 && drawType === 'polygon') { ctx.fillStyle = '#10b981'; radius += 2; } 
                    else { ctx.fillStyle = '#ef4444'; }
                    ctx.arc(p.x, p.y, radius, 0, Math.PI * 2);
                    ctx.fill(); ctx.lineWidth = 1.5; ctx.strokeStyle = '#ffffff'; ctx.stroke();
                });
            }

            if (selectionBox && !isPrintPreview) {
                ctx.save();
                ctx.setLineDash([6, 6]);
                ctx.strokeStyle = '#4f46e5';
                ctx.lineWidth = 2;
                ctx.fillStyle = 'rgba(79, 70, 229, 0.1)';
                
                const x = Math.min(selectionBox.startX, selectionBox.endX);
                const y = Math.min(selectionBox.startY, selectionBox.endY);
                const w = Math.abs(selectionBox.endX - selectionBox.startX);
                const h = Math.abs(selectionBox.endY - selectionBox.startY);

                ctx.fillRect(x, y, w, h);
                ctx.strokeRect(x, y, w, h);
                ctx.restore();
            }

            ctx.restore();

            if (showRulerCheck.checked && !isPrintPreview) drawRulers(rect);
        }

        function dist2(v, w) { return (v.x - w.x)**2 + (v.y - w.y)**2; }
        function distToSegmentSquared(p, v, w) {
            let l2 = dist2(v, w); if (l2 === 0) return dist2(p, v);
            let t = Math.max(0, Math.min(1, ((p.x - v.x) * (w.x - v.x) + (p.y - v.y) * (w.y - v.y)) / l2));
            return dist2(p, { x: v.x + t * (w.x - v.x), y: v.y + t * (w.y - v.y) });
        }
        function distToSegment(p, v, w) { return Math.sqrt(distToSegmentSquared(p, v, w)); }

        function getHitTarget(x, y, ignoreShapeIndex = -1) {
            const p = {x, y};
            for (let sIdx = shapes.length - 1; sIdx >= 0; sIdx--) {
                if (sIdx === ignoreShapeIndex) continue;
                const shape = shapes[sIdx];
                for (let vIdx = 0; vIdx < shape.length; vIdx++) {
                    if (Math.sqrt(dist2(p, shape[vIdx])) <= pointRadius + 6) return { type: 'vertex', shapeIndex: sIdx, vertexIndex: vIdx };
                }
            }
            for (let sIdx = shapes.length - 1; sIdx >= 0; sIdx--) {
                if (sIdx === ignoreShapeIndex) continue;
                const shape = shapes[sIdx], shapeType = shape.type || 'polygon';
                if (shapeType === 'circle') {
                    const C = shape[0], P1 = shape[1], R = Math.sqrt(dist2(C, P1)), d = Math.sqrt(dist2(p, C));
                    if (Math.abs(d - R) <= 8) return { type: 'circle_edge', shapeIndex: sIdx };
                }
                let edges = [];
                if (shapeType === 'polygon') { for (let i = 0; i < shape.length; i++) edges.push([i, (i+1)%shape.length]); }
                else if (shapeType === 'line') edges.push([0, 1]);
                for (let i = 0; i < edges.length; i++) {
                    if (distToSegment(p, shape[edges[i][0]], shape[edges[i][1]]) <= 8) return { type: 'edge', shapeIndex: sIdx, v1: edges[i][0], v2: edges[i][1] };
                }
            }
            for (let sIdx = shapes.length - 1; sIdx >= 0; sIdx--) {
                if (sIdx === ignoreShapeIndex) continue;
                const shape = shapes[sIdx], shapeType = shape.type || 'polygon';
                if (shapeType === 'polygon') {
                    ctx.beginPath(); ctx.moveTo(shape[0].x, shape[0].y);
                    for (let i = 1; i < shape.length; i++) ctx.lineTo(shape[i].x, shape[i].y);
                    ctx.closePath(); if (ctx.isPointInPath(x, y)) return { type: 'shape', shapeIndex: sIdx };
                } else if (shapeType === 'circle') {
                    const r = Math.sqrt(dist2(shape[0], shape[1]));
                    if (Math.sqrt(dist2(p, shape[0])) <= r) return { type: 'shape', shapeIndex: sIdx };
                }
            }
            return null;
        }

        function getPointerPos(e) {
            const rect = canvas.getBoundingClientRect();
            let clientX = e.touches ? e.touches[0].clientX : e.clientX;
            let clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return { x: clientX - rect.left, y: clientY - rect.top };
        }
        function getLogicalPos(pos) { return { x: (pos.x - originX) / globalScale, y: (pos.y - originY) / globalScale }; }

        function bringShapeToFront(index) {
            if (index >= 0 && index < shapes.length - 1) {
                const shapeToMove = shapes.splice(index, 1)[0];
                shapes.push(shapeToMove);
                if(lockedShapeIndex === index) lockedShapeIndex = shapes.length - 1;
                return shapes.length - 1;
            }
            return index;
        }

        function handlePointerDown(e) {
            if (e.button !== 0) return;
            const physicalPos = getPointerPos(e); 
            const pos = getLogicalPos(physicalPos);

            const target = getHitTarget(pos.x, pos.y);
            
            if (target) {
                if (target.type === 'shape') {
                    bringShapeToFront(target.shapeIndex);
                    target.shapeIndex = shapes.length - 1; 
                }
                const shape = shapes[target.shapeIndex];
                dragState = { ...target, startX: pos.x, startY: pos.y, moved: false };
                
                if (target.type === 'vertex') dragState.origV = { ...shape[target.vertexIndex] };
                else if (target.type === 'edge') { dragState.origV1 = { ...shape[target.v1] }; dragState.origV2 = { ...shape[target.v2] }; } 
                else if (target.type === 'shape') dragState.origShape = shape.map(p => ({...p}));
            } else {
                dragState = { type: 'selection', startX: pos.x, startY: pos.y, moved: false };
            }
        }

        function handlePointerMove(e) {
            const physicalPos = getPointerPos(e); 
            const pos = getLogicalPos(physicalPos); 

            const target = getHitTarget(pos.x, pos.y, dragState && dragState.shapeIndex !== undefined ? dragState.shapeIndex : -1);
            hoverState = target;

            if (lockedShapeIndex === null) {
                let activeShapeIndex = target ? target.shapeIndex : null;
                updatePanels(activeShapeIndex);
            } else {
                updatePanels(lockedShapeIndex, true);
            }

            if (dragState) {
                const dx = pos.x - dragState.startX, dy = pos.y - dragState.startY;
                if (Math.sqrt(dx*dx + dy*dy) > 5) {
                    dragState.moved = true;
                    if (mode === 'draw' && dragState.type === 'selection') {
                        setMode('select');
                    }
                }

                if (dragState.moved) {
                    if (dragState.type === 'selection') {
                        selectionBox = {
                            startX: dragState.startX,
                            startY: dragState.startY,
                            endX: pos.x,
                            endY: pos.y
                        };
                    } else {
                        const shape = shapes[dragState.shapeIndex];
                        if (dragState.type === 'vertex') {
                            let p = shape[dragState.vertexIndex];
                            if (p.attachedTo) {
                                let att = p.attachedTo, targetShape = shapes.find(s => s.id === att.shapeId);
                                if (targetShape && att.type === 'edge') {
                                    let p1 = targetShape[att.v1], p2 = targetShape[att.v2], l2 = dist2(p1, p2);
                                    if (l2 > 0) p.attachedTo.t = Math.max(0, Math.min(1, ((pos.x - p1.x) * (p2.x - p1.x) + (pos.y - p1.y) * (p2.y - p1.y)) / l2));
                                }
                            } else { p.x = dragState.origV.x + dx; p.y = dragState.origV.y + dy; }
                        } else if (dragState.type === 'edge') {
                            shape[dragState.v1].x = dragState.origV1.x + dx; shape[dragState.v1].y = dragState.origV1.y + dy;
                            shape[dragState.v2].x = dragState.origV2.x + dx; shape[dragState.v2].y = dragState.origV2.y + dy;
                        } else if (dragState.type === 'shape') {
                            for (let i = 0; i < shape.length; i++) { 
                                shape[i].x = dragState.origShape[i].x + dx; shape[i].y = dragState.origShape[i].y + dy; 
                            }
                        }
                        applyConstraints();
                    }
                }
                draw();
            } else {
                if (!target) canvas.style.cursor = (mode === 'draw' ? 'crosshair' : 'default');
                else canvas.style.cursor = 'move';
                draw();
            }
        }

        function handlePointerUp(e) {
            if (e.button !== 0) return;
            if (dragState) {
                let wasMoved = dragState.moved;
                const pos = getLogicalPos(getPointerPos(e));

                if (wasMoved) {
                    if (dragState.type === 'selection' && selectionBox) {
                        openPrintPreview();
                    } else if (dragState.type !== 'selection') {
                        saveHistory();
                        setMode('draw');
                    }
                } else {
                    if (mode === 'draw') {
                        let closed = false;
                        if (drawType === 'polygon' && currentShape.length > 2) {
                            const startPoint = currentShape[0];
                            if (Math.sqrt(dist2(pos, startPoint)) <= closeThreshold) {
                                const newShape = [...currentShape]; newShape.type = 'polygon'; newShape.id = generateId();
                                shapes.push(newShape); currentShape = []; applyConstraints(); saveHistory(); closed = true;
                            }
                        }
                        
                        if (!closed) {
                            let labelStr = getAlphabetLabel(globalVertexCount++);
                            if (drawType === 'circle' && currentShape.length === 0) {
                                labelStr = 'O';
                            }

                            currentShape.push({ 
                                x: pos.x, y: pos.y, 
                                showAngle: defaultAngleCheck.checked, 
                                showLength: defaultLengthCheck.checked, 
                                label: labelStr 
                            });
                            
                            if (drawType === 'line' && currentShape.length === 2) { 
                                const newShape = [...currentShape]; newShape.type = 'line'; newShape.id = generateId(); 
                                shapes.push(newShape); currentShape = []; 
                            } else if (drawType === 'circle' && currentShape.length === 2) { 
                                const newShape = [...currentShape]; newShape.type = 'circle'; newShape.id = generateId(); 
                                shapes.push(newShape); currentShape = []; 
                            }
                            applyConstraints(); saveHistory();
                        }
                    } else if (mode === 'select') {
                        setMode('draw');
                    }
                }
                dragState = null; draw();
            }
        }

        function openPrintPreview() {
            if (!selectionBox) return;

            draw(true);

            const minX = Math.min(selectionBox.startX, selectionBox.endX);
            const minY = Math.min(selectionBox.startY, selectionBox.endY);
            const w = Math.abs(selectionBox.endX - selectionBox.startX);
            const h = Math.abs(selectionBox.endY - selectionBox.startY);

            if (w < 10 || h < 10) {
                draw(false);
                return;
            }

            const screenMinX = (minX * globalScale) + originX;
            const screenMinY = (minY * globalScale) + originY;
            const screenW = w * globalScale;
            const screenH = h * globalScale;

            const dpr = window.devicePixelRatio || 1;

            const cropCanvas = document.createElement('canvas');
            cropCanvas.width = screenW * dpr;
            cropCanvas.height = screenH * dpr;
            const cropCtx = cropCanvas.getContext('2d');

            cropCtx.drawImage(
                canvas,
                screenMinX * dpr, screenMinY * dpr, screenW * dpr, screenH * dpr,
                0, 0, screenW * dpr, screenH * dpr
            );

            printPreviewImg.src = cropCanvas.toDataURL('image/png');
            printModal.classList.remove('hidden');

            draw(false);
        }

        function closePrintPreviewModal() {
            printModal.classList.add('hidden');
            selectionBox = null;
            setMode('draw');
            draw(false);
        }

        function downloadPNG() {
            const imageDataUrl = printPreviewImg.src;
            if (!imageDataUrl) return alert("다운로드할 이미지가 없습니다.");

            const link = document.createElement('a');
            link.href = imageDataUrl;
            link.download = `geometry_selection_${Date.now()}.png`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function downloadPDF() {
            const imageDataUrl = printPreviewImg.src;
            if (!imageDataUrl) return alert("다운로드할 이미지가 없습니다.");

            const { jsPDF } = window.jspdf;
            const img = new Image();
            img.src = imageDataUrl;
            img.onload = () => {
                const imgWidth = img.width;
                const imgHeight = img.height;
                const orientation = imgWidth > imgHeight ? 'landscape' : 'portrait';
                
                const pdf = new jsPDF({
                    orientation: orientation,
                    unit: 'px',
                    format: [imgWidth, imgHeight]
                });

                pdf.addImage(imageDataUrl, 'PNG', 0, 0, imgWidth, imgHeight);
                pdf.save(`geometry_selection_${Date.now()}.pdf`);
            };
        }

        // 우측 마우스 클릭 처리 (도형 선택 / 선택 해제 토글)
        function handleContextMenu(e) {
            e.preventDefault();
            const pos = getLogicalPos(getPointerPos(e));
            const target = getHitTarget(pos.x, pos.y);

            if (lockedShapeIndex !== null) {
                lockedShapeIndex = null;
                setMode('draw');
                updatePanels(null);
            } else if (target) {
                lockedShapeIndex = target.shapeIndex;
                setMode('select');
                updatePanels(lockedShapeIndex);
            } else {
                lockedShapeIndex = null;
                setMode('draw');
                updatePanels(null);
            }
            draw();
        }

        // 우측 속성 패널 갱신
        function updatePanels(sIdx, isSyncOnly = false) {
            if (sIdx === null || sIdx < 0 || sIdx >= shapes.length) {
                bgMenuContent.classList.remove('hidden');
                objectMenuContent.classList.add('hidden');
                sidebarTitle.innerText = "그리기 & 이동 메뉴";
                sidebarLockIndicator.classList.add('hidden');
                activePanelShapeIndex = null;
                return;
            }

            const shape = shapes[sIdx];
            bgMenuContent.classList.add('hidden');
            objectMenuContent.classList.remove('hidden');
            
            if (lockedShapeIndex === sIdx) {
                sidebarTitle.innerText = "도형 속성 고정 편집";
                sidebarLockIndicator.classList.remove('hidden');
            } else {
                sidebarTitle.innerText = "도형 속성 실시간 호버";
                sidebarLockIndicator.classList.add('hidden');
            }

            const isPolygon = (shape.type === 'polygon' || !shape.type);
            const isCircle = (shape.type === 'circle');
            const isLine = (shape.type === 'line');

            if (isSyncOnly && activePanelShapeIndex === sIdx) {
                if (isPolygon && shape.length >= 3) {
                    const isCW = getPolygonArea(shape) > 0;
                    shape.forEach((v, idx) => {
                        const input = multiEditForm.querySelector(`.angle-input[data-vidx="${idx}"]`);
                        if (input && document.activeElement !== input && !v.customAngle) {
                            const pPrev = shape[(idx - 1 + shape.length) % shape.length];
                            const pNext = shape[(idx + 1) % shape.length];
                            let a1 = Math.atan2(pPrev.y - v.y, pPrev.x - v.x);
                            let a2 = Math.atan2(pNext.y - v.y, pNext.x - v.x);
                            let angleCCW = a2 - a1; while (angleCCW < 0) angleCCW += 2 * Math.PI;
                            let interiorAngle = isCW ? (2 * Math.PI - angleCCW) : angleCCW;
                            if (interiorAngle >= 2 * Math.PI) interiorAngle -= 2 * Math.PI;
                            input.value = (interiorAngle * 180 / Math.PI).toFixed(1) + '°';
                        }
                    });
                }
                let edges = [];
                if (isPolygon) { for (let i = 0; i < shape.length; i++) edges.push([i, (i+1)%shape.length]); }
                else if (isLine || isCircle) edges.push([0, 1]);

                edges.forEach(([v1, v2]) => {
                    const input = multiEditForm.querySelector(`.length-input[data-vidx="${v1}"]`);
                    if (input && document.activeElement !== input && !shape[v1].customLength) {
                        const p1 = shape[v1], p2 = shape[v2];
                        const currLenPx = Math.sqrt(dist2(p1, p2));
                        input.value = (currLenPx / 50).toFixed(1) + ' cm';
                    }
                });
                return;
            }

            activePanelShapeIndex = sIdx;
            multiEditForm.innerHTML = '';

            // 내각 크기 및 변수/Visible 편집
            if (isPolygon && shape.length >= 3) {
                const angleHeader = document.createElement('div');
                angleHeader.className = "text-xs font-bold text-amber-600 border-b pb-1 mt-1 flex justify-between items-center";
                angleHeader.innerHTML = "<span>📐 내각 (Visible / 수치·변수)</span>";
                multiEditForm.appendChild(angleHeader);

                const isCW = getPolygonArea(shape) > 0;
                shape.forEach((v, idx) => {
                    const pPrev = shape[(idx - 1 + shape.length) % shape.length];
                    const pNext = shape[(idx + 1) % shape.length];
                    
                    let a1 = Math.atan2(pPrev.y - v.y, pPrev.x - v.x);
                    let a2 = Math.atan2(pNext.y - v.y, pNext.x - v.x);
                    let angleCCW = a2 - a1; while (angleCCW < 0) angleCCW += 2 * Math.PI;
                    let interiorAngle = isCW ? (2 * Math.PI - angleCCW) : angleCCW;
                    if (interiorAngle >= 2 * Math.PI) interiorAngle -= 2 * Math.PI;
                    let currentDeg = (interiorAngle * 180 / Math.PI).toFixed(1) + '°';
                    const displayVal = v.customAngle !== undefined ? v.customAngle : currentDeg;

                    const row = document.createElement('div');
                    row.className = "flex items-center justify-between text-xs gap-1";
                    row.innerHTML = `
                        <div class="flex items-center space-x-1.5">
                            <input type="checkbox" onchange="toggleAngleVisible(${sIdx}, ${idx}, this.checked)" ${v.showAngle !== false ? 'checked' : ''} 
                                class="form-checkbox h-3.5 w-3.5 text-amber-600 rounded cursor-pointer" title="표시 여부">
                            <label class="font-medium text-gray-700">각 ${v.label}</label>
                        </div>
                        <div class="flex items-center space-x-1 flex-1 justify-end">
                            <input type="text" data-vidx="${idx}" value="${displayVal}" placeholder="예: 60° 또는 x" 
                                class="angle-input w-24 px-2 py-1 border rounded bg-white text-right focus:ring-1 focus:ring-amber-500 font-mono text-xs">
                            <button onclick="applySingleAngle(${sIdx}, ${idx})" class="px-2 py-1 bg-amber-500 hover:bg-amber-600 text-white rounded text-[11px] font-bold transition">적용</button>
                        </div>
                    `;
                    multiEditForm.appendChild(row);
                });
            }

            // 변/반지름 길이 및 변수/Visible 편집
            const edgeHeader = document.createElement('div');
            edgeHeader.className = "text-xs font-bold text-indigo-600 border-b pb-1 mt-2 flex justify-between items-center";
            edgeHeader.innerHTML = isCircle ? "<span>📏 반지름 (Visible / 수치·변수)</span>" : "<span>📏 변의 길이 (Visible / 수치·변수)</span>";
            multiEditForm.appendChild(edgeHeader);

            let edges = [];
            if (isPolygon) { for (let i = 0; i < shape.length; i++) edges.push([i, (i+1)%shape.length]); }
            else if (isLine || isCircle) edges.push([0, 1]);

            edges.forEach(([v1, v2]) => {
                const p1 = shape[v1], p2 = shape[v2];
                const currLenPx = Math.sqrt(dist2(p1, p2));
                const currLenCm = (currLenPx / 50).toFixed(1) + ' cm';
                const labelText = isCircle ? `반지름 ${p1.label}${p2.label}` : `변 ${p1.label}${p2.label}`;
                const displayVal = p1.customLength !== undefined ? p1.customLength : currLenCm;

                const row = document.createElement('div');
                row.className = "flex items-center justify-between text-xs gap-1";
                row.innerHTML = `
                    <div class="flex items-center space-x-1.5 min-w-[70px]">
                        <input type="checkbox" onchange="toggleLengthVisible(${sIdx}, ${v1}, this.checked)" ${p1.showLength !== false ? 'checked' : ''} 
                            class="form-checkbox h-3.5 w-3.5 text-indigo-600 rounded cursor-pointer" title="표시 여부">
                        <label class="font-medium text-gray-700 truncate">${labelText}</label>
                    </div>
                    <div class="flex items-center space-x-1 flex-1 justify-end">
                        <input type="text" data-vidx="${v1}" value="${displayVal}" placeholder="예: 3cm 또는 r" 
                            class="length-input w-24 px-2 py-1 border rounded bg-white text-right focus:ring-1 focus:ring-indigo-500 font-mono text-xs">
                        <button onclick="applySingleLength(${sIdx}, ${v1})" class="px-2 py-1 bg-indigo-500 hover:bg-indigo-600 text-white rounded text-[11px] font-bold transition">적용</button>
                    </div>
                `;
                multiEditForm.appendChild(row);
            });

            dynamicExtraActions.innerHTML = `
                <button onclick="deleteShape(${sIdx})" class="w-full text-left px-3 py-2 rounded-lg bg-red-50 hover:bg-red-100 text-red-600 text-xs font-bold flex items-center shadow-sm">
                    <span class="mr-2">🗑️</span> 현재 도형 삭제
                </button>
            `;
        }

        function toggleAngleVisible(sIdx, vIdx, isChecked) {
            if (shapes[sIdx] && shapes[sIdx][vIdx]) {
                shapes[sIdx][vIdx].showAngle = isChecked;
                draw();
            }
        }

        function toggleLengthVisible(sIdx, vIdx, isChecked) {
            if (shapes[sIdx] && shapes[sIdx][vIdx]) {
                shapes[sIdx][vIdx].showLength = isChecked;
                draw();
            }
        }

        function applySingleAngle(sIdx, vIdx) {
            const shape = shapes[sIdx];
            if (!shape || shape.length < 3) return;
            const input = multiEditForm.querySelector(`.angle-input[data-vidx="${vIdx}"]`);
            if (!input) return;

            const valStr = input.value.trim();
            const numVal = parseFloat(valStr);

            if (!isNaN(numVal) && !/[a-zA-Z가-힣]/.test(valStr)) {
                shape[vIdx].customAngle = undefined;
                const p = shape[vIdx];
                const pPrev = shape[(vIdx - 1 + shape.length) % shape.length];
                const nextIdx = (vIdx + 1) % shape.length;
                const pNext = shape[nextIdx]; 

                let a1 = Math.atan2(pPrev.y - p.y, pPrev.x - p.x);
                let a2 = Math.atan2(pNext.y - p.y, pNext.x - p.x);
                let isCW = getPolygonArea(shape) > 0;
                let angleCCW = a2 - a1; while (angleCCW < 0) angleCCW += 2 * Math.PI;
                let interiorAngle = isCW ? (2 * Math.PI - angleCCW) : angleCCW;
                if (interiorAngle >= 2 * Math.PI) interiorAngle -= 2 * Math.PI;

                let currentDeg = interiorAngle * 180 / Math.PI;
                let diffRad = (numVal - currentDeg) * Math.PI / 180;
                let rotRad = isCW ? -diffRad : diffRad;

                let nx = p.x + (pNext.x - p.x) * Math.cos(rotRad) - (pNext.y - p.y) * Math.sin(rotRad);
                let ny = p.y + (pNext.x - p.x) * Math.sin(rotRad) + (pNext.y - p.y) * Math.cos(rotRad);

                pNext.x = nx; pNext.y = ny;
            } else {
                shape[vIdx].customAngle = valStr;
            }

            applyConstraints(); saveHistory(); draw();
            updatePanels(sIdx);
        }

        function applySingleLength(sIdx, vIdx) {
            const shape = shapes[sIdx];
            if (!shape) return;
            const input = multiEditForm.querySelector(`.length-input[data-vidx="${vIdx}"]`);
            if (!input) return;

            const valStr = input.value.trim();
            const numVal = parseFloat(valStr);

            if (!isNaN(numVal) && !/[a-zA-Z가-힣]/.test(valStr)) {
                shape[vIdx].customLength = undefined;
                const p1 = shape[vIdx];
                let nextIdx = (vIdx + 1) % shape.length;
                if (shape.type === 'line' || shape.type === 'circle') nextIdx = 1;
                const p2 = shape[nextIdx];

                const targetPx = numVal * 50;
                const currPx = Math.sqrt(dist2(p1, p2));
                if (currPx > 0) {
                    const ratio = targetPx / currPx;
                    p2.x = p1.x + (p2.x - p1.x) * ratio;
                    p2.y = p1.y + (p2.y - p1.y) * ratio;
                }
            } else {
                shape[vIdx].customLength = valStr;
            }

            applyConstraints(); saveHistory(); draw();
            updatePanels(sIdx);
        }

        function deleteShape(index) {
            shapes.splice(index, 1);
            lockedShapeIndex = null;
            applyConstraints(); saveHistory(); draw();
            updatePanels(null);
        }

        function updateInstructions() {
            if (mode === 'draw') {
                instructionBanner.innerHTML = '💡 <strong>그리기 모드:</strong> 도형 위에서 마우스 우클릭 시 도형 선택 및 편집 메뉴가 활성화됩니다.';
                instructionBanner.className = 'bg-indigo-50 border-b border-indigo-100 px-4 py-2 text-sm text-indigo-700 font-medium flex items-center justify-center transition-colors z-10 shrink-0';
            } else {
                instructionBanner.innerHTML = '💡 <strong>선택/이동 모드:</strong> 마우스 우클릭 시 도형 선택 해제 및 그리기 모드로 복귀합니다.';
                instructionBanner.className = 'bg-green-50 border-b border-green-100 px-4 py-2 text-sm text-green-700 font-medium flex items-center justify-center transition-colors z-10 shrink-0';
            }
        }

        function setMode(newMode) {
            if (mode === newMode) return;
            mode = newMode;
            if (mode === 'draw') {
                modeDrawBtn.classList.add('active'); modeSelectBtn.classList.remove('active');
                quickModeDraw.className = "py-2.5 px-3 rounded-lg border text-xs font-bold flex items-center justify-center gap-1 bg-indigo-50 border-indigo-200 text-indigo-700";
                quickModeSelect.className = "py-2.5 px-3 rounded-lg border text-xs font-bold flex items-center justify-center gap-1 bg-gray-50 border-gray-200 text-gray-600";
            } else {
                modeSelectBtn.classList.add('active'); modeDrawBtn.classList.remove('active');
                quickModeSelect.className = "py-2.5 px-3 rounded-lg border text-xs font-bold flex items-center justify-center gap-1 bg-indigo-50 border-indigo-200 text-indigo-700";
                quickModeDraw.className = "py-2.5 px-3 rounded-lg border text-xs font-bold flex items-center justify-center gap-1 bg-gray-50 border-gray-200 text-gray-600";
                if (currentShape.length > 0) currentShape = [];
            }
            updateInstructions();
            draw();
        }

        function setDrawType(type) {
            drawType = type;
            let icon = '🔷', text = '다각형';
            if (type === 'line') { icon = '➖'; text = '선분'; }
            if (type === 'circle') { icon = '⭕'; text = '원'; }
            modeDrawBtn.innerHTML = `✏️ ${icon} ${text} 그리기`;
            setMode('draw');
        }

        function setupEvents() {
            modeDrawBtn.addEventListener('click', () => setMode('draw'));
            modeSelectBtn.addEventListener('click', () => setMode('select'));
            quickModeDraw.addEventListener('click', () => setMode('draw'));
            quickModeSelect.addEventListener('click', () => setMode('select'));
            
            drawPolygonBtn.addEventListener('click', () => setDrawType('polygon'));
            drawLineBtn.addEventListener('click', () => setDrawType('line'));
            drawCircleBtn.addEventListener('click', () => setDrawType('circle'));

            drawRegularPolygonBtn.addEventListener('click', () => {
                const sidesInput = prompt("몇 각형을 그리시겠습니까? (3 이상의 숫자):", "5");
                if (!sidesInput) return;
                const numSides = parseInt(sidesInput.trim());
                if (isNaN(numSides) || numSides < 3) return alert("3 이상의 올바른 숫자를 입력해주세요.");
                const lenInput = prompt("변의 길이를 입력하세요 (cm):", "3");
                if (!lenInput) return;
                const sideLenCm = Number(lenInput.trim());
                if (isNaN(sideLenCm) || sideLenCm <= 0) return alert("올바른 변의 길이를 입력해주세요.");
                
                const sideLenPx = sideLenCm * 50, R = sideLenPx / (2 * Math.sin(Math.PI / numSides));
                const cx = originX, cy = originY;
                
                const newShape = []; newShape.type = 'polygon'; newShape.id = generateId();
                for (let i = 0; i < numSides; i++) {
                    const angle = (2 * Math.PI * i / numSides) - Math.PI / 2;
                    newShape.push({ x: cx + R * Math.cos(angle), y: cy + R * Math.sin(angle), showAngle: defaultAngleCheck.checked, showLength: defaultLengthCheck.checked, label: getAlphabetLabel(globalVertexCount++) });
                }
                shapes.push(newShape); saveHistory(); draw();
            });

            undoBtn.addEventListener('click', undo);
            clearBtn.addEventListener('click', () => { shapes = []; currentShape = []; globalVertexCount = 0; lockedShapeIndex = null; selectionBox = null; saveHistory(); draw(); updatePanels(null); });
            showGridCheck.addEventListener('change', draw);
            showRulerCheck.addEventListener('change', draw);
            
            canvas.addEventListener('mousedown', handlePointerDown);
            canvas.addEventListener('mousemove', handlePointerMove);
            canvas.addEventListener('contextmenu', handleContextMenu);
            window.addEventListener('mouseup', handlePointerUp);

            canvas.addEventListener('mouseleave', () => { 
                if (lockedShapeIndex === null) {
                    hoverState = null; 
                    updatePanels(null); 
                }
                draw(); 
            });

            closePrintModal.addEventListener('click', closePrintPreviewModal);
            cancelPrintBtn.addEventListener('click', closePrintPreviewModal);
            downloadPngBtn.addEventListener('click', downloadPNG);
            downloadPdfBtn.addEventListener('click', downloadPDF);
            execPrintBtn.addEventListener('click', () => {
                window.print();
            });
        }

        window.onload = init;
    </script>
</body>
</html>
