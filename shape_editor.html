<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shape Editor Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        body, html { height: 100%; margin: 0; overflow: hidden; }
        #canvas-container { touch-action: none; cursor: crosshair; }
        
        /* 좌측 툴바 버튼 스타일 */
        .tool-btn { transition: all 0.2s ease; }
        .tool-btn.active { background-color: #4f46e5; color: white; border-color: #4f46e5; }
        .tool-btn:not(.active):hover { background-color: #e0e7ff; }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #a8a8a8; }

        @media print {
            body * { visibility: hidden; }
            #print-modal-content, #print-modal-content * { visibility: visible; }
            #print-modal-content { position: absolute; left: 0; top: 0; width: 100%; }
            .no-print { display: none !important; }
        }

        /* 토스트 알림 애니메이션 스타일 */
        .toast-message {
            background: rgba(31, 41, 55, 0.9);
            color: white;
            padding: 8px 20px;
            border-radius: 99px;
            font-size: 14px;
            font-weight: 600;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            transition: opacity 0.3s ease, transform 0.3s ease;
            opacity: 0;
            transform: translateY(15px);
        }
        .toast-message.show {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body class="flex h-screen bg-gray-50 text-gray-800 font-sans select-none overflow-hidden">

    <!-- 1. 좌측: 좁고 긴 그리기 도구 툴바 -->
    <aside class="w-20 bg-white border-r border-gray-200 flex flex-col items-center py-4 shadow-md z-20 shrink-0 gap-3">
        <div class="text-[10px] font-bold text-gray-400 mb-1">모드</div>
        <button id="mode-draw" class="tool-btn active w-14 h-14 rounded-xl flex flex-col items-center justify-center border border-gray-200 text-gray-600 shadow-sm" title="그리기 모드 (P)">
            <span class="text-xl">✏️</span>
            <span class="text-[10px] mt-1 font-medium">그리기</span>
        </button>
        <button id="mode-select" class="tool-btn w-14 h-14 rounded-xl flex flex-col items-center justify-center border border-gray-200 text-gray-600 shadow-sm" title="선택/이동 모드 (V)">
            <span class="text-xl">🖐</span>
            <span class="text-[10px] mt-1 font-medium">선택</span>
        </button>

        <div class="w-10 border-t border-gray-200 my-1"></div>
        <div class="text-[10px] font-bold text-gray-400 mb-1">도형</div>

        <button id="draw-polygon-btn" class="tool-btn active w-14 h-14 rounded-xl flex flex-col items-center justify-center border border-gray-200 text-gray-600 shadow-sm" title="다각형">
            <span class="text-xl">🔷</span>
            <span class="text-[10px] mt-1 font-medium">다각형</span>
        </button>
        <button id="draw-line-btn" class="tool-btn w-14 h-14 rounded-xl flex flex-col items-center justify-center border border-gray-200 text-gray-600 shadow-sm" title="선분">
            <span class="text-xl">➖</span>
            <span class="text-[10px] mt-1 font-medium">선분</span>
        </button>
        <button id="draw-circle-btn" class="tool-btn w-14 h-14 rounded-xl flex flex-col items-center justify-center border border-gray-200 text-gray-600 shadow-sm" title="원">
            <span class="text-xl">⭕</span>
            <span class="text-[10px] mt-1 font-medium">원</span>
        </button>
        <button id="draw-regular-polygon-btn" class="tool-btn w-14 h-14 rounded-xl flex flex-col items-center justify-center border border-indigo-100 bg-indigo-50 text-indigo-700 hover:bg-indigo-100 shadow-sm mt-2" title="정다각형">
            <span class="text-xl">🌟</span>
            <span class="text-[9px] mt-1 font-bold">정다각형</span>
        </button>
    </aside>

    <!-- 2. 중앙: 작업 영역 (Canvas & Header) -->
    <div class="flex-1 flex flex-col relative overflow-hidden">
        <header class="bg-white shadow-sm p-4 flex flex-wrap justify-between items-center z-10 shrink-0 gap-4">
            <div class="flex items-center space-x-4">
                <h1 class="text-xl font-bold text-indigo-600 mr-4">Shape Editor Pro</h1>
            </div>
            
            <div class="flex space-x-3 ml-auto flex-wrap">
                <button id="print-selected-btn" class="bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2 px-4 rounded-lg shadow transition duration-200 flex items-center gap-1.5" title="선택한 도형 인쇄하기">
                    🖨️ 선택 도형 인쇄
                </button>
                <button id="group-btn" class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 px-4 rounded-lg shadow transition duration-200" title="그룹 묶기 (Ctrl+G)">
                    📦 그룹 묶기
                </button>
                <button id="ungroup-btn" class="bg-amber-500 hover:bg-amber-600 text-white font-semibold py-2 px-4 rounded-lg shadow transition duration-200" title="그룹 해제 (Ctrl+Shift+G)">
                    🔓 그룹 해제
                </button>
                <button id="undo-btn" class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-semibold py-2 px-4 rounded-lg shadow transition duration-200" title="되돌리기 (Ctrl+Z)">
                    ↩️ 되돌리기
                </button>
                <button id="clear-btn" class="bg-red-500 hover:bg-red-600 text-white font-semibold py-2 px-4 rounded-lg shadow transition duration-200">
                    🗑️ 전체 지우기
                </button>
            </div>
        </header>

        <div id="instruction-banner" class="bg-indigo-50 border-b border-indigo-100 px-4 py-2 text-sm text-indigo-700 font-medium flex items-center justify-center transition-colors z-10 shrink-0">
            💡 <strong>그리기 모드:</strong> 좌측 툴바에서 도형을 선택하고 캔버스에 그려주세요. (Ctrl+휠: 확대/축소, Space+드래그: 화면이동)
        </div>

        <main class="flex-1 relative bg-gray-100 overflow-hidden" id="canvas-container">
            <canvas id="drawing-canvas" class="absolute top-0 left-0"></canvas>
        </main>
    </div>

    <!-- 3. 우측: 고정형 속성 전용 패널 -->
    <aside class="w-80 bg-white border-l border-gray-200 flex flex-col shadow-xl z-20 flex-shrink-0">
        <div class="px-5 py-4 border-b border-gray-200 bg-gray-50 flex justify-between items-center">
            <h2 id="sidebar-title" class="text-lg font-bold text-gray-800 tracking-wide">캔버스 속성</h2>
            <span id="sidebar-lock-indicator" class="hidden text-xs bg-indigo-600 text-white font-semibold px-2 py-0.5 rounded-full">도형 선택됨</span>
        </div>

        <div id="sidebar-content" class="flex-1 overflow-y-auto p-4 flex flex-col gap-2">
            
            <!-- 아무것도 선택되지 않았을 때 (캔버스 전체 속성) -->
            <div id="canvas-props-content" class="flex flex-col gap-2">
                <div class="text-xs text-gray-500 font-bold uppercase tracking-wider mb-2">화면 표시 설정</div>
                <div class="space-y-3 bg-gray-50 p-4 rounded-lg border border-gray-200">
                    <label class="flex items-center space-x-2 text-sm text-gray-700 font-medium cursor-pointer">
                        <input type="checkbox" id="show-grid-check" class="form-checkbox h-4 w-4 text-indigo-600 rounded">
                        <span>좌표평면 (Grid) 표시</span>
                    </label>
                    <label class="flex items-center space-x-2 text-sm text-gray-700 font-medium cursor-pointer">
                        <input type="checkbox" id="show-ruler-check" checked class="form-checkbox h-4 w-4 text-indigo-600 rounded">
                        <span>자 (Ruler) 표시</span>
                    </label>
                </div>

                <div class="text-xs text-gray-500 font-bold uppercase tracking-wider mt-2 mb-2">기본 도형 설정</div>
                <div class="space-y-3 bg-gray-50 p-4 rounded-lg border border-gray-200">
                    <label class="flex items-center space-x-2 text-sm text-gray-700 font-medium cursor-pointer">
                        <input type="checkbox" id="default-angle-check" checked class="form-checkbox h-4 w-4 text-indigo-600 rounded">
                        <span>각도 기본 표시</span>
                    </label>
                    <label class="flex items-center space-x-2 text-sm text-gray-700 font-medium cursor-pointer">
                        <input type="checkbox" id="default-length-check" checked class="form-checkbox h-4 w-4 text-indigo-600 rounded">
                        <span>길이/반지름 기본 표시</span>
                    </label>
                </div>
            </div>

            <!-- 도형이 선택되었을 때 (객체 속성 편집) -->
            <div id="object-props-content" class="hidden flex flex-col gap-3">
                <div class="text-xs text-indigo-600 font-bold uppercase tracking-wider flex justify-between items-center">
                    <span>도형 수치 & 변수 편집</span>
                    <span class="text-[10px] text-gray-400 font-normal">표시여부 / 변수입력</span>
                </div>
                <div class="text-[10px] text-gray-500 text-center mb-1 bg-amber-50 p-2 rounded border border-amber-200">
                    💡 입력창 선택 후 <kbd class="px-1 bg-gray-200 rounded">↑</kbd> <kbd class="px-1 bg-gray-200 rounded">↓</kbd> 또는 마우스 휠을 굴리면 <strong>도형이 실시간으로 변형</strong>됩니다. (최소 1)
                </div>
                <div id="multi-edit-form" class="space-y-3 bg-gray-50 p-3 rounded-lg border border-gray-200 max-h-[460px] overflow-y-auto"></div>
            </div>
        </div>
    </aside>

    <!-- 토스트 알림 컨테이너 -->
    <div id="toast-container" class="fixed bottom-10 left-1/2 transform -translate-x-1/2 flex flex-col gap-2 z-[9999] pointer-events-none"></div>

    <!-- 인쇄/다운로드 미리보기 모달 -->
    <div id="print-modal" class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-2xl max-w-4xl w-full flex flex-col max-h-[90vh] overflow-hidden">
            <div class="px-6 py-4 border-b border-gray-200 flex justify-between items-center bg-gray-50 no-print">
                <h3 class="text-lg font-bold text-gray-800">🖼️ 영역 캡처 미리보기</h3>
                <button id="close-print-modal" class="text-gray-400 hover:text-red-500 text-xl font-bold p-1">✕</button>
            </div>
            
            <div id="print-modal-content" class="p-6 flex-1 overflow-auto flex flex-col items-center justify-center bg-gray-100">
                <div class="bg-white p-4 shadow-lg rounded border border-gray-300">
                    <img id="print-preview-img" class="max-w-full max-h-[60vh] object-contain" alt="인쇄 미리보기">
                </div>
            </div>

            <div class="px-6 py-4 border-t border-gray-200 flex justify-end gap-2 bg-gray-50 no-print flex-wrap">
                <button id="cancel-print-btn" class="px-3 py-2 bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold rounded-lg transition text-sm">닫기</button>
                <button id="download-svg-btn" class="px-4 py-2 bg-purple-600 hover:bg-purple-700 text-white font-bold rounded-lg shadow transition text-sm flex items-center gap-1.5" title="무한 해상도 고화질 벡터 SVG 저장"><span>📐</span> SVG 다운로드</button>
                <button id="download-png-btn" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-lg shadow transition text-sm flex items-center gap-1.5"><span>🖼️</span> PNG 다운로드</button>
                <button id="download-pdf-btn" class="px-4 py-2 bg-red-600 hover:bg-red-700 text-white font-bold rounded-lg shadow transition text-sm flex items-center gap-1.5"><span>📄</span> PDF 다운로드</button>
                <button id="exec-print-btn" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-lg shadow transition text-sm flex items-center gap-1.5"><span>🖨️</span> 인쇄하기</button>
            </div>
        </div>
    </div>

    <!-- 우클릭 팝업 컨텍스트 메뉴 -->
    <div id="context-menu" class="hidden absolute bg-white border border-gray-200 shadow-xl rounded-lg py-1 z-[100] min-w-[160px] text-sm font-medium"></div>

    <script>
        const canvasContainer = document.getElementById('canvas-container');
        const canvas = document.getElementById('drawing-canvas');
        const ctx = canvas.getContext('2d');
        const undoBtn = document.getElementById('undo-btn');
        const clearBtn = document.getElementById('clear-btn');
        const groupBtn = document.getElementById('group-btn');
        const ungroupBtn = document.getElementById('ungroup-btn');
        const printSelectedBtn = document.getElementById('print-selected-btn');
        const instructionBanner = document.getElementById('instruction-banner');

        // 좌측 도구 버튼
        const modeDrawBtn = document.getElementById('mode-draw');
        const modeSelectBtn = document.getElementById('mode-select');
        const drawPolygonBtn = document.getElementById('draw-polygon-btn');
        const drawLineBtn = document.getElementById('draw-line-btn');
        const drawCircleBtn = document.getElementById('draw-circle-btn');
        const drawRegularPolygonBtn = document.getElementById('draw-regular-polygon-btn');
        const drawBtns = [drawPolygonBtn, drawLineBtn, drawCircleBtn, drawRegularPolygonBtn];

        // 우측 패널 제어
        const sidebarTitle = document.getElementById('sidebar-title');
        const sidebarLockIndicator = document.getElementById('sidebar-lock-indicator');
        const canvasPropsContent = document.getElementById('canvas-props-content');
        const objectPropsContent = document.getElementById('object-props-content');
        const multiEditForm = document.getElementById('multi-edit-form');
        
        const contextMenu = document.getElementById('context-menu');

        // 체크박스
        const defaultAngleCheck = document.getElementById('default-angle-check');
        const defaultLengthCheck = document.getElementById('default-length-check');
        const showGridCheck = document.getElementById('show-grid-check');
        const showRulerCheck = document.getElementById('show-ruler-check');

        // 인쇄 모달
        const printModal = document.getElementById('print-modal');
        const printPreviewImg = document.getElementById('print-preview-img');
        const closePrintModal = document.getElementById('close-print-modal');
        const cancelPrintBtn = document.getElementById('cancel-print-btn');
        const execPrintBtn = document.getElementById('exec-print-btn');
        const downloadSvgBtn = document.getElementById('download-svg-btn');
        const downloadPngBtn = document.getElementById('download-png-btn');
        const downloadPdfBtn = document.getElementById('download-pdf-btn');

        let mode = 'draw'; 
        let drawType = 'polygon'; 
        let regularPolyParams = null; // 정다각형 생성 대기 파라미터 { sides, lengthCm }
        let shapes = []; 
        let currentShape = []; 
        
        // 메모리 최적화 히스토리 (Delta/Command Pattern) 변수
        let historyStack = []; 
        let lastHistoryState = { shapesMap: {}, currentShape: [], globalVertexCount: 0 };
        let globalVertexCount = 0; 
        
        // 뷰포트 상태 변수
        let globalScale = 1.0; 
        let originX = 0, originY = 0;
        let isSpaceDown = false;
        let isPanning = false;
        let panStartX = 0;
        let panStartY = 0;
        
        const pointRadius = 6;
        const closeThreshold = 15; 
        let hoverState = null; 
        let dragState = null;  
        let selectedShapeIndices = []; // 다중 선택 인덱스 배열
        let activePanelShapeIndex = null;
        let selectionBox = null;
        let lastMouseLogicalPos = { x: 0, y: 0 }; 

        // 단일 선택 호환성을 위한 게터/세터
        Object.defineProperty(window, 'lockedShapeIndex', {
            get() {
                return selectedShapeIndices.length === 1 ? selectedShapeIndices[0] : null;
            },
            set(val) {
                if (val === null || val === undefined) {
                    selectedShapeIndices = [];
                } else {
                    selectedShapeIndices = [val];
                }
            }
        });

        function init() {
            saveHistory(); 
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();
            setupEvents();
            updatePanels(null); 
            updateDrawToolUI();
        }

        function getShapeName(shape) {
            if (!shape || shape.length === 0) return "도형";
            const shapeType = shape.type || 'polygon';
            if (shapeType === 'circle') {
                const centerLabel = shape[0] && shape[0].label ? shape[0].label : 'O';
                return `원 ${centerLabel}`;
            } else if (shapeType === 'line') {
                const l1 = shape[0] && shape[0].label ? shape[0].label : '';
                const l2 = shape[1] && shape[1].label ? shape[1].label : '';
                return `선분 ${l1}${l2}`;
            } else if (shapeType === 'polygon') {
                const labels = shape.map(p => p.label || '').join('');
                return `다각형 ${labels}`;
            }
            return "도형";
        }

        function showToast(message) {
            const toast = document.createElement('div');
            toast.className = 'toast-message';
            toast.innerText = message;
            document.getElementById('toast-container').appendChild(toast);
            
            setTimeout(() => toast.classList.add('show'), 10);
            
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 300);
            }, 1500);
        }

        function generateId() { return 'shape_' + Date.now() + '_' + Math.random().toString(36).substring(2, 9); }
        function getAlphabetLabel(index) {
            let label = ''; let temp = index;
            do { label = String.fromCharCode(65 + (temp % 26)) + label; temp = Math.floor(temp / 26) - 1; } while (temp >= 0);
            return label;
        }

        // 깊은 복사 헬퍼 함수
        function cloneShape(s) {
            const arr = JSON.parse(JSON.stringify(s));
            arr.type = s.type;
            arr.id = s.id;
            arr.groupId = s.groupId;
            return arr;
        }

        // --- 메모리 최적화 Delta (Command Pattern) 기반 saveHistory ---
        function saveHistory() {
            const currentShapesMap = {};
            shapes.forEach(s => {
                if (!s.id) s.id = generateId();
                currentShapesMap[s.id] = cloneShape(s);
            });

            const deltaAdded = {};
            const deltaModified = {};
            const deltaRemoved = {};

            // 추가 및 수정 검출
            for (let id in currentShapesMap) {
                if (!lastHistoryState.shapesMap[id]) {
                    deltaAdded[id] = cloneShape(currentShapesMap[id]);
                } else if (JSON.stringify(currentShapesMap[id]) !== JSON.stringify(lastHistoryState.shapesMap[id])) {
                    deltaModified[id] = {
                        before: cloneShape(lastHistoryState.shapesMap[id]),
                        after: cloneShape(currentShapesMap[id])
                    };
                }
            }

            // 삭제 검출
            for (let id in lastHistoryState.shapesMap) {
                if (!currentShapesMap[id]) {
                    deltaRemoved[id] = cloneShape(lastHistoryState.shapesMap[id]);
                }
            }

            const currentOrder = shapes.map(s => s.id);
            const prevOrder = lastHistoryState.order || [];
            const orderChanged = JSON.stringify(currentOrder) !== JSON.stringify(prevOrder);

            // 변경사항이 있을 때만 command 등록
            if (Object.keys(deltaAdded).length > 0 || Object.keys(deltaModified).length > 0 || 
                Object.keys(deltaRemoved).length > 0 || orderChanged || 
                JSON.stringify(currentShape) !== JSON.stringify(lastHistoryState.currentShape) ||
                globalVertexCount !== lastHistoryState.globalVertexCount) {

                const command = {
                    deltaAdded,
                    deltaModified,
                    deltaRemoved,
                    prevOrder,
                    currentOrder,
                    prevCurrentShape: JSON.parse(JSON.stringify(lastHistoryState.currentShape || [])),
                    nextCurrentShape: JSON.parse(JSON.stringify(currentShape)),
                    prevVertexCount: lastHistoryState.globalVertexCount || 0,
                    nextVertexCount: globalVertexCount
                };

                historyStack.push(command);
                if (historyStack.length > 50) historyStack.shift();

                lastHistoryState = {
                    shapesMap: currentShapesMap,
                    order: currentOrder,
                    currentShape: JSON.parse(JSON.stringify(currentShape)),
                    globalVertexCount: globalVertexCount
                };
            }
        }

        // --- 메모리 최적화 Delta undo 함수 ---
        function undo() {
            if (historyStack.length === 0) return;

            const command = historyStack.pop();
            const shapesMap = { ...lastHistoryState.shapesMap };

            // 추가되었던 도형 제거
            for (let id in command.deltaAdded) {
                delete shapesMap[id];
            }
            // 삭제되었던 도형 복원
            for (let id in command.deltaRemoved) {
                shapesMap[id] = cloneShape(command.deltaRemoved[id]);
            }
            // 수정되었던 도형 이전 상태로 원복
            for (let id in command.deltaModified) {
                shapesMap[id] = cloneShape(command.deltaModified[id].before);
            }

            // 도형 순서 복원
            shapes = command.prevOrder.map(id => shapesMap[id]).filter(Boolean);
            currentShape = JSON.parse(JSON.stringify(command.prevCurrentShape));
            globalVertexCount = command.prevVertexCount;

            lastHistoryState = {
                shapesMap: shapesMap,
                order: [...command.prevOrder],
                currentShape: JSON.parse(JSON.stringify(currentShape)),
                globalVertexCount: globalVertexCount
            };

            dragState = null; hoverState = null; selectedShapeIndices = []; selectionBox = null;
            updatePanels(null); applyConstraints(); draw();
        }

        // --- 경사 하강법 (Gradient Descent) 기반 수치/2D 구속조건 최적화 해법기 (Constraint Solver) ---
        function applyConstraints() {
            const maxIterations = 30;
            const learningRate = 0.5;
            const eps = 1e-4;

            // 전체 시스템의 구속 오차 계산 함수
            function computeTotalError() {
                let error = 0;
                shapes.forEach(shape => {
                    // 부채꼴/활꼴 중심-반지름 동기화 구속 오차
                    if (shape.type === 'sector' || shape.type === 'segment') {
                        let C = shape[0], P1 = shape[1], P2 = shape[2];
                        if (C && P1 && P2) {
                            let R = Math.sqrt(dist2(C, P1));
                            let d2 = Math.sqrt(dist2(C, P2));
                            error += Math.pow(R - d2, 2);
                        }
                    }

                    // 부착점 (Point-on-Vertex / Point-on-Edge / Circle Edge) 구속 오차
                    shape.forEach(p => {
                        if (p.attachedTo) {
                            let att = p.attachedTo;
                            let targetShape = shapes.find(s => s.id === att.shapeId);
                            if (targetShape) {
                                let targetX = p.x, targetY = p.y;
                                if (att.type === 'vertex') {
                                    let targetV = targetShape[att.vertexIndex];
                                    if (targetV) { targetX = targetV.x; targetY = targetV.y; }
                                } else if (att.type === 'edge') {
                                    let p1 = targetShape[att.v1], p2 = targetShape[att.v2];
                                    if (p1 && p2) {
                                        targetX = p1.x + att.t * (p2.x - p1.x);
                                        targetY = p1.y + att.t * (p2.y - p1.y);
                                    }
                                } else if (att.type === 'circle_edge') {
                                    let C = targetShape[0], P1 = targetShape[1];
                                    if (C && P1) {
                                        let R = Math.sqrt(dist2(C, P1));
                                        targetX = C.x + R * Math.cos(att.angle);
                                        targetY = C.y + R * Math.sin(att.angle);
                                    }
                                }
                                error += Math.pow(p.x - targetX, 2) + Math.pow(p.y - targetY, 2);
                            }
                        }
                    });
                });
                return error;
            }

            // 오차 편미분 구배(Gradient)를 이용한 위치 반복 조정
            for (let iter = 0; iter < maxIterations; iter++) {
                let initialError = computeTotalError();
                if (initialError < 1e-6) break;

                let pointsToOptimize = [];
                shapes.forEach(shape => {
                    shape.forEach(p => {
                        if (p.attachedTo || shape.type === 'sector' || shape.type === 'segment') {
                            pointsToOptimize.push(p);
                        }
                    });
                });

                if (pointsToOptimize.length === 0) break;

                let maxGradient = 0;
                pointsToOptimize.forEach(p => {
                    let origX = p.x, origY = p.y;

                    // X 좌표 편미분 구배
                    p.x = origX + eps;
                    let errXPlus = computeTotalError();
                    p.x = origX - eps;
                    let errXMinus = computeTotalError();
                    p.x = origX;
                    let gradX = (errXPlus - errXMinus) / (2 * eps);

                    // Y 좌표 편미분 구배
                    p.y = origY + eps;
                    let errYPlus = computeTotalError();
                    p.y = origY - eps;
                    let errYMinus = computeTotalError();
                    p.y = origY;
                    let gradY = (errYPlus - errYMinus) / (2 * eps);

                    let gradMag = Math.sqrt(gradX * gradX + gradY * gradY);
                    if (gradMag > maxGradient) maxGradient = gradMag;

                    // 경사 하강 업데이트
                    p.x -= learningRate * gradX;
                    p.y -= learningRate * gradY;
                });

                if (maxGradient < 1e-4) break;
            }

            // 하드 코어 구속(절대 위치 동기화) 보정
            shapes.forEach(shape => {
                if (shape.type === 'sector' || shape.type === 'segment') {
                    let C = shape[0], P1 = shape[1], P2 = shape[2];
                    if (C && P1 && P2) {
                        let R = Math.sqrt(dist2(C, P1));
                        let a2 = Math.atan2(P2.y - C.y, P2.x - C.x);
                        P2.x = C.x + R * Math.cos(a2);
                        P2.y = C.y + R * Math.sin(a2);
                    }
                }
                shape.forEach(p => {
                    if (p.attachedTo && p.attachedTo.type === 'vertex') {
                        let targetShape = shapes.find(s => s.id === p.attachedTo.shapeId);
                        if (targetShape && targetShape[p.attachedTo.vertexIndex]) {
                            p.x = targetShape[p.attachedTo.vertexIndex].x;
                            p.y = targetShape[p.attachedTo.vertexIndex].y;
                        }
                    }
                });
            });
        }

        function resizeCanvas() {
            const rect = canvasContainer.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            canvas.width = rect.width * dpr; canvas.height = rect.height * dpr;
            if (originX === 0 && originY === 0) {
                originX = rect.width / 2; 
                originY = rect.height / 2;
            }
            ctx.scale(dpr, dpr); draw();
        }

        function getShapeBounds(shape) {
            let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
            const shapeType = shape.type || 'polygon';
            if (shapeType === 'circle') {
                const c = shape[0], p = shape[1];
                const r = Math.sqrt(dist2(c, p));
                minX = c.x - r; maxX = c.x + r;
                minY = c.y - r; maxY = c.y + r;
            } else {
                shape.forEach(p => {
                    if (p.x < minX) minX = p.x; if (p.x > maxX) maxX = p.x;
                    if (p.y < minY) minY = p.y; if (p.y > maxY) maxY = p.y;
                });
            }
            if (maxX - minX < 1) { minX -= 5; maxX += 5; }
            if (maxY - minY < 1) { minY -= 5; maxY += 5; }
            const pad = 3;
            return { 
                minX: minX - pad, minY: minY - pad, 
                maxX: maxX + pad, maxY: maxY + pad, 
                cx: (minX + maxX) / 2, cy: (minY + maxY) / 2 
            };
        }

        function getMultipleShapesBounds(indices) {
            let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
            indices.forEach(idx => {
                const s = shapes[idx];
                if (!s) return;
                const b = getShapeBounds(s);
                if (b.minX < minX) minX = b.minX;
                if (b.minY < minY) minY = b.minY;
                if (b.maxX > maxX) maxX = b.maxX;
                if (b.maxY > maxY) maxY = b.maxY;
            });
            if (minX === Infinity) return null;
            return { minX, minY, maxX, maxY, cx: (minX + maxX) / 2, cy: (minY + maxY) / 2 };
        }

        function isShapeInBox(shape, box) {
            const minX = Math.min(box.startX, box.endX);
            const maxX = Math.max(box.startX, box.endX);
            const minY = Math.min(box.startY, box.endY);
            const maxY = Math.max(box.startY, box.endY);

            const b = getShapeBounds(shape);
            return b.minX >= minX && b.maxX <= maxX && b.minY >= minY && b.maxY <= maxY;
        }

        function getPolygonArea(points) {
            let area = 0;
            for (let i = 0; i < points.length; i++) {
                let j = (i + 1) % points.length;
                area += (points[i].x * points[j].y) - (points[j].x * points[i].y);
            }
            return area / 2;
        }

        function getPolygonCentroid(points) {
            let cx = 0, cy = 0;
            points.forEach(p => { cx += p.x; cy += p.y; });
            return { x: cx / points.length, y: cy / points.length };
        }

        function drawGrid(rect) {
            let startX = -originX / globalScale, endX = (rect.width - originX) / globalScale;
            let startY = -originY / globalScale, endY = (rect.height - originY) / globalScale;
            let step = 10;
            ctx.save(); ctx.strokeStyle = '#e5e7eb'; ctx.lineWidth = 1 / globalScale; ctx.beginPath();
            for (let x = Math.floor(startX / step) * step; x <= endX; x += step) { ctx.moveTo(x, startY); ctx.lineTo(x, endY); }
            for (let y = Math.floor(startY / step) * step; y <= endY; y += step) { ctx.moveTo(startX, y); ctx.lineTo(endX, y); }
            ctx.stroke();
            ctx.strokeStyle = '#d1d5db'; ctx.lineWidth = 1.5 / globalScale; ctx.beginPath();
            for (let x = Math.floor(startX / 50) * 50; x <= endX; x += 50) { ctx.moveTo(x, startY); ctx.lineTo(x, endY); }
            for (let y = Math.floor(startY / 50) * 50; y <= endY; y += 50) { ctx.moveTo(startX, y); ctx.lineTo(endX, y); }
            ctx.stroke();
            ctx.strokeStyle = '#9ca3af'; ctx.lineWidth = 2 / globalScale; ctx.beginPath();
            ctx.moveTo(0, startY); ctx.lineTo(0, endY); ctx.moveTo(startX, 0); ctx.lineTo(endX, 0); ctx.stroke();
            ctx.fillStyle = '#6b7280'; ctx.font = `${12 / globalScale}px sans-serif`; ctx.textAlign = 'right'; ctx.textBaseline = 'top';
            ctx.fillText('0cm', -5 / globalScale, 5 / globalScale); ctx.restore();
        }

        function drawRulers(rect) {
            const rulerSize = 24;
            const pxPerCm = 50 * globalScale;
            
            ctx.save();
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            
            ctx.fillStyle = '#f8fafc';
            ctx.fillRect(0, 0, rect.width, rulerSize);
            ctx.fillRect(0, 0, rulerSize, rect.height);
            
            ctx.strokeStyle = '#cbd5e1'; ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(0, rulerSize); ctx.lineTo(rect.width, rulerSize);
            ctx.moveTo(rulerSize, 0); ctx.lineTo(rulerSize, rect.height);
            ctx.stroke();

            ctx.fillStyle = '#475569';
            ctx.font = '10px sans-serif';

            const minCmX = Math.floor((-originX) / pxPerCm);
            const maxCmX = Math.ceil((rect.width - originX) / pxPerCm);

            for (let cm = minCmX; cm <= maxCmX; cm++) {
                const screenX = originX + (cm * pxPerCm);
                if (screenX >= rulerSize && screenX <= rect.width) {
                    ctx.beginPath();
                    ctx.strokeStyle = (cm === 0) ? '#4f46e5' : '#94a3b8';
                    ctx.lineWidth = (cm === 0) ? 2 : 1;
                    ctx.moveTo(screenX, rulerSize);
                    ctx.lineTo(screenX, rulerSize - (cm % 5 === 0 ? 12 : 6));
                    ctx.stroke();

                    if (cm % 1 === 0) {
                        ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
                        ctx.fillText(`${cm}`, screenX, rulerSize - 13);
                    }
                }
            }

            const minCmY = Math.floor((-originY) / pxPerCm);
            const maxCmY = Math.ceil((rect.height - originY) / pxPerCm);

            for (let cm = minCmY; cm <= maxCmY; cm++) {
                const screenY = originY + (cm * pxPerCm);
                if (screenY >= rulerSize && screenY <= rect.height) {
                    ctx.beginPath();
                    ctx.strokeStyle = (cm === 0) ? '#4f46e5' : '#94a3b8';
                    ctx.lineWidth = (cm === 0) ? 2 : 1;
                    ctx.moveTo(rulerSize, screenY);
                    ctx.lineTo(rulerSize - (cm % 5 === 0 ? 12 : 6), screenY);
                    ctx.stroke();

                    if (cm % 1 === 0) {
                        ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
                        ctx.fillText(`${cm}`, rulerSize - 13, screenY);
                    }
                }
            }

            ctx.fillStyle = '#e2e8f0'; ctx.fillRect(0, 0, rulerSize, rulerSize);
            ctx.strokeStyle = '#cbd5e1'; ctx.strokeRect(0, 0, rulerSize, rulerSize);
            ctx.fillStyle = '#64748b'; ctx.font = 'bold 9px sans-serif';
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText('cm', rulerSize / 2, rulerSize / 2);

            ctx.restore();
        }

        function draw(isPrintPreview = false, targetIndicesOnly = null) {
            const rect = canvasContainer.getBoundingClientRect();
            ctx.clearRect(0, 0, rect.width, rect.height);
            ctx.save(); ctx.translate(originX, originY); ctx.scale(globalScale, globalScale);

            if (showGridCheck.checked && !isPrintPreview) drawGrid(rect);

            shapes.forEach((shape, sIdx) => {
                if (shape.length === 0) return;
                // 인쇄 미리보기 시 지정된 인덱스만 렌더링
                if (targetIndicesOnly && !targetIndicesOnly.includes(sIdx)) return;

                const shapeType = shape.type || 'polygon';
                
                const isHovered = (hoverState && hoverState.shapeIndex === sIdx);
                const isSelected = selectedShapeIndices.includes(sIdx);
                const isLocked = (lockedShapeIndex === sIdx);

                if (isSelected && !isPrintPreview) {
                    ctx.fillStyle = 'rgba(79, 70, 229, 0.25)'; ctx.strokeStyle = '#4338ca'; ctx.lineWidth = 4 / globalScale;
                } else if (isHovered && !isPrintPreview) {
                    ctx.fillStyle = 'rgba(99, 102, 241, 0.15)'; ctx.strokeStyle = '#6366f1'; ctx.lineWidth = 3.5 / globalScale;
                } else {
                    ctx.fillStyle = 'rgba(79, 70, 229, 0.05)'; ctx.strokeStyle = '#4f46e5'; ctx.lineWidth = 2.5 / globalScale;
                }
                ctx.lineJoin = 'round';

                if (shapeType === 'polygon') {
                    ctx.beginPath(); ctx.moveTo(shape[0].x, shape[0].y);
                    for (let i = 1; i < shape.length; i++) ctx.lineTo(shape[i].x, shape[i].y);
                    ctx.closePath(); ctx.fill(); ctx.stroke();
                } else if (shapeType === 'circle') {
                    const center = shape[0], edgePoint = shape[1], r = Math.sqrt(dist2(center, edgePoint));
                    ctx.beginPath(); ctx.arc(center.x, center.y, r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

                    if (shape[0].showLength !== false && shape.length >= 2) {
                        ctx.save();
                        ctx.beginPath();
                        ctx.setLineDash([4/globalScale, 4/globalScale]);
                        ctx.strokeStyle = '#4f46e5';
                        ctx.lineWidth = 1.8 / globalScale;
                        ctx.moveTo(center.x, center.y);
                        ctx.lineTo(edgePoint.x, edgePoint.y);
                        ctx.stroke();
                        ctx.restore();

                        const rCm = (r / 50).toFixed(1) + ' cm';
                        const displayRadiusStr = shape[0].customLength ? shape[0].customLength : `r = ${rCm}`;

                        const angle = Math.atan2(edgePoint.y - center.y, edgePoint.x - center.x);
                        const midX = (center.x + edgePoint.x) / 2 + Math.cos(angle + Math.PI/2) * (14/globalScale);
                        const midY = (center.y + edgePoint.y) / 2 + Math.sin(angle + Math.PI/2) * (14/globalScale);
                        
                        ctx.font = `bold italic ${13/globalScale}px sans-serif`;
                        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                        ctx.fillStyle = '#4f46e5';
                        ctx.fillText(displayRadiusStr, midX, midY);
                    }
                } else if (shapeType === 'line') {
                    ctx.beginPath(); ctx.moveTo(shape[0].x, shape[0].y); ctx.lineTo(shape[1].x, shape[1].y); ctx.stroke();
                }

                if (shapeType === 'polygon' || shapeType === 'line') {
                    let edges = [];
                    if (shapeType === 'polygon') { 
                        for (let i = 0; i < shape.length; i++) edges.push([i, (i + 1) % shape.length]); 
                    } else if (shapeType === 'line') {
                        edges.push([0, 1]);
                    }

                    edges.forEach(([v1, v2]) => {
                        const p1 = shape[v1], p2 = shape[v2];
                        if (p1.showLength !== false) {
                            const dx = p2.x - p1.x, dy = p2.y - p1.y;
                            const lengthPx = Math.sqrt(dx * dx + dy * dy);
                            let lengthStr = (lengthPx / 50).toFixed(1) + ' cm';
                            const displayLengthStr = p1.customLength ? p1.customLength : lengthStr;

                            let isCW = true; 
                            if (shape.length >= 3 && shapeType === 'polygon') isCW = getPolygonArea(shape) > 0;
                            let nx = isCW ? dy : -dy, ny = isCW ? -dx : dx;
                            let nLen = Math.sqrt(nx * nx + ny * ny);
                            if (nLen > 0) { nx /= nLen; ny /= nLen; } else { nx = 0; ny = -1; }

                            const midX = (p1.x + p2.x) / 2;
                            const midY = (p1.y + p2.y) / 2;
                            const curveOffset = 25 / globalScale; 
                            const controlX = midX + nx * curveOffset;
                            const controlY = midY + ny * curveOffset;

                            const textOffsetX = midX + nx * (curveOffset + (12/globalScale));
                            const textOffsetY = midY + ny * (curveOffset + (12/globalScale));

                            ctx.save();
                            ctx.beginPath();
                            ctx.setLineDash([4/globalScale, 4/globalScale]); 
                            ctx.strokeStyle = '#6b7280';
                            ctx.lineWidth = 1.5 / globalScale;
                            ctx.moveTo(p1.x, p1.y);
                            ctx.quadraticCurveTo(controlX, controlY, p2.x, p2.y);
                            ctx.stroke();
                            ctx.restore();

                            ctx.font = `italic ${13/globalScale}px sans-serif`; 
                            ctx.textAlign = 'center'; 
                            ctx.textBaseline = 'middle';
                            ctx.fillStyle = '#1f2937'; 
                            ctx.fillText(displayLengthStr, textOffsetX, textOffsetY);
                        }
                    });
                }

                if (shapeType === 'polygon') {
                    const isCW = getPolygonArea(shape) > 0;
                    shape.forEach((p2, i) => {
                        if (!p2.showAngle || shape.length < 3) return;
                        const p1 = shape[(i - 1 + shape.length) % shape.length], p3 = shape[(i + 1) % shape.length];
                        let a1 = Math.atan2(p1.y - p2.y, p1.x - p2.x), a2 = Math.atan2(p3.y - p2.y, p3.x - p2.x);
                        let angleCCW = a2 - a1; while (angleCCW < 0) angleCCW += 2 * Math.PI;
                        let interiorAngle = isCW ? (2 * Math.PI - angleCCW) : angleCCW;
                        if (interiorAngle >= 2 * Math.PI) interiorAngle -= 2 * Math.PI; 
                        
                        ctx.beginPath(); ctx.strokeStyle = 'rgba(245, 158, 11, 0.8)'; ctx.lineWidth = 2 / globalScale; ctx.fillStyle = 'rgba(245, 158, 11, 0.2)';
                        ctx.arc(p2.x, p2.y, 22 / globalScale, a1, a2, isCW); ctx.lineTo(p2.x, p2.y); ctx.fill(); ctx.stroke();

                        let angleDeg = (interiorAngle * 180 / Math.PI).toFixed(0) + '°';
                        const displayAngleStr = p2.customAngle ? p2.customAngle : angleDeg;

                        let midAngle = isCW ? (a1 - interiorAngle / 2) : (a1 + interiorAngle / 2);
                        const tx = p2.x + Math.cos(midAngle) * (36/globalScale), ty = p2.y + Math.sin(midAngle) * (36/globalScale);
                        ctx.font = `bold ${11/globalScale}px sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                        ctx.fillStyle = '#1f2937'; ctx.fillText(displayAngleStr, tx, ty);
                    });
                }

                const centroid = (shapeType === 'polygon' && shape.length >= 3) ? getPolygonCentroid(shape) : null;

                shape.forEach((p, vIdx) => {
                    const isCircleCenter = (shapeType === 'circle' && vIdx === 0);
                    const drawRadius = pointRadius / globalScale;

                    if (!isPrintPreview || isCircleCenter) {
                        ctx.beginPath();
                        const isPtHovered = (hoverState && hoverState.shapeIndex === sIdx && hoverState.vertexIndex === vIdx);
                        
                        if (isCircleCenter) {
                            ctx.fillStyle = '#000000';
                        } else {
                            ctx.fillStyle = p.attachedTo ? '#9333ea' : (isPtHovered ? '#f59e0b' : '#ef4444');
                        }
                        
                        ctx.arc(p.x, p.y, isPtHovered ? drawRadius + (2/globalScale) : drawRadius, 0, Math.PI * 2);
                        ctx.fill(); ctx.lineWidth = 1.5 / globalScale; ctx.strokeStyle = '#ffffff'; ctx.stroke();
                    }

                    if (p.label) {
                        ctx.font = `italic bold ${16/globalScale}px "Times New Roman", serif`; 
                        ctx.fillStyle = isCircleCenter ? '#000000' : '#111827'; 
                        
                        let labelX = p.x + (12/globalScale), labelY = p.y - (10/globalScale);
                        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

                        if (isCircleCenter) {
                            labelX = p.x - (14/globalScale); labelY = p.y - (14/globalScale);
                        } else if (centroid) {
                            let dirX = p.x - centroid.x, dirY = p.y - centroid.y;
                            let dist = Math.sqrt(dirX*dirX + dirY*dirY);
                            if (dist > 0) {
                                dirX /= dist; dirY /= dist;
                                labelX = p.x + dirX * (18/globalScale);
                                labelY = p.y + dirY * (18/globalScale);
                            }
                        }

                        ctx.fillText(p.label, labelX, labelY);
                    }
                });

                // 호버 피드백 하이라이트 (외곽 강조 피드백)
                if (isHovered && !isSelected && !isPrintPreview) {
                    ctx.save();
                    ctx.strokeStyle = '#6366f1';
                    ctx.lineWidth = 2.5 / globalScale;
                    ctx.setLineDash([6 / globalScale, 4 / globalScale]);
                    ctx.fillStyle = 'rgba(99, 102, 241, 0.08)';

                    if (shapeType === 'polygon') {
                        ctx.beginPath(); ctx.moveTo(shape[0].x, shape[0].y);
                        for (let i = 1; i < shape.length; i++) ctx.lineTo(shape[i].x, shape[i].y);
                        ctx.closePath(); ctx.fill(); ctx.stroke();
                    } else if (shapeType === 'circle') {
                        const center = shape[0], edgePoint = shape[1], r = Math.sqrt(dist2(center, edgePoint));
                        ctx.beginPath(); ctx.arc(center.x, center.y, r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
                    } else if (shapeType === 'line') {
                        ctx.beginPath(); ctx.moveTo(shape[0].x, shape[0].y); ctx.lineTo(shape[1].x, shape[1].y); ctx.stroke();
                    }
                    ctx.restore();
                }

                if (isLocked && !isPrintPreview && selectedShapeIndices.length === 1) {
                    const bounds = getShapeBounds(shape);
                    ctx.save();
                    
                    ctx.beginPath();
                    ctx.strokeStyle = '#2563eb'; 
                    ctx.lineWidth = 1 / globalScale;
                    ctx.strokeRect(bounds.minX, bounds.minY, bounds.maxX - bounds.minX, bounds.maxY - bounds.minY);
                    
                    ctx.fillStyle = '#ffffff';
                    const hw = 3.5 / globalScale; 
                    const handles = [
                        {x: bounds.minX, y: bounds.minY}, {x: bounds.cx, y: bounds.minY}, {x: bounds.maxX, y: bounds.minY},
                        {x: bounds.maxX, y: bounds.cy}, {x: bounds.maxX, y: bounds.maxY}, {x: bounds.cx, y: bounds.maxY},
                        {x: bounds.minX, y: bounds.maxY}, {x: bounds.minX, y: bounds.cy}
                    ];
                    
                    handles.forEach(h => {
                        ctx.fillRect(h.x - hw, h.y - hw, hw*2, hw*2);
                        ctx.strokeRect(h.x - hw, h.y - hw, hw*2, hw*2);
                    });
                    
                    ctx.restore();
                }
            });

            // 다중 선택 바운딩 박스 표시
            if (selectedShapeIndices.length > 1 && !isPrintPreview) {
                const multiBounds = getMultipleShapesBounds(selectedShapeIndices);
                if (multiBounds) {
                    ctx.save();
                    ctx.strokeStyle = '#4f46e5';
                    ctx.lineWidth = 1.5 / globalScale;
                    ctx.setLineDash([4 / globalScale, 4 / globalScale]);
                    ctx.strokeRect(multiBounds.minX, multiBounds.minY, multiBounds.maxX - multiBounds.minX, multiBounds.maxY - multiBounds.minY);
                    ctx.restore();
                }
            }

            // 호버 뱃지(도형 이름 툴팁) 표시 렌더링
            if (hoverState && hoverState.shapeIndex !== undefined && hoverState.shapeIndex >= 0 && !isPrintPreview && !dragState) {
                const hoveredShape = shapes[hoverState.shapeIndex];
                if (hoveredShape) {
                    const shapeName = getShapeName(hoveredShape);
                    const mouseX = lastMouseLogicalPos.x;
                    const mouseY = lastMouseLogicalPos.y;

                    ctx.save();
                    const fontSize = 12 / globalScale;
                    ctx.font = `bold ${fontSize}px sans-serif`;
                    const paddingX = 8 / globalScale;
                    const paddingY = 4 / globalScale;
                    const textWidth = ctx.measureText(shapeName).width;
                    const badgeW = textWidth + paddingX * 2;
                    const badgeH = fontSize + paddingY * 2;
                    
                    const badgeX = mouseX + (12 / globalScale);
                    const badgeY = mouseY + (12 / globalScale);

                    ctx.fillStyle = 'rgba(30, 41, 59, 0.85)';
                    ctx.shadowColor = 'rgba(0, 0, 0, 0.2)';
                    ctx.shadowBlur = 4 / globalScale;
                    ctx.beginPath();
                    if (ctx.roundRect) {
                        ctx.roundRect(badgeX, badgeY, badgeW, badgeH, 4 / globalScale);
                    } else {
                        ctx.rect(badgeX, badgeY, badgeW, badgeH);
                    }
                    ctx.fill();

                    ctx.shadowBlur = 0;
                    ctx.fillStyle = '#ffffff';
                    ctx.textAlign = 'left';
                    ctx.textBaseline = 'top';
                    ctx.fillText(shapeName, badgeX + paddingX, badgeY + paddingY);
                    ctx.restore();
                }
            }

            if (currentShape.length > 0 && !isPrintPreview) {
                if (drawType === 'polygon' || drawType === 'line') {
                    ctx.beginPath(); ctx.strokeStyle = '#4f46e5'; ctx.lineWidth = 2.5 / globalScale; ctx.lineJoin = 'round';
                    ctx.moveTo(currentShape[0].x, currentShape[0].y);
                    for (let i = 1; i < currentShape.length; i++) ctx.lineTo(currentShape[i].x, currentShape[i].y);
                    ctx.stroke();
                } else if (drawType === 'circle' && currentShape.length === 1) {
                    const center = currentShape[0];
                    ctx.beginPath(); ctx.fillStyle = '#000000';
                    ctx.arc(center.x, center.y, pointRadius / globalScale, 0, Math.PI * 2); ctx.fill();
                    ctx.font = `italic bold ${16/globalScale}px "Times New Roman", serif`; ctx.fillText('O', center.x - (14/globalScale), center.y - (14/globalScale));
                }

                currentShape.forEach((p, i) => {
                    ctx.beginPath();
                    let radius = pointRadius / globalScale;
                    if (i === 0 && currentShape.length > 2 && drawType === 'polygon') { ctx.fillStyle = '#10b981'; radius += (2/globalScale); } 
                    else { ctx.fillStyle = '#ef4444'; }
                    ctx.arc(p.x, p.y, radius, 0, Math.PI * 2);
                    ctx.fill(); ctx.lineWidth = 1.5 / globalScale; ctx.strokeStyle = '#ffffff'; ctx.stroke();
                });
            }

            if (selectionBox && !isPrintPreview) {
                ctx.save();
                ctx.setLineDash([6/globalScale, 6/globalScale]);
                ctx.strokeStyle = '#4f46e5';
                ctx.lineWidth = 2 / globalScale;
                ctx.fillStyle = 'rgba(79, 70, 229, 0.1)';
                
                const x = Math.min(selectionBox.startX, selectionBox.endX);
                const y = Math.min(selectionBox.startY, selectionBox.endY);
                const w = Math.abs(selectionBox.endX - selectionBox.startX);
                const h = Math.abs(selectionBox.endY - selectionBox.startY);

                ctx.fillRect(x, y, w, h);
                ctx.strokeRect(x, y, w, h);
                ctx.restore();
            }

            ctx.restore();

            if (showRulerCheck.checked && !isPrintPreview) drawRulers(rect);
        }

        // --- 계산된 좌표 기반 고해상도 SVG 벡터 변환 함수 ---
        function exportToSVG(targetIndices = null, customBounds = null) {
            let shapesToExport = [];
            if (targetIndices && targetIndices.length > 0) {
                shapesToExport = targetIndices.map(idx => shapes[idx]).filter(Boolean);
            } else {
                shapesToExport = shapes;
            }

            if (shapesToExport.length === 0) return null;

            let bounds = customBounds;
            if (!bounds) {
                if (targetIndices && targetIndices.length > 0) {
                    bounds = getMultipleShapesBounds(targetIndices);
                } else {
                    const allIndices = shapesToExport.map((_, idx) => idx);
                    bounds = getMultipleShapesBounds(allIndices);
                }
            }

            if (!bounds) return null;

            const pad = 20;
            const minX = bounds.minX - pad;
            const minY = bounds.minY - pad;
            const width = (bounds.maxX - bounds.minX) + pad * 2;
            const height = (bounds.maxY - bounds.minY) + pad * 2;

            let svgContent = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${minX} ${minY} ${width} ${height}" width="${width}" height="${height}">\n`;
            svgContent += `  <rect x="${minX}" y="${minY}" width="${width}" height="${height}" fill="#ffffff"/>\n`;

            shapesToExport.forEach(shape => {
                if (!shape || shape.length === 0) return;
                const shapeType = shape.type || 'polygon';

                if (shapeType === 'polygon') {
                    const pointsStr = shape.map(p => `${p.x.toFixed(2)},${p.y.toFixed(2)}`).join(' ');
                    svgContent += `  <polygon points="${pointsStr}" fill="rgba(79, 70, 229, 0.05)" stroke="#4f46e5" stroke-width="2.5" stroke-linejoin="round"/>\n`;
                } else if (shapeType === 'circle') {
                    const center = shape[0], edgePoint = shape[1];
                    const r = Math.sqrt(dist2(center, edgePoint));
                    svgContent += `  <circle cx="${center.x.toFixed(2)}" cy="${center.y.toFixed(2)}" r="${r.toFixed(2)}" fill="rgba(79, 70, 229, 0.05)" stroke="#4f46e5" stroke-width="2.5"/>\n`;

                    if (shape[0].showLength !== false && shape.length >= 2) {
                        svgContent += `  <line x1="${center.x.toFixed(2)}" y1="${center.y.toFixed(2)}" x2="${edgePoint.x.toFixed(2)}" y2="${edgePoint.y.toFixed(2)}" stroke="#4f46e5" stroke-width="1.8" stroke-dasharray="4,4"/>\n`;
                        const rCm = (r / 50).toFixed(1) + ' cm';
                        const displayRadiusStr = shape[0].customLength ? shape[0].customLength : `r = ${rCm}`;
                        const angle = Math.atan2(edgePoint.y - center.y, edgePoint.x - center.x);
                        const midX = (center.x + edgePoint.x) / 2 + Math.cos(angle + Math.PI / 2) * 14;
                        const midY = (center.y + edgePoint.y) / 2 + Math.sin(angle + Math.PI / 2) * 14;
                        svgContent += `  <text x="${midX.toFixed(2)}" y="${midY.toFixed(2)}" font-family="sans-serif" font-size="13" font-weight="bold" font-style="italic" fill="#4f46e5" text-anchor="middle" dominant-baseline="middle">${displayRadiusStr}</text>\n`;
                    }
                } else if (shapeType === 'line') {
                    svgContent += `  <line x1="${shape[0].x.toFixed(2)}" y1="${shape[0].y.toFixed(2)}" x2="${shape[1].x.toFixed(2)}" y2="${shape[1].y.toFixed(2)}" stroke="#4f46e5" stroke-width="2.5"/>\n`;
                }

                if (shapeType === 'polygon' || shapeType === 'line') {
                    let edges = [];
                    if (shapeType === 'polygon') {
                        for (let i = 0; i < shape.length; i++) edges.push([i, (i + 1) % shape.length]);
                    } else if (shapeType === 'line') {
                        edges.push([0, 1]);
                    }

                    edges.forEach(([v1, v2]) => {
                        const p1 = shape[v1], p2 = shape[v2];
                        if (p1.showLength !== false) {
                            const dx = p2.x - p1.x, dy = p2.y - p1.y;
                            const lengthPx = Math.sqrt(dx * dx + dy * dy);
                            let lengthStr = (lengthPx / 50).toFixed(1) + ' cm';
                            const displayLengthStr = p1.customLength ? p1.customLength : lengthStr;

                            let isCW = true;
                            if (shape.length >= 3 && shapeType === 'polygon') isCW = getPolygonArea(shape) > 0;
                            let nx = isCW ? dy : -dy, ny = isCW ? -dx : dx;
                            let nLen = Math.sqrt(nx * nx + ny * ny);
                            if (nLen > 0) { nx /= nLen; ny /= nLen; } else { nx = 0; ny = -1; }

                            const midX = (p1.x + p2.x) / 2;
                            const midY = (p1.y + p2.y) / 2;
                            const curveOffset = 25;
                            const controlX = midX + nx * curveOffset;
                            const controlY = midY + ny * curveOffset;
                            const textOffsetX = midX + nx * (curveOffset + 12);
                            const textOffsetY = midY + ny * (curveOffset + 12);

                            svgContent += `  <path d="M ${p1.x.toFixed(2)} ${p1.y.toFixed(2)} Q ${controlX.toFixed(2)} ${controlY.toFixed(2)} ${p2.x.toFixed(2)} ${p2.y.toFixed(2)}" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,4"/>\n`;
                            svgContent += `  <text x="${textOffsetX.toFixed(2)}" y="${textOffsetY.toFixed(2)}" font-family="sans-serif" font-size="13" font-style="italic" fill="#1f2937" text-anchor="middle" dominant-baseline="middle">${displayLengthStr}</text>\n`;
                        }
                    });
                }

                if (shapeType === 'polygon') {
                    const isCW = getPolygonArea(shape) > 0;
                    shape.forEach((p2, i) => {
                        if (!p2.showAngle || shape.length < 3) return;
                        const p1 = shape[(i - 1 + shape.length) % shape.length], p3 = shape[(i + 1) % shape.length];
                        let a1 = Math.atan2(p1.y - p2.y, p1.x - p2.x), a2 = Math.atan2(p3.y - p2.y, p3.x - p2.x);
                        let angleCCW = a2 - a1; while (angleCCW < 0) angleCCW += 2 * Math.PI;
                        let interiorAngle = isCW ? (2 * Math.PI - angleCCW) : angleCCW;
                        if (interiorAngle >= 2 * Math.PI) interiorAngle -= 2 * Math.PI;

                        const arcRadius = 22;
                        const startX = p2.x + arcRadius * Math.cos(a1);
                        const startY = p2.y + arcRadius * Math.sin(a1);
                        const endX = p2.x + arcRadius * Math.cos(a2);
                        const endY = p2.y + arcRadius * Math.sin(a2);
                        const sweepFlag = isCW ? 0 : 1;

                        svgContent += `  <path d="M ${p2.x.toFixed(2)} ${p2.y.toFixed(2)} L ${startX.toFixed(2)} ${startY.toFixed(2)} A ${arcRadius} ${arcRadius} 0 0 ${sweepFlag} ${endX.toFixed(2)} ${endY.toFixed(2)} Z" fill="rgba(245, 158, 11, 0.2)" stroke="rgba(245, 158, 11, 0.8)" stroke-width="2"/>\n`;

                        let angleDeg = (interiorAngle * 180 / Math.PI).toFixed(0) + '°';
                        const displayAngleStr = p2.customAngle ? p2.customAngle : angleDeg;
                        let midAngle = isCW ? (a1 - interiorAngle / 2) : (a1 + interiorAngle / 2);
                        const tx = p2.x + Math.cos(midAngle) * 36, ty = p2.y + Math.sin(midAngle) * 36;
                        svgContent += `  <text x="${tx.toFixed(2)}" y="${ty.toFixed(2)}" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1f2937" text-anchor="middle" dominant-baseline="middle">${displayAngleStr}</text>\n`;
                    });
                }

                const centroid = (shapeType === 'polygon' && shape.length >= 3) ? getPolygonCentroid(shape) : null;
                shape.forEach((p, vIdx) => {
                    const isCircleCenter = (shapeType === 'circle' && vIdx === 0);
                    if (isCircleCenter) {
                        svgContent += `  <circle cx="${p.x.toFixed(2)}" cy="${p.y.toFixed(2)}" r="4" fill="#000000"/>\n`;
                    }

                    if (p.label) {
                        let labelX = p.x + 12, labelY = p.y - 10;
                        if (isCircleCenter) {
                            labelX = p.x - 14; labelY = p.y - 14;
                        } else if (centroid) {
                            let dirX = p.x - centroid.x, dirY = p.y - centroid.y;
                            let dist = Math.sqrt(dirX * dirX + dirY * dirY);
                            if (dist > 0) {
                                labelX = p.x + (dirX / dist) * 18;
                                labelY = p.y + (dirY / dist) * 18;
                            }
                        }
                        svgContent += `  <text x="${labelX.toFixed(2)}" y="${labelY.toFixed(2)}" font-family="'Times New Roman', serif" font-size="16" font-weight="bold" font-style="italic" fill="${isCircleCenter ? '#000000' : '#111827'}" text-anchor="middle" dominant-baseline="middle">${p.label}</text>\n`;
                    }
                });
            });

            svgContent += `</svg>`;
            return svgContent;
        }

        function downloadSVG() {
            let svgString = null;
            if (selectionBox) {
                const minX = Math.min(selectionBox.startX, selectionBox.endX);
                const minY = Math.min(selectionBox.startY, selectionBox.endY);
                const maxX = Math.max(selectionBox.startX, selectionBox.endX);
                const maxY = Math.max(selectionBox.startY, selectionBox.endY);
                svgString = exportToSVG(null, { minX, minY, maxX, maxY });
            } else if (selectedShapeIndices.length > 0) {
                svgString = exportToSVG(selectedShapeIndices);
            } else {
                svgString = exportToSVG();
            }

            if (!svgString) return alert("다운로드할 도형 데이터가 없습니다.");

            const blob = new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `geometry_vector_${Date.now()}.svg`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
            showToast('📐 무한 해상도 SVG 다운로드 완료');
        }

        function dist2(v, w) { return (v.x - w.x)**2 + (v.y - w.y)**2; }
        function distToSegmentSquared(p, v, w) {
            let l2 = dist2(v, w); if (l2 === 0) return dist2(p, v);
            let t = Math.max(0, Math.min(1, ((p.x - v.x) * (w.x - v.x) + (p.y - v.y) * (w.y - v.y)) / l2));
            return dist2(p, { x: v.x + t * (w.x - v.x), y: v.y + t * (w.y - v.y) });
        }
        function distToSegment(p, v, w) { return Math.sqrt(distToSegmentSquared(p, v, w)); }

        function getHitTarget(x, y, ignoreShapeIndex = -1) {
            const p = {x, y};
            const clickTol = 6 / globalScale;
            
            if (lockedShapeIndex !== null && lockedShapeIndex !== ignoreShapeIndex && selectedShapeIndices.length === 1) {
                const bounds = getShapeBounds(shapes[lockedShapeIndex]);
                const hw = 6 / globalScale; 
                const handles = [
                    {x: bounds.minX, y: bounds.minY}, {x: bounds.cx, y: bounds.minY}, {x: bounds.maxX, y: bounds.minY},
                    {x: bounds.maxX, y: bounds.cy}, {x: bounds.maxX, y: bounds.maxY}, {x: bounds.cx, y: bounds.maxY},
                    {x: bounds.minX, y: bounds.maxY}, {x: bounds.minX, y: bounds.cy}
                ];
                for (let i = 0; i < handles.length; i++) {
                    if (Math.abs(x - handles[i].x) <= hw && Math.abs(y - handles[i].y) <= hw) {
                        return { type: 'bb_handle', shapeIndex: lockedShapeIndex, handleIndex: i, cx: bounds.cx, cy: bounds.cy };
                    }
                }
            }
            
            for (let sIdx = shapes.length - 1; sIdx >= 0; sIdx--) {
                if (sIdx === ignoreShapeIndex) continue;
                const shape = shapes[sIdx];
                for (let vIdx = 0; vIdx < shape.length; vIdx++) {
                    if (Math.sqrt(dist2(p, shape[vIdx])) <= (pointRadius / globalScale) + clickTol) return { type: 'vertex', shapeIndex: sIdx, vertexIndex: vIdx };
                }
            }
            for (let sIdx = shapes.length - 1; sIdx >= 0; sIdx--) {
                if (sIdx === ignoreShapeIndex) continue;
                const shape = shapes[sIdx], shapeType = shape.type || 'polygon';
                if (shapeType === 'circle') {
                    const C = shape[0], P1 = shape[1], R = Math.sqrt(dist2(C, P1)), d = Math.sqrt(dist2(p, C));
                    if (Math.abs(d - R) <= 8 / globalScale) return { type: 'circle_edge', shapeIndex: sIdx };
                }
                let edges = [];
                if (shapeType === 'polygon') { for (let i = 0; i < shape.length; i++) edges.push([i, (i+1)%shape.length]); }
                else if (shapeType === 'line') edges.push([0, 1]);
                for (let i = 0; i < edges.length; i++) {
                    if (distToSegment(p, shape[edges[i][0]], shape[edges[i][1]]) <= 8 / globalScale) return { type: 'edge', shapeIndex: sIdx, v1: edges[i][0], v2: edges[i][1] };
                }
            }
            for (let sIdx = shapes.length - 1; sIdx >= 0; sIdx--) {
                if (sIdx === ignoreShapeIndex) continue;
                const shape = shapes[sIdx], shapeType = shape.type || 'polygon';
                if (shapeType === 'polygon') {
                    ctx.beginPath(); ctx.moveTo(shape[0].x, shape[0].y);
                    for (let i = 1; i < shape.length; i++) ctx.lineTo(shape[i].x, shape[i].y);
                    ctx.closePath(); if (ctx.isPointInPath(x, y)) return { type: 'shape', shapeIndex: sIdx };
                } else if (shapeType === 'circle') {
                    const r = Math.sqrt(dist2(shape[0], shape[1]));
                    if (Math.sqrt(dist2(p, shape[0])) <= r) return { type: 'shape', shapeIndex: sIdx };
                }
            }
            return null;
        }

        function getPointerPos(e) {
            const rect = canvas.getBoundingClientRect();
            let clientX = e.touches ? e.touches[0].clientX : e.clientX;
            let clientY = e.touches ? e.touches[0].clientY : e.clientY;
            
            const scaleX = (canvas.width / (window.devicePixelRatio || 1)) / rect.width;
            const scaleY = (canvas.height / (window.devicePixelRatio || 1)) / rect.height;

            return { 
                x: (clientX - rect.left) * scaleX, 
                y: (clientY - rect.top) * scaleY 
            };
        }
        function getLogicalPos(pos) { 
            return { x: (pos.x - originX) / globalScale, y: (pos.y - originY) / globalScale }; 
        }

        function bringShapeToFront(index) {
            if (index >= 0 && index < shapes.length - 1) {
                const shapeToMove = shapes.splice(index, 1)[0];
                shapes.push(shapeToMove);
                const foundPos = selectedShapeIndices.indexOf(index);
                if (foundPos !== -1) {
                    selectedShapeIndices[foundPos] = shapes.length - 1;
                }
                saveHistory();
                return shapes.length - 1;
            }
            return index;
        }

        function getGroupIndices(shapeIndex) {
            const target = shapes[shapeIndex];
            if (!target || !target.groupId) return [shapeIndex];
            const gId = target.groupId;
            const result = [];
            shapes.forEach((s, idx) => {
                if (s.groupId === gId) result.push(idx);
            });
            return result;
        }

        function handlePointerDown(e) {
            if (e.button !== 0) return;
            contextMenu.classList.add('hidden');
            
            const physicalPos = getPointerPos(e); 
            
            if (isSpaceDown) {
                isPanning = true;
                panStartX = physicalPos.x - originX;
                panStartY = physicalPos.y - originY;
                canvas.style.cursor = 'grabbing';
                return;
            }
            
            const pos = getLogicalPos(physicalPos);
            const target = getHitTarget(pos.x, pos.y);
            
            if (target) {
                if (target.type === 'shape') {
                    const newIdx = bringShapeToFront(target.shapeIndex);
                    target.shapeIndex = newIdx;
                }

                const hitGroupIndices = getGroupIndices(target.shapeIndex);

                if (e.shiftKey) {
                    // Shift + 클릭: 기존 선택 토글 / 다중 선택 확장
                    hitGroupIndices.forEach(idx => {
                        const existingIdx = selectedShapeIndices.indexOf(idx);
                        if (existingIdx !== -1) {
                            selectedShapeIndices.splice(existingIdx, 1);
                        } else {
                            selectedShapeIndices.push(idx);
                        }
                    });
                } else {
                    // 선택되지 않은 도형 클릭 시 단일/그룹 선택으로 갱신
                    const isAlreadySelected = hitGroupIndices.every(idx => selectedShapeIndices.includes(idx));
                    if (!isAlreadySelected) {
                        selectedShapeIndices = [...hitGroupIndices];
                    }
                }
                
                setMode('select');
                updatePanels(lockedShapeIndex);
                draw();

                const shape = shapes[target.shapeIndex];
                dragState = { ...target, startX: pos.x, startY: pos.y, moved: false };

                if (selectedShapeIndices.length > 1 && (target.type === 'shape' || target.type === 'edge' || target.type === 'vertex')) {
                    dragState.type = 'multi_shapes';
                    dragState.origMultiShapes = selectedShapeIndices.map(sIdx => ({
                        index: sIdx,
                        shape: shapes[sIdx].map(p => ({ ...p }))
                    }));
                } else if (target.type === 'vertex') {
                    dragState.origV = { ...shape[target.vertexIndex] };
                } else if (target.type === 'edge') {
                    dragState.origV1 = { ...shape[target.v1] }; 
                    dragState.origV2 = { ...shape[target.v2] };
                } else if (target.type === 'shape' || target.type === 'bb_handle') {
                    dragState.origShape = shape.map(p => ({...p}));
                }
            } else {
                if (mode === 'select' && !e.shiftKey) {
                    selectedShapeIndices = [];
                    updatePanels(null);
                    draw();
                }
                dragState = { type: 'selection', startX: pos.x, startY: pos.y, moved: false };
            }
        }

        function handlePointerMove(e) {
            const physicalPos = getPointerPos(e); 
            
            if (isPanning) {
                originX = physicalPos.x - panStartX;
                originY = physicalPos.y - panStartY;
                draw();
                return;
            }
            
            const pos = getLogicalPos(physicalPos); 
            lastMouseLogicalPos = pos;

            const target = getHitTarget(pos.x, pos.y, dragState && dragState.shapeIndex !== undefined ? dragState.shapeIndex : -1);
            hoverState = target;

            if (selectedShapeIndices.length !== 1) {
                let activeShapeIndex = target ? target.shapeIndex : null;
                updatePanels(activeShapeIndex);
            } else {
                updatePanels(lockedShapeIndex, true);
            }

            if (dragState) {
                const dx = pos.x - dragState.startX, dy = pos.y - dragState.startY;
                if (Math.sqrt(dx*dx + dy*dy) > (5/globalScale)) {
                    dragState.moved = true;
                    if (mode === 'draw' && dragState.type === 'selection') {
                        setMode('select');
                    }
                }

                if (dragState.moved) {
                    if (dragState.type === 'selection') {
                        selectionBox = {
                            startX: dragState.startX,
                            startY: dragState.startY,
                            endX: pos.x,
                            endY: pos.y
                        };

                        if (mode === 'select') {
                            const newSelected = [];
                            shapes.forEach((s, idx) => {
                                if (isShapeInBox(s, selectionBox)) {
                                    newSelected.push(idx);
                                }
                            });
                            selectedShapeIndices = newSelected;
                            updatePanels(lockedShapeIndex);
                        }
                    } else {
                        const shape = shapes[dragState.shapeIndex];
                        if (dragState.type === 'multi_shapes') {
                            dragState.origMultiShapes.forEach(item => {
                                const targetS = shapes[item.index];
                                for (let i = 0; i < targetS.length; i++) {
                                    targetS[i].x = item.shape[i].x + dx;
                                    targetS[i].y = item.shape[i].y + dy;
                                }
                            });
                            applyConstraints();
                        }
                        else if (dragState.type === 'bb_handle') {
                            const origCx = dragState.cx;
                            const origCy = dragState.cy;
                            const startDist = Math.sqrt(Math.pow(dragState.startX - origCx, 2) + Math.pow(dragState.startY - origCy, 2));
                            const currentDist = Math.sqrt(Math.pow(pos.x - origCx, 2) + Math.pow(pos.y - origCy, 2));
                            
                            if (startDist > 0) {
                                let scale = currentDist / startDist;
                                if (dragState.handleIndex === 1 || dragState.handleIndex === 5) {
                                    scale = Math.abs(pos.y - origCy) / Math.abs(dragState.startY - origCy);
                                } else if (dragState.handleIndex === 3 || dragState.handleIndex === 7) {
                                    scale = Math.abs(pos.x - origCx) / Math.abs(dragState.startX - origCx);
                                }
                                if (scale > 0.01) {
                                    for (let i = 0; i < shape.length; i++) { 
                                        shape[i].x = origCx + (dragState.origShape[i].x - origCx) * scale; 
                                        shape[i].y = origCy + (dragState.origShape[i].y - origCy) * scale; 
                                    }
                                }
                            }
                            applyConstraints();
                        }
                        else if (dragState.type === 'vertex') {
                            let p = shape[dragState.vertexIndex];
                            if (p.attachedTo) {
                                let att = p.attachedTo, targetShape = shapes.find(s => s.id === att.shapeId);
                                if (targetShape && att.type === 'edge') {
                                    let p1 = targetShape[att.v1], p2 = targetShape[att.v2], l2 = dist2(p1, p2);
                                    if (l2 > 0) p.attachedTo.t = Math.max(0, Math.min(1, ((pos.x - p1.x) * (p2.x - p1.x) + (pos.y - p1.y) * (p2.y - p1.y)) / l2));
                                }
                            } else { p.x = dragState.origV.x + dx; p.y = dragState.origV.y + dy; }
                            applyConstraints();
                        } 
                        else if (dragState.type === 'edge') {
                            shape[dragState.v1].x = dragState.origV1.x + dx; shape[dragState.v1].y = dragState.origV1.y + dy;
                            shape[dragState.v2].x = dragState.origV2.x + dx; shape[dragState.v2].y = dragState.origV2.y + dy;
                            applyConstraints();
                        } 
                        else if (dragState.type === 'shape') {
                            for (let i = 0; i < shape.length; i++) { 
                                shape[i].x = dragState.origShape[i].x + dx; shape[i].y = dragState.origShape[i].y + dy; 
                            }
                            applyConstraints();
                        }
                    }
                }
                draw();
            } else {
                if (isSpaceDown) {
                    canvas.style.cursor = 'grab';
                } else if (!target) {
                    canvas.style.cursor = (mode === 'draw' ? 'crosshair' : 'default');
                } else if (target.type === 'bb_handle') {
                    const hIdx = target.handleIndex;
                    if (hIdx === 0 || hIdx === 4) canvas.style.cursor = 'nwse-resize';
                    else if (hIdx === 2 || hIdx === 6) canvas.style.cursor = 'nesw-resize';
                    else if (hIdx === 1 || hIdx === 5) canvas.style.cursor = 'ns-resize';
                    else if (hIdx === 3 || hIdx === 7) canvas.style.cursor = 'ew-resize';
                } else if (target.type === 'vertex') {
                    canvas.style.cursor = 'pointer';
                } else if (target.type === 'edge' || target.type === 'circle_edge') {
                    canvas.style.cursor = 'crosshair';
                } else if (target.type === 'shape') {
                    canvas.style.cursor = 'move';
                } else {
                    canvas.style.cursor = (mode === 'draw' ? 'crosshair' : 'default');
                }
                draw();
            }
        }
