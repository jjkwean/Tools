                    const p1 = shape[v1], p2 = shape[v2], lPx = Math.sqrt(dist2(p1, p2)), lCm = (lPx / 50).toFixed(1), lineName = `${p1.label||''}${p2.label||''}`;

                    const row = document.createElement('div'); row.className = 'flex items-center justify-between gap-2 p-1.5 bg-white border border-gray-100 rounded shadow-sm hover:shadow-md transition-shadow';
                    
                    const leftDiv = document.createElement('div'); leftDiv.className = 'flex items-center gap-1.5 shrink-0 w-16';
                    const check = document.createElement('input'); check.type = 'checkbox'; check.className = 'form-checkbox h-3.5 w-3.5 text-indigo-600 rounded'; check.checked = p1.showLength !== false; check.onchange = () => { p1.showLength = check.checked; saveHistory(); draw(); };
                    const label = document.createElement('span'); label.className = 'text-xs font-bold text-gray-700 truncate'; label.innerText = lineName ? `선${lineName}` : '선분';
                    leftDiv.appendChild(check); leftDiv.appendChild(label);
                    
                    const rightDiv = document.createElement('div'); rightDiv.className = 'flex items-center gap-1 flex-1 min-w-0 justify-end';
                    const decoSelect = document.createElement('select'); decoSelect.className = 'w-14 shrink-0 px-1 py-1 text-[11px] border border-gray-300 rounded focus:ring-1 focus:ring-indigo-500 bg-white cursor-pointer';
                    const decoOpts = [{val: '', text: '기호'}, {val: 'hatch1', text: '|'}, {val: 'hatch2', text: '||'}, {val: 'arrow1', text: '>'}, {val: 'arrow2', text: '>>'}];
                    decoOpts.forEach(opt => { const o = document.createElement('option'); o.value = opt.val; o.innerText = opt.text; if (p1.edgeDeco === opt.val) o.selected = true; decoSelect.appendChild(o); });
                    decoSelect.onchange = () => { p1.edgeDeco = decoSelect.value; saveHistory(); draw(); }; rightDiv.appendChild(decoSelect);
                    
                    const numInput = document.createElement('input'); numInput.type = 'number'; numInput.step = '0.5'; numInput.min = '0.1'; numInput.className = 'w-12 shrink-0 px-1 py-1 text-xs border border-gray-300 rounded focus:ring-1 focus:ring-indigo-500'; numInput.value = lCm;
                    numInput.onkeydown = (e) => { if(e.key==='Enter'){ applyEdgeLengthChange(shapeIndex, v1, v2, numInput.value); saveHistory(); } else if(e.key==='ArrowUp' || e.key==='ArrowDown') { setTimeout(() => { applyEdgeLengthChange(shapeIndex, v1, v2, numInput.value); }, 10); } };
                    numInput.onwheel = (e) => { e.preventDefault(); numInput.value = (parseFloat(numInput.value) + (e.deltaY > 0 ? -0.5 : 0.5)).toFixed(1); applyEdgeLengthChange(shapeIndex, v1, v2, numInput.value); };
                    
                    const textInput = document.createElement('input'); textInput.type = 'text'; textInput.placeholder = '변수(x)'; textInput.className = 'w-12 shrink-0 px-1 py-1 text-xs border border-gray-300 rounded focus:ring-1 focus:ring-indigo-500'; textInput.value = p1.customLength || ''; textInput.onchange = () => { p1.customLength = textInput.value; saveHistory(); draw(); };

                    rightDiv.appendChild(numInput); 
                    const unitSpan = document.createElement('span'); unitSpan.className = 'text-[10px] text-gray-500'; unitSpan.innerText = 'cm';
                    rightDiv.appendChild(unitSpan); rightDiv.appendChild(textInput);
                    row.appendChild(leftDiv); row.appendChild(rightDiv); multiEditForm.appendChild(row);
                });

                if (shapeType === 'polygon' && shape.length >= 3) {
                    const isCW = getPolygonArea(shape) > 0;
                    shape.forEach((p2, i) => {
                        const p1 = shape[(i - 1 + shape.length) % shape.length], p3 = shape[(i + 1) % shape.length];
                        let a1 = Math.atan2(p1.y - p2.y, p1.x - p2.x), a2 = Math.atan2(p3.y - p2.y, p3.x - p2.x);
                        let angleCCW = a2 - a1; while (angleCCW < 0) angleCCW += 2 * Math.PI; let interiorAngle = isCW ? (2 * Math.PI - angleCCW) : angleCCW; if (interiorAngle >= 2 * Math.PI) interiorAngle -= 2 * Math.PI; const deg = (interiorAngle * 180 / Math.PI).toFixed(0);

                        const row = document.createElement('div'); row.className = 'flex items-center justify-between gap-2 p-1.5 bg-white border border-gray-100 rounded shadow-sm hover:shadow-md transition-shadow';
                        const leftDiv = document.createElement('div'); leftDiv.className = 'flex items-center gap-1.5 shrink-0 w-16';
                        const check = document.createElement('input'); check.type = 'checkbox'; check.className = 'form-checkbox h-3.5 w-3.5 text-amber-500 rounded'; check.checked = p2.showAngle !== false; check.onchange = () => { p2.showAngle = check.checked; saveHistory(); draw(); };
                        const label = document.createElement('span'); label.className = 'text-xs font-bold text-gray-700 truncate'; label.innerText = `각${p2.label||''}`; leftDiv.appendChild(check); leftDiv.appendChild(label);
                        
                        const rightDiv = document.createElement('div'); rightDiv.className = 'flex items-center gap-1 flex-1 justify-end';
                        const numInput = document.createElement('input'); numInput.type = 'number'; numInput.step = '1'; numInput.min = '1'; numInput.max = '359'; numInput.className = 'w-14 shrink-0 px-1 py-1 text-xs border border-gray-300 rounded focus:ring-1 focus:ring-amber-500'; numInput.value = deg;
                        numInput.onkeydown = (e) => { if(e.key==='Enter'){ applyAngleChange(shapeIndex, i, numInput.value); saveHistory(); } else if(e.key==='ArrowUp' || e.key==='ArrowDown') { setTimeout(() => { applyAngleChange(shapeIndex, i, numInput.value); }, 10); } };
                        numInput.onwheel = (e) => { e.preventDefault(); numInput.value = (parseFloat(numInput.value) + (e.deltaY > 0 ? -1 : 1)).toFixed(0); applyAngleChange(shapeIndex, i, numInput.value); };
                        
                        const textInput = document.createElement('input'); textInput.type = 'text'; textInput.placeholder = '변수(a)'; textInput.className = 'flex-1 min-w-[50px] px-1 py-1 text-xs border border-gray-300 rounded focus:ring-1 focus:ring-amber-500'; textInput.value = p2.customAngle || ''; textInput.onchange = () => { p2.customAngle = textInput.value; saveHistory(); draw(); };

                        rightDiv.appendChild(numInput); const unitSpan = document.createElement('span'); unitSpan.className = 'text-[10px] text-gray-500'; unitSpan.innerText = '°';
                        rightDiv.appendChild(unitSpan); rightDiv.appendChild(textInput); row.appendChild(leftDiv); row.appendChild(rightDiv); multiEditForm.appendChild(row);
                    });
                }

                const pointTitle = document.createElement('div'); pointTitle.className = 'text-[10px] font-bold text-gray-400 mt-2 mb-1 pl-1'; pointTitle.innerText = '꼭짓점 라벨 변경'; multiEditForm.appendChild(pointTitle);
                const pointGrid = document.createElement('div'); pointGrid.className = 'grid grid-cols-2 gap-2';
                shape.forEach((p, i) => {
                    const row = document.createElement('div'); row.className = 'flex items-center gap-2 p-1.5 bg-white border border-gray-100 rounded shadow-sm';
                    const lbl = document.createElement('span'); lbl.className = 'text-[10px] text-gray-600 font-bold'; lbl.innerText = `점 ${i+1}`;
                    const inp = document.createElement('input'); inp.type = 'text'; inp.className = 'w-full px-1.5 py-0.5 text-xs border border-gray-300 rounded focus:ring-1 focus:ring-indigo-500 font-bold';
                    inp.value = p.label || ''; inp.onchange = () => { p.label = inp.value; saveHistory(); draw(); updatePanels(shapeIndex, true); };
                    row.appendChild(lbl); row.appendChild(inp); pointGrid.appendChild(row);
                });
                multiEditForm.appendChild(pointGrid);

            } else if (shapeType === 'circle' || shapeType === 'sector') {
                const c = shape[0], p1 = shape[1], rPx = Math.sqrt(dist2(c, p1)), rCm = (rPx / 50).toFixed(1);

                const row = document.createElement('div'); row.className = 'flex items-center justify-between gap-2 p-1.5 bg-white border border-gray-100 rounded shadow-sm hover:shadow-md transition-shadow';
                const leftDiv = document.createElement('div'); leftDiv.className = 'flex items-center gap-1.5 shrink-0 w-16';
                const check = document.createElement('input'); check.type = 'checkbox'; check.className = 'form-checkbox h-3.5 w-3.5 text-indigo-600 rounded'; check.checked = c.showLength !== false; check.onchange = () => { c.showLength = check.checked; saveHistory(); draw(); };
                const label = document.createElement('span'); label.className = 'text-xs font-bold text-gray-700 truncate'; label.innerText = '반지름'; leftDiv.appendChild(check); leftDiv.appendChild(label);
                
                const rightDiv = document.createElement('div'); rightDiv.className = 'flex items-center gap-1 flex-1 justify-end';
                const numInput = document.createElement('input'); numInput.type = 'number'; numInput.step = '0.5'; numInput.min = '0.1'; numInput.className = 'w-14 shrink-0 px-1 py-1 text-xs border border-gray-300 rounded focus:ring-1 focus:ring-indigo-500'; numInput.value = rCm;
                numInput.onkeydown = (e) => { if(e.key==='Enter'){ applyEdgeLengthChange(shapeIndex, 0, 1, numInput.value); saveHistory(); } else if(e.key==='ArrowUp' || e.key==='ArrowDown') { setTimeout(() => { applyEdgeLengthChange(shapeIndex, 0, 1, numInput.value); }, 10); } };
                numInput.onwheel = (e) => { e.preventDefault(); numInput.value = (parseFloat(numInput.value) + (e.deltaY > 0 ? -0.5 : 0.5)).toFixed(1); applyEdgeLengthChange(shapeIndex, 0, 1, numInput.value); };
                
                const textInput = document.createElement('input'); textInput.type = 'text'; textInput.placeholder = '변수(r)'; textInput.className = 'flex-1 min-w-[50px] px-1 py-1 text-xs border border-gray-300 rounded focus:ring-1 focus:ring-indigo-500'; textInput.value = c.customLength || ''; textInput.onchange = () => { c.customLength = textInput.value; saveHistory(); draw(); };

                rightDiv.appendChild(numInput); const unitSpan = document.createElement('span'); unitSpan.className = 'text-[10px] text-gray-500'; unitSpan.innerText = 'cm';
                rightDiv.appendChild(unitSpan); rightDiv.appendChild(textInput); row.appendChild(leftDiv); row.appendChild(rightDiv); multiEditForm.appendChild(row);

                if (shapeType === 'sector') {
                    const p2 = shape[2], a1 = Math.atan2(p1.y - c.y, p1.x - c.x), a2 = Math.atan2(p2.y - c.y, p2.x - c.x); let diff = a2 - a1; while (diff < 0) diff += Math.PI * 2; const deg = (diff * 180 / Math.PI).toFixed(0);

                    const angleRow = document.createElement('div'); angleRow.className = 'flex items-center justify-between gap-2 p-1.5 bg-white border border-gray-100 rounded shadow-sm hover:shadow-md transition-shadow';
                    const angleLeftDiv = document.createElement('div'); angleLeftDiv.className = 'flex items-center gap-1.5 shrink-0 w-16';
                    const angleCheck = document.createElement('input'); angleCheck.type = 'checkbox'; angleCheck.className = 'form-checkbox h-3.5 w-3.5 text-amber-500 rounded'; angleCheck.checked = c.showAngle !== false; angleCheck.onchange = () => { c.showAngle = angleCheck.checked; saveHistory(); draw(); };
                    const angleLabel = document.createElement('span'); angleLabel.className = 'text-xs font-bold text-gray-700 truncate'; angleLabel.innerText = '중심각'; angleLeftDiv.appendChild(angleCheck); angleLeftDiv.appendChild(angleLabel);
                    
                    const angleRightDiv = document.createElement('div'); angleRightDiv.className = 'flex items-center gap-1 flex-1 justify-end';
                    const angleNumInput = document.createElement('input'); angleNumInput.type = 'number'; angleNumInput.step = '1'; angleNumInput.min = '1'; angleNumInput.max = '359'; angleNumInput.className = 'w-14 shrink-0 px-1 py-1 text-xs border border-gray-300 rounded focus:ring-1 focus:ring-amber-500'; angleNumInput.value = deg;
                    angleNumInput.onkeydown = (e) => { if(e.key==='Enter'){ applyAngleChange(shapeIndex, 0, angleNumInput.value); saveHistory(); } else if(e.key==='ArrowUp' || e.key==='ArrowDown') { setTimeout(() => { applyAngleChange(shapeIndex, 0, angleNumInput.value); }, 10); } };
                    angleNumInput.onwheel = (e) => { e.preventDefault(); angleNumInput.value = (parseFloat(angleNumInput.value) + (e.deltaY > 0 ? -1 : 1)).toFixed(0); applyAngleChange(shapeIndex, 0, angleNumInput.value); };
                    
                    const angleTextInput = document.createElement('input'); angleTextInput.type = 'text'; angleTextInput.placeholder = '변수(x)'; angleTextInput.className = 'flex-1 min-w-[50px] px-1 py-1 text-xs border border-gray-300 rounded focus:ring-1 focus:ring-amber-500'; angleTextInput.value = c.customAngle || ''; angleTextInput.onchange = () => { c.customAngle = angleTextInput.value; saveHistory(); draw(); };

                    angleRightDiv.appendChild(angleNumInput); const unitSpanAngle = document.createElement('span'); unitSpanAngle.className = 'text-[10px] text-gray-500'; unitSpanAngle.innerText = '°';
                    angleRightDiv.appendChild(unitSpanAngle); angleRightDiv.appendChild(angleTextInput); angleRow.appendChild(angleLeftDiv); angleRow.appendChild(angleRightDiv); multiEditForm.appendChild(angleRow);
                }

                const pointTitle = document.createElement('div'); pointTitle.className = 'text-[10px] font-bold text-gray-400 mt-2 mb-1 pl-1'; pointTitle.innerText = '중심점 라벨 변경'; multiEditForm.appendChild(pointTitle);
                const rowLabel = document.createElement('div'); rowLabel.className = 'flex items-center gap-2 p-1.5 bg-white border border-gray-100 rounded shadow-sm';
                const lbl = document.createElement('span'); lbl.className = 'text-[10px] text-gray-600 font-bold'; lbl.innerText = `중심(원점)`;
                const inp = document.createElement('input'); inp.type = 'text'; inp.className = 'flex-1 px-1.5 py-0.5 text-xs border border-gray-300 rounded focus:ring-1 focus:ring-indigo-500 font-bold';
                inp.value = c.label || ''; inp.onchange = () => { c.label = inp.value; saveHistory(); draw(); updatePanels(shapeIndex, true); };
                rowLabel.appendChild(lbl); rowLabel.appendChild(inp); multiEditForm.appendChild(rowLabel);
            }
        }

        function deleteSelectedShapes() {
            if (selectedShapeIndices.length === 0) return;
            selectedShapeIndices.sort((a,b) => b-a).forEach(idx => {
                const shapeId = shapes[idx].id;
                shapes.forEach(s => { if(s.type !== 'text') s.forEach(p => { if (p.attachedTo && p.attachedTo.shapeId === shapeId) delete p.attachedTo; }); });
                shapes.splice(idx, 1);
            });
            selectedShapeIndices = []; updatePanels(null); applyConstraints(); saveHistory(); draw(); showToast('🗑️ 도형이 삭제되었습니다');
        }

        function setupEvents() {
            canvas.addEventListener('pointerdown', handlePointerDown); window.addEventListener('pointermove', handlePointerMove); window.addEventListener('pointerup', handlePointerUp); canvas.addEventListener('contextmenu', handleContextMenu);

            window.addEventListener('keydown', (e) => {
                if (e.key === 'Shift') { isShiftDown = true; if(mode==='draw') draw(); }
                if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
                if (e.code === 'Space') { isSpaceDown = true; if (!isPanning) canvas.style.cursor = 'grab'; }
                if (e.key === 'Delete' || e.key === 'Backspace') deleteSelectedShapes();
                if ((e.ctrlKey || e.metaKey) && e.key === 'z') { e.preventDefault(); undo(); }
                if (e.key === 'p' || e.key === 'P') { setDrawType('polygon'); showToast('✏️ 그리기 모드'); }
                if (e.key === 'v' || e.key === 'V') { setMode('select'); showToast('🖐 선택 모드'); }
                if (e.key === 't' || e.key === 'T') { setDrawType('text'); showToast('🔤 텍스트 라벨 입력 모드'); }
                if ((e.ctrlKey || e.metaKey) && e.key === 'g' && !e.shiftKey) { e.preventDefault(); groupSelectedShapes(); }
                if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key === 'G') { e.preventDefault(); ungroupSelectedShapes(); }

                if (e.key === 'u' || e.key === 'U') {
                    let released = 0;
                    if (hoverState && hoverState.type === 'vertex') { const p = shapes[hoverState.shapeIndex][hoverState.vertexIndex]; if (p.attachedTo) { delete p.attachedTo; released++; } } 
                    else if (selectedShapeIndices.length > 0) { selectedShapeIndices.forEach(sIdx => { if(shapes[sIdx].type !== 'text') shapes[sIdx].forEach(p => { if (p.attachedTo) { delete p.attachedTo; released++; } }); }); }
                    if (released > 0) { saveHistory(); draw(); showToast(`✂️ ${released}개의 구속이 해제되었습니다.`); }
                }
            });
            
            window.addEventListener('keyup', (e) => {
                if (e.key === 'Shift') { isShiftDown = false; if(mode==='draw') draw(); }
                if (e.code === 'Space') { isSpaceDown = false; if (!isPanning) canvas.style.cursor = (mode === 'draw') ? 'crosshair' : 'default'; }
            });

            canvasContainer.addEventListener('wheel', (e) => {
                if (e.ctrlKey || e.metaKey) { e.preventDefault(); const rect = canvas.getBoundingClientRect(), physicalX = e.clientX - rect.left, physicalY = e.clientY - rect.top; setZoomAtPoint(globalScale * (e.deltaY > 0 ? 0.9 : 1.1), physicalX, physicalY); }
            }, { passive: false });

            zoomInBtn.addEventListener('click', () => { setZoomAtPoint(globalScale * 1.2, originX + (canvasContainer.clientWidth / 2), originY + (canvasContainer.clientHeight / 2)); });
            zoomOutBtn.addEventListener('click', () => { setZoomAtPoint(globalScale * 0.8, originX + (canvasContainer.clientWidth / 2), originY + (canvasContainer.clientHeight / 2)); });
            zoomLevelText.addEventListener('click', () => { const cx = (canvasContainer.clientWidth / 2 - originX) / globalScale, cy = (canvasContainer.clientHeight / 2 - originY) / globalScale; globalScale = 1.0; originX = canvasContainer.clientWidth / 2 - cx * globalScale; originY = canvasContainer.clientHeight / 2 - cy * globalScale; updateZoomUI(); draw(); });

            modeDrawBtn.addEventListener('click', () => { if(drawType==='regular') drawType='polygon'; setMode('draw'); });
            modeSelectBtn.addEventListener('click', () => setMode('select'));
            drawPolygonBtn.addEventListener('click', () => setDrawType('polygon'));
            drawLineBtn.addEventListener('click', () => setDrawType('line'));
            drawCircleBtn.addEventListener('click', () => { setDrawType('circle'); tangentStartPoint = null; });
            drawTextBtn.addEventListener('click', () => setDrawType('text'));
            drawTangentBtn.addEventListener('click', () => { setDrawType('tangent'); tangentStartPoint = null; if(instructionBanner) instructionBanner.innerHTML = "💡 <strong>접선 모드:</strong> 원 외부의 <strong>한 점</strong>을 클릭하세요."; });
            drawRegularPolygonBtn.addEventListener('click', () => { regPolyModal.classList.remove('hidden'); });
            
            presetSelectBtns.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    presetSelectBtns.forEach(b => { b.classList.remove('active', 'bg-indigo-600', 'text-white', 'border-indigo-600'); b.classList.add('bg-white', 'text-gray-700', 'border-gray-300'); });
                    btn.classList.remove('bg-white', 'text-gray-700', 'border-gray-300'); btn.classList.add('active', 'bg-indigo-600', 'text-white', 'border-indigo-600');
                    
                    const preset = btn.dataset.preset; regularPolyParams.preset = preset;
                    sidesContainer.classList.add('hidden'); heightContainer.classList.add('hidden'); sectorAnglesContainer.classList.add('hidden');
                    
                    if (preset === 'regular') { sidesContainer.classList.remove('hidden'); regPolyLengthLabel.innerText = '한 변의 길이 (cm)'; } 
                    else if (preset === 'rectangle') { heightContainer.classList.remove('hidden'); regPolyLengthLabel.innerText = '가로 길이 (cm)'; regPolyHeightLabel.innerText = '세로 길이 (cm)'; } 
                    else if (preset === 'right_triangle') { heightContainer.classList.remove('hidden'); regPolyLengthLabel.innerText = '밑변 길이 (cm)'; regPolyHeightLabel.innerText = '높이 길이 (cm)'; } 
                    else if (preset === 'sector') { sectorAnglesContainer.classList.remove('hidden'); regPolyLengthLabel.innerText = '반지름 길이 (cm)'; }
                });
            });

            closeRegPolyModal.addEventListener('click', () => regPolyModal.classList.add('hidden')); cancelRegPolyBtn.addEventListener('click', () => regPolyModal.classList.add('hidden'));
            confirmRegPolyBtn.addEventListener('click', () => { regularPolyParams.sides = regPolySidesInput.value; regularPolyParams.lengthCm = regPolyLengthInput.value; regularPolyParams.heightCm = regPolyHeightInput.value; setDrawType('regular'); regPolyModal.classList.add('hidden'); showToast('🖱️ 캔버스에 중심점을 클릭하여 배치하세요'); });

            undoBtn.addEventListener('click', undo);
            clearBtn.addEventListener('click', () => { if (confirm('모든 도형을 지우시겠습니까?')) { shapes = []; currentShape = []; selectedShapeIndices = []; globalVertexCount = 0; updatePanels(null); saveHistory(); draw(); } });
            groupBtn.addEventListener('click', groupSelectedShapes); ungroupBtn.addEventListener('click', ungroupSelectedShapes);

            defaultAngleCheck.addEventListener('change', () => { shapes.forEach(s => { if(s.type !== 'text') s.forEach(p => { if (s.type === 'polygon' || s.type === 'sector') p.showAngle = defaultAngleCheck.checked; }); }); saveHistory(); draw(); updatePanels(lockedShapeIndex); });
            defaultLengthCheck.addEventListener('change', () => { shapes.forEach(s => { if(s.type !== 'text') s.forEach(p => { if (s.type === 'polygon' || s.type === 'line' || s.type === 'circle' || s.type === 'sector') p.showLength = defaultLengthCheck.checked; }); }); saveHistory(); draw(); updatePanels(lockedShapeIndex); });
            showGridCheck.addEventListener('change', () => draw()); showRulerCheck.addEventListener('change', () => draw());

            printSelectedBtn.addEventListener('click', printSelectedShapes); closePrintModal.addEventListener('click', closePrintPreviewModal); cancelPrintBtn.addEventListener('click', closePrintPreviewModal);
            execPrintBtn.addEventListener('click', () => {
                const printWindow = window.open('', '_blank');
                printWindow.document.write('<html><head><title>인쇄</title></head><body style="margin:0;display:flex;justify-content:center;align-items:center;height:100vh;">');
                printWindow.document.write('<img src="' + printPreviewImg.src + '" style="max-width:100%;max-height:100%;"/>');
                printWindow.document.write('</body></html>');
                printWindow.document.close(); printWindow.onload = () => { printWindow.focus(); printWindow.print(); printWindow.close(); };
            });
            downloadSvgBtn.addEventListener('click', downloadSVG); downloadPngBtn.addEventListener('click', downloadPNG); downloadPdfBtn.addEventListener('click', downloadPDF);
        }

        init();
    </script>
